name: Wire time tracker
on:
  push:
    branches: [reader-refactor-clean]
    paths: [js/reader/reading-time.js, .github/workflows/wire-time.yml]
permissions:
  contents: write
jobs:
  run:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reader-refactor-clean
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/app.js')
          s = p.read_text()
          a = "import { createReaderDisplay } from './reader/display.js?v=1';"
          if './reader/reading-time.js' not in s:
              s = s.replace(a, a + "\nimport { createReaderTimeTracker } from './reader/reading-time.js?v=1';")
          start = s.find("const READER_TIME_KEY = 'an2_reader_time_v1';")
          end = s.find('const READER_OWNER_KEY =', start)
          if start < 0 or end < 0: raise RuntimeError('time markers missing')
          block = "const READER_TIME_KEY = 'an2_reader_time_v1';\nconst readerTimeTracker = createReaderTimeTracker({ key: READER_TIME_KEY });\n\nfunction readerTimeToday() { return readerTimeTracker.today(); }\nfunction readerTimeAddSeconds(seconds) { return readerTimeTracker.addSeconds(seconds); }\nfunction readerTimeParagraphOpen() { return readerTimeTracker.openParagraph(); }\nfunction readerTimeParagraphClose() { return readerTimeTracker.closeParagraph(); }\n\n"
          p.write_text(s[:start] + block + s[end:])
          PY
          node --check js/app.js
          node --check js/reader/reading-time.js
      - run: |
          git diff --quiet -- js/app.js && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/app.js
          git commit -m 'refactor: wire reader time tracker'
          git push origin HEAD:reader-refactor-clean
