name: Android APK toc104 DeepSeek context cache

on:
  push:
    branches:
      - feature/77.42-toc104-deepseek-context-cache
    paths:
      - '.github/workflows/android-apk-toc104-deepseek-context-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reader-toc104-deepseek-context-cache
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/77.42-toc104-deepseek-context-cache
          fetch-depth: 0

      - name: Apply DeepSeek economy and context patch
        run: python3 scripts/patch-toc104-deepseek-context.py

      - name: Verify DeepSeek economy patch
        shell: bash
        run: |
          set -euo pipefail
          node --check js/reader-app.js
          node --check js/reader/word-lookup.js
          node --check js/app.js
          node --check functions/index.js
          grep -qF 'readerContextLexicalCacheKey' js/reader-app.js
          grep -qF 'Контекстный перевод из локального кэша' js/reader-app.js
          grep -qF 'Новый перевод сохранён только для этого контекста' js/reader-app.js
          grep -qF 'if (readerLexicalInFlight.has(inFlightKey))' js/reader-app.js
          grep -qF 'readerPutCachedContextLexical(word, context, payload' js/reader-app.js
          grep -qF 'english: entry.english || en' js/reader/word-lookup.js
          if grep -qF 'ru: `EN: ${en}`' js/reader/word-lookup.js; then
            echo 'CC-CEDICT still masks English as Russian' >&2
            exit 1
          fi
          grep -qF 'AS USED IN THIS SPECIFIC CONTEXT' functions/index.js
          grep -qF 'reader-app.js?v=77.33-deepseek-context' js/app.js
          grep -qF 'js/app.js?v=77.32-deepseek-context' index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('js/reader-app.js').read_text()
          assert s.count('if (readerLexicalInFlight.has(inFlightKey))') == 1
          assert s.count('readerLexicalInFlight.set(inFlightKey, p);') == 1
          assert 'if (!force) readerLexicalInFlight.set(inFlightKey, p);' not in s
          assert s.count('readerPutCachedContextLexical(word, context, payload') == 2
          assert s.count('readerPutCachedLexical(word, payload, readerCurrentLang());') == 1
          print('DeepSeek economy regression: OK')
          PY

      - name: Commit source patch to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/reader-app.js js/reader/word-lookup.js js/app.js index.html functions/index.js
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
          else
            git commit -m 'feat(reader): cache DeepSeek meaning per context'
            git fetch origin feature/77.42-toc104-deepseek-context-cache
            git rebase origin/feature/77.42-toc104-deepseek-context-cache
            git push origin HEAD:feature/77.42-toc104-deepseek-context-cache
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo '::warning::No shared signing key; install-over may fail.'
            exit 0
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/reader-ai.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/reader-ai.jks" >> "$GITHUB_ENV"

      - name: Validate Instant Translate remains absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e android/app/src/main/java/space/saintjust/reader/stage1/InstantTranslateActivity.java
          test ! -e android/app/src/main/java/space/saintjust/reader/stage1/InstantTranslateBridge.java
          test ! -e android/app/src/main/java/space/saintjust/reader/stage1/InstantTranslateCaptureService.java
          test ! -e android/app/src/main/java/space/saintjust/reader/stage1/InstantTranslateChatAccessibilityService.java
          test ! -e android/app/src/main/java/space/saintjust/reader/stage1/InstantTranslateChatBridge.java
          if grep -Eq 'InstantTranslate|screen.textcopy|BIND_ACCESSIBILITY_SERVICE' android/app/src/main/AndroidManifest.xml; then
            echo 'Manifest contains Instant Translate remnants' >&2
            exit 1
          fi

      - name: Wire maintained native translation bridges
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/wire-toc104-native-bridges.py

      - name: Prepare toc104 build identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          assert s.count('versionCode 118') == 1
          assert s.count("versionName '77.42-toc98'") == 1
          s=s.replace('versionCode 118','versionCode 124',1)
          s=s.replace("versionName '77.42-toc98'","versionName '77.42-toc104'",1)
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify toc104 APK and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -f "$APK"
          unzip -p "$APK" assets/www/js/reader-app.js | grep -qF 'readerContextLexicalCacheKey'
          unzip -p "$APK" assets/www/js/reader-app.js | grep -qF 'Новый перевод сохранён только для этого контекста'
          unzip -p "$APK" assets/www/js/reader/word-lookup.js | grep -qF 'English remains a cheap offline hint'
          if unzip -p "$APK" assets/www/js/reader/word-lookup.js | grep -qF 'ru: `EN: ${en}`'; then
            echo 'APK still masks English as Russian' >&2
            exit 1
          fi
          unzip -p "$APK" assets/www/js/app.js | grep -qF 'reader-app.js?v=77.33-deepseek-context'
          unzip -p "$APK" assets/www/index.html | grep -qF 'js/app.js?v=77.32-deepseek-context'
          if unzip -l "$APK" | grep -Eqi 'reader-instant|instant_translate|InstantTranslate'; then
            echo 'Instant Translate file survived into APK' >&2
            exit 1
          fi
          mkdir -p unique-out
          cp "$APK" unique-out/Reader-AI-77.42-toc104-build124.apk
          sha256sum unique-out/Reader-AI-77.42-toc104-build124.apk | tee unique-out/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reader-AI-77.42-toc104-build124
          path: |
            unique-out/Reader-AI-77.42-toc104-build124.apk
            unique-out/SHA256.txt
          if-no-files-found: error
          retention-days: 30
