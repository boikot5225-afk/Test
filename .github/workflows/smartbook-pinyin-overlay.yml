name: Smart Book pinyin overlay

on:
  push:
    branches:
      - feature/smartbook-chinese-pinyin
    paths:
      - data/zh_dict_core.json
      - tools/smartbook-chinese-pinyin/src/**
      - tools/smartbook-pinyin-overlay/**
      - .github/workflows/smartbook-pinyin-overlay.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartbook-pinyin-overlay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate offline pinyin dictionary
        run: |
          python3 tools/smartbook-chinese-pinyin/tools/build_lexicon.py \
            data/zh_dict_core.json \
            tools/smartbook-pinyin-overlay/app/src/main/assets/zh_pinyin.tsv.gz

      - name: Run geometry regression tests
        run: gradle -p tools/smartbook-pinyin-overlay :app:testDebugUnitTest --no-daemon

      - name: Build overlay APK
        run: gradle -p tools/smartbook-pinyin-overlay :app:assembleDebug --no-daemon

      - name: Verify APK
        run: |
          set -euo pipefail
          mkdir -p build/smartbook-pinyin-overlay
          APK="$(find tools/smartbook-pinyin-overlay/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" build/smartbook-pinyin-overlay/SmartBook-Pinyin-Overlay-v0.6.0.apk
          OUT=build/smartbook-pinyin-overlay/SmartBook-Pinyin-Overlay-v0.6.0.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT" \
            | tee build/smartbook-pinyin-overlay/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT" \
            | tee build/smartbook-pinyin-overlay/badging.txt
          grep -q "package: name='com.bulat.smartbookoverlay'" build/smartbook-pinyin-overlay/badging.txt
          grep -q "versionCode='6' versionName='0.6.0'" build/smartbook-pinyin-overlay/badging.txt

          python3 - "$OUT" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'corrupt APK entry: {bad}')
              names = set(z.namelist())
              required = {
                  'AndroidManifest.xml',
                  'assets/zh_pinyin.tsv',
                  'res/xml/pinyin_accessibility_service.xml',
                  'classes.dex',
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'missing required APK entries: {missing}')
              asset = z.getinfo('assets/zh_pinyin.tsv')
              if asset.file_size < 500_000:
                  raise SystemExit(f'pinyin dictionary unexpectedly small: {asset.file_size}')
          print('APK structure and pinyin dictionary verified')
          PY

          {
            echo 'Smart Book Pinyin Overlay v0.6.0'
            echo "Git commit: $GITHUB_SHA"
            echo "Built at UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "SHA-256: $(sha256sum "$OUT" | cut -d' ' -f1)"
            echo 'Package: com.bulat.smartbookoverlay'
            echo 'Target app: com.kursx.smartbook (original APK remains untouched)'
            echo 'Display: transparent ruby labels; screen coordinates converted to the overlay view local origin'
            echo 'Vertical placement: padded label bottom remains at least 4dp above the Chinese word rectangle'
            echo 'Vocabulary: current Smart Book red/pink study highlighting only; no guessed/persisted words'
            echo 'Detection: full-display screenshot sampled inside exact per-character rectangles'
            echo 'Regression: Galaxy A54 screenshot geometry requires 概率 → gàilǜ with no glyph overlap'
            echo 'Network permission: none'
          } > build/smartbook-pinyin-overlay/BUILD_INFO.txt

      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: SmartBook-Pinyin-Overlay-v0.6.0
          path: |
            build/smartbook-pinyin-overlay/SmartBook-Pinyin-Overlay-v0.6.0.apk
            build/smartbook-pinyin-overlay/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14

      - name: Record build status
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          BRANCH="$GITHUB_REF_NAME"
          git fetch origin "$BRANCH"
          NEWER_SOURCE_CHANGES="$(git diff --name-only "$GITHUB_SHA..origin/$BRANCH" | grep -v '^\.ci-status/' || true)"
          if [[ -n "$NEWER_SOURCE_CHANGES" ]]; then
            echo 'A newer source commit exists; skip stale status publication.'
            exit 0
          fi

          APK_SHA=''
          if [[ -f build/smartbook-pinyin-overlay/SmartBook-Pinyin-Overlay-v0.6.0.apk ]]; then
            APK_SHA="$(sha256sum build/smartbook-pinyin-overlay/SmartBook-Pinyin-Overlay-v0.6.0.apk | cut -d' ' -f1)"
          fi

          git checkout -B "$BRANCH" "origin/$BRANCH"
          mkdir -p .ci-status
          jq -n \
            --arg status "$BUILD_STATUS" \
            --arg workflow_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg artifact_id "$ARTIFACT_ID" \
            --arg apk_sha256 "$APK_SHA" \
            --arg finished_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{status:$status,workflow_sha:$workflow_sha,run_id:$run_id,run_url:$run_url,artifact:"SmartBook-Pinyin-Overlay-v0.6.0",artifact_id:$artifact_id,apk_sha256:$apk_sha256,finished_at:$finished_at}' \
            > .ci-status/smartbook-pinyin-overlay.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci-status/smartbook-pinyin-overlay.json
          git commit -m 'ci: record Smart Book pinyin overlay status' || exit 0
          git push origin "HEAD:$BRANCH"
