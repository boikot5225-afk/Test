name: Finalize Migaku Chinese vocabulary asset

on:
  push:
    branches:
      - tmp-recover-migaku-extension-20260825

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/77.42-epub-toc
          fetch-depth: 0

      - name: Verify target base
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected='cba076a7fcfb5d1a3dcd52f10ba106f52f5e8528'
          echo "target HEAD: $actual"
          test "$actual" = "$expected" || { echo "target branch moved; refusing to patch unexpected HEAD"; exit 1; }

      - name: Extract exact Migaku Mandarin frequency asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/ext
          url='https://clients2.google.com/service/update2/crx?response=redirect&prodversion=131.0&acceptformat=crx2,crx3&x=id%3Dlkhiljgmbeecmljiogckofcalncmfnfo%26uc'
          curl -fL --retry 4 --retry-delay 2 --connect-timeout 30 --max-time 600 "$url" -o recovery/migaku.crx
          sha256sum recovery/migaku.crx
          python3 - <<'PY'
          from pathlib import Path
          import struct
          b=Path('recovery/migaku.crx').read_bytes()
          if b[:4] != b'Cr24': raise SystemExit('not a CRX')
          v=struct.unpack('<I',b[4:8])[0]
          if v==2:
              a,c=struct.unpack('<II',b[8:16]); off=16+a+c
          elif v==3:
              h=struct.unpack('<I',b[8:12])[0]; off=12+h
          else: raise SystemExit(f'unsupported CRX {v}')
          Path('recovery/ext.zip').write_bytes(b[off:])
          print('CRX',v,'ZIP offset',off)
          PY
          unzip -q recovery/ext.zip -d recovery/ext
          python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib, json
          root=Path('recovery/ext')
          found=[]
          sig='Fen=[["我","0"],["的","0"],["你","0"]'
          for p in root.rglob('*.js'):
              try: t=p.read_text('utf-8',errors='replace')
              except OSError: continue
              if sig in t and '竭尽全力' in t and '据我所知' in t: found.append((p,t))
          if len(found)!=1: raise SystemExit(f'expected one Fen bundle, found {len(found)}')
          p,t=found[0]
          start=t.index('Fen=[')+len('Fen=')
          level=0; string=False; esc=False; end=None
          for i in range(start,len(t)):
              ch=t[i]
              if string:
                  if esc: esc=False
                  elif ch=='\\': esc=True
                  elif ch=='"': string=False
              else:
                  if ch=='"': string=True
                  elif ch=='[': level+=1
                  elif ch==']':
                      level-=1
                      if level==0: end=i+1; break
          if end is None: raise SystemExit('Fen array end not found')
          rows=json.loads(t[start:end])
          words=[r[0].strip() for r in rows if isinstance(r,list) and r and isinstance(r[0],str)]
          if len(words)!=39999: raise SystemExit(f'length {len(words)} != 39999')
          if len(set(words))!=39999: raise SystemExit('duplicates in Fen')
          expected={1:'我',2:'的',3:'你',7:'我们',4769:'天天',4987:'竭尽全力',4997:'据我所知',5000:'围绕',39999:words[-1]}
          for rank,want in expected.items():
              got=words[rank-1]
              if got!=want: raise SystemExit(f'#{rank} {got!r} != {want!r}')
          payload=('\n'.join(words)+'\n').encode()
          plain=hashlib.sha256(payload).hexdigest()
          if plain!='e656865c38735d4a314d13e91a02a5ba6589361ecceaf93a52f20a9cba70fd64':
              raise SystemExit(f'full-list SHA mismatch: {plain}')
          out=Path('data/zh_vocab_frequency.txt.gz')
          with out.open('wb') as raw:
              with gzip.GzipFile(filename='',mode='wb',fileobj=raw,compresslevel=9,mtime=0) as gz: gz.write(payload)
          print('bundle:',p)
          print('words:',len(words),'unique:',len(set(words)))
          print('first20:',words[:20])
          print('4981-5000:',words[4980:5000])
          print('plain sha256:',plain)
          print('gzip sha256:',hashlib.sha256(out.read_bytes()).hexdigest())
          print('gzip bytes:',out.stat().st_size)
          PY

      - name: Patch vocabulary layer and bump toc40
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/reader/vocab-estimate.js'); t=p.read_text('utf-8')
          patches=[
            ("const DATA_URL = 'data/zh_vocab_frequency.txt.gz';","const DATA_URL = 'data/zh_vocab_frequency.txt.gz?v=40';"),
            ("const STYLE_ID = 'reader-migaku-vocab-style-v2';","const STYLE_ID = 'reader-migaku-vocab-style-v3';"),
            ("""function manualKnowledge(state) {\n  const explicit = String(state?.manualKnowledge || '').toLowerCase();\n  if (explicit === 'known' || explicit === 'unknown') return explicit;\n  // Compatibility with Reader AI states created before this two-state layer.\n  if (state?.known && state?.autoKnown === false) return 'known';\n  if (state?.saved || ['problem', 'hard', 'learning', 'familiar'].includes(String(state?.status || '').toLowerCase())) {\n    return 'unknown';\n  }\n  return '';\n}\n""","""function manualKnowledge(state) {\n  const explicit = String(state?.manualKnowledge || '').toLowerCase();\n  return explicit === 'known' || explicit === 'unknown' ? explicit : '';\n}\n"""),
            ("""      const data = buildFrequencyData(text.split(/\\r?\\n/).map(x => x.trim()).filter(Boolean));\n      if (data.words.length !== 39999) throw new Error(`frequency list length ${data.words.length}, expected 39999`);\n      frequencyData = data;\n""","""      const data = buildFrequencyData(text.split(/\\r?\\n/).map(x => x.trim()).filter(Boolean));\n      if (data.words.length !== 39999) throw new Error(`frequency list length ${data.words.length}, expected 39999`);\n      if (data.rank.size !== 39999) throw new Error(`frequency list has ${39999 - data.rank.size} duplicate terms`);\n      const sentinels = [[0, '我'], [1, '的'], [6, '我们'], [4768, '天天'], [4986, '竭尽全力'], [4996, '据我所知'], [4999, '围绕']];\n      for (const [index, expected] of sentinels) {\n        if (data.words[index] !== expected) throw new Error(`frequency list mismatch at #${index + 1}: ${data.words[index] || '∅'} != ${expected}`);\n      }\n      frequencyData = data;\n"""),
            ("if (globalThis.__readerVocabularyEstimateVersion === 3) return;\n  globalThis.__readerVocabularyEstimateVersion = 3;","if (globalThis.__readerVocabularyEstimateVersion === 4) return;\n  globalThis.__readerVocabularyEstimateVersion = 4;"),
          ]
          for old,new in patches:
              if old not in t: raise SystemExit('vocab patch anchor missing: '+old[:80])
              t=t.replace(old,new,1)
          p.write_text(t,'utf-8')
          p=Path('js/reader/interactions-runtime.js'); t=p.read_text('utf-8')
          old="import './zh-vocab-data-bridge.js?v=1';\nimport './vocab-estimate.js?v=3';"
          if old not in t: raise SystemExit('runtime anchor missing')
          p.write_text(t.replace(old,"import './vocab-estimate.js?v=4';",1),'utf-8')
          p=Path('android/app/build.gradle'); t=p.read_text('utf-8')
          if "versionCode 59" not in t or "versionName '77.42-toc39'" not in t: raise SystemExit('unexpected version')
          p.write_text(t.replace('versionCode 59','versionCode 60',1).replace("versionName '77.42-toc39'","versionName '77.42-toc40'",1),'utf-8')
          PY
          rm -rf data/zh_vocab_b64
          rm -f data/zh_vocab_frequency_{0,1,2,3,4,5,6,7}.txt
          rm -f js/reader/zh-vocab-data-bridge.js

      - name: Validate toc40 and commit
        shell: bash
        run: |
          set -euo pipefail
          node --check js/reader/vocab-estimate.js
          node --check js/reader/interactions-runtime.js
          python3 - <<'PY'
          from pathlib import Path
          import gzip,hashlib
          words=gzip.decompress(Path('data/zh_vocab_frequency.txt.gz').read_bytes()).decode().splitlines()
          assert len(words)==39999 and len(set(words))==39999
          assert hashlib.sha256(('\n'.join(words)+'\n').encode()).hexdigest()=='e656865c38735d4a314d13e91a02a5ba6589361ecceaf93a52f20a9cba70fd64'
          assert words[:20]==['我','的','你','了','是','在','我们','这','个','他','不','一','好','会','吗','很','有','人','到','就']
          assert words[4768]=='天天' and words[4986]=='竭尽全力' and words[4996]=='据我所知' and words[4999]=='围绕'
          print('exact Migaku asset verified')
          PY
          test ! -e js/reader/zh-vocab-data-bridge.js
          test ! -e data/zh_vocab_b64
          ! grep -qF 'zh-vocab-data-bridge.js' js/reader/interactions-runtime.js
          grep -qF "import './vocab-estimate.js?v=4'" js/reader/interactions-runtime.js
          grep -qF 'return explicit ===' js/reader/vocab-estimate.js
          grep -qF 'versionCode 60' android/app/build.gradle
          grep -qF "versionName '77.42-toc40'" android/app/build.gradle
          git diff --check
          rm -rf recovery
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git diff --cached --stat
          git commit -m 'fix(reader): ship exact Migaku Mandarin frequency list'
          echo "FINAL_SHA=$(git rev-parse HEAD)"
          git push origin HEAD:feature/77.42-epub-toc
