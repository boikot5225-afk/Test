name: Finalize and build Reader AI toc40

on:
  push:
    branches:
      - tmp-recover-migaku-extension-20260825

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/77.42-epub-toc
          fetch-depth: 0

      - name: Verify and patch Android gzip asset path
        shell: bash
        run: |
          set -euo pipefail
          expected='fa9b6270ce2c2325750b587b09d801e76ec150f1'
          actual="$(git rev-parse HEAD)"
          echo "base SHA=$actual"
          test "$actual" = "$expected" || { echo "feature branch moved unexpectedly"; exit 1; }

          python3 - <<'PY'
          from pathlib import Path

          p=Path('js/reader/vocab-estimate.js')
          t=p.read_text('utf-8')
          old="const DATA_URL = 'data/zh_vocab_frequency.txt.gz?v=40';"
          new="""const DATA_URL = globalThis.location?.hostname === 'appassets.androidplatform.net'\n  ? 'data/zh_vocab_frequency.txt'\n  : 'data/zh_vocab_frequency.txt.gz?v=40';"""
          if old not in t: raise SystemExit('DATA_URL anchor missing')
          t=t.replace(old,new,1)
          old="if (globalThis.__readerVocabularyEstimateVersion === 4) return;\n  globalThis.__readerVocabularyEstimateVersion = 4;"
          new="if (globalThis.__readerVocabularyEstimateVersion === 5) return;\n  globalThis.__readerVocabularyEstimateVersion = 5;"
          if old not in t: raise SystemExit('version guard anchor missing')
          p.write_text(t.replace(old,new,1),'utf-8')

          p=Path('js/reader/interactions-runtime.js')
          t=p.read_text('utf-8')
          old="import './vocab-estimate.js?v=4';"
          new="import './vocab-estimate.js?v=5';"
          if old not in t: raise SystemExit('runtime import anchor missing')
          p.write_text(t.replace(old,new,1),'utf-8')
          PY

          node --check js/reader/vocab-estimate.js
          node --check js/reader/interactions-runtime.js
          git diff --check
          grep -qF "? 'data/zh_vocab_frequency.txt'" js/reader/vocab-estimate.js
          grep -qF ": 'data/zh_vocab_frequency.txt.gz?v=40';" js/reader/vocab-estimate.js
          grep -qF "import './vocab-estimate.js?v=5'" js/reader/interactions-runtime.js
          grep -qF '__readerVocabularyEstimateVersion === 5' js/reader/vocab-estimate.js

      - name: Verify exact Migaku source asset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import gzip,hashlib
          raw=Path('data/zh_vocab_frequency.txt.gz').read_bytes()
          words=gzip.decompress(raw).decode('utf-8').splitlines()
          sha=hashlib.sha256(('\n'.join(words)+'\n').encode()).hexdigest()
          assert len(words)==39999 and len(set(words))==39999
          assert sha=='e656865c38735d4a314d13e91a02a5ba6589361ecceaf93a52f20a9cba70fd64',sha
          assert words[:20]==['我','的','你','了','是','在','我们','这','个','他','不','一','好','会','吗','很','有','人','到','就']
          assert words[4768]=='天天' and words[4986]=='竭尽全力' and words[4996]=='据我所知' and words[4999]=='围绕'
          print('source Migaku list verified',sha)
          PY

      - name: Commit Android asset-path fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add js/reader/vocab-estimate.js js/reader/interactions-runtime.js
          git diff --cached --check
          git commit -m 'fix(reader): load AAPT-stripped gzip asset on Android'
          final_sha="$(git rev-parse HEAD)"
          echo "FINAL_SOURCE_SHA=$final_sha" | tee /tmp/source-sha.txt
          git push origin HEAD:feature/77.42-epub-toc

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo '::warning::No signing secret: debug signing key will be runner-local.'
            exit 0
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/reader-ai.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/reader-ai.jks" >> "$GITHUB_ENV"
          echo 'signing key restored'

      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find js -type f -name '*.js' -print0)

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify built APK deeply
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          test -n "$APK"
          echo "APK=$APK"
          echo "APK bytes=$(stat -c%s "$APK")"

          python3 - "$APK" <<'PY'
          import gzip,hashlib,sys,zipfile
          apk=sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              stripped='assets/www/data/zh_vocab_frequency.txt'
              original='assets/www/data/zh_vocab_frequency.txt.gz'
              runtime_path='assets/www/js/reader/interactions-runtime.js'
              vocab_path='assets/www/js/reader/vocab-estimate.js'
              matches=sorted(n for n in names if 'zh_vocab' in n)
              print('zh_vocab APK entries:',matches)
              assert stripped in names, 'AAPT-stripped frequency asset missing'
              assert original not in names, 'unexpected .gz name survived AAPT'
              assert not any(n.startswith('assets/www/data/zh_vocab_b64/') for n in names), 'base64 fragments leaked'
              assert 'assets/www/js/reader/zh-vocab-data-bridge.js' not in names, 'obsolete bridge leaked'
              runtime=z.read(runtime_path).decode('utf-8')
              vocab=z.read(vocab_path).decode('utf-8')
              assert "import './vocab-estimate.js?v=5'" in runtime
              assert 'zh-vocab-data-bridge.js' not in runtime
              assert "globalThis.location?.hostname === 'appassets.androidplatform.net'" in vocab
              assert "? 'data/zh_vocab_frequency.txt'" in vocab
              assert ": 'data/zh_vocab_frequency.txt.gz?v=40';" in vocab
              assert "return explicit === 'known' || explicit === 'unknown' ? explicit : '';" in vocab
              assert '__readerVocabularyEstimateVersion === 5' in vocab
              raw=z.read(stripped)
              words=gzip.decompress(raw).decode('utf-8').splitlines()
              sha=hashlib.sha256(('\n'.join(words)+'\n').encode()).hexdigest()
              assert len(words)==39999 and len(set(words))==39999
              assert sha=='e656865c38735d4a314d13e91a02a5ba6589361ecceaf93a52f20a9cba70fd64',sha
              assert words[4768]=='天天' and words[4986]=='竭尽全力' and words[4996]=='据我所知' and words[4999]=='围绕'
              print('embedded Migaku list verified:',sha)
              print('APK entries:',len(names))
          PY

          : > /tmp/apksigner.txt
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1 || true)"
          if [[ -n "$APKSIGNER" ]]; then
            "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apksigner.txt
          else
            echo 'apksigner not found' | tee /tmp/apksigner.txt
          fi

          : > /tmp/aapt-badging.txt
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1 || true)"
          if [[ -n "$AAPT" ]]; then
            "$AAPT" dump badging "$APK" | tee /tmp/aapt-badging.txt
            grep -q "versionCode='60'" /tmp/aapt-badging.txt
            grep -q "versionName='77.42-toc40-debug'" /tmp/aapt-badging.txt
          else
            echo 'aapt not found' | tee /tmp/aapt-badging.txt
          fi

          cp "$APK" /tmp/Reader-AI-77.42-toc40-build60.apk
          HASH="$(sha256sum /tmp/Reader-AI-77.42-toc40-build60.apk | awk '{print $1}')"
          printf '%s  %s\n' "$HASH" 'Reader-AI-77.42-toc40-build60.apk' | tee /tmp/Reader-AI-77.42-toc40-build60.sha256

      - name: Upload verified toc40 APK
        uses: actions/upload-artifact@v4
        with:
          name: Reader-AI-77.42-toc40-build60
          path: |
            /tmp/Reader-AI-77.42-toc40-build60.apk
            /tmp/Reader-AI-77.42-toc40-build60.sha256
            /tmp/source-sha.txt
            /tmp/apksigner.txt
            /tmp/aapt-badging.txt
          if-no-files-found: error
