name: Build and verify Reader AI toc41

on:
  push:
    branches:
      - tmp-recover-migaku-extension-20260825

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 51a0246ae2f9720f8bd3f0cb0c9d95aef4a979b7
          fetch-depth: 0

      - name: Verify exact toc41 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '51a0246ae2f9720f8bd3f0cb0c9d95aef4a979b7'
          grep -q "versionCode 61" android/app/build.gradle
          grep -q "versionName '77.42-toc41'" android/app/build.gradle
          grep -q "isDocumentWideVocabSweep" js/reader/vocab-estimate-observer-pre.js
          grep -q "reader-vocab-stability-style-v1" js/reader/vocab-estimate-stability-fix.js
          grep -q "data-reader-vocab-synthetic-known" js/reader/vocab-estimate-stability-fix.js
          grep -q "applyVocabularyAfterRender" js/reader/chapter-render.js
          grep -q "vocab-estimate-stability-fix.js?v=1" js/reader/interactions-runtime.js
          python3 - <<'PY'
          from pathlib import Path
          import gzip,hashlib
          plain=gzip.decompress(Path('data/zh_vocab_frequency.txt.gz').read_bytes())
          words=plain.decode('utf-8').splitlines()
          assert len(words)==39999 and len(set(words))==39999
          assert hashlib.sha256(plain).hexdigest()=='e656865c38735d4a314d13e91a02a5ba6589361ecceaf93a52f20a9cba70fd64'
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo '::warning::No signing secret: debug signing key will be runner-local.'
            exit 0
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/reader-ai.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/reader-ai.jks" >> "$GITHUB_ENV"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check js/reader/vocab-estimate-observer-pre.js
          node --check js/reader/vocab-estimate-stability-fix.js
          node --check js/reader/chapter-render.js
          node --check js/reader/interactions-runtime.js

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify built APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          test -n "$APK"
          python3 - "$APK" <<'PY'
          import hashlib,sys,zipfile
          apk=sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              required=[
                'assets/www/js/reader/vocab-estimate-observer-pre.js',
                'assets/www/js/reader/vocab-estimate-stability-fix.js',
                'assets/www/js/reader/chapter-render.js',
                'assets/www/js/reader/interactions-runtime.js',
                'assets/www/data/zh_vocab_frequency.txt',
              ]
              for name in required: assert name in names, name
              pre=z.read(required[0]).decode('utf-8')
              fix=z.read(required[1]).decode('utf-8')
              chapter=z.read(required[2]).decode('utf-8')
              runtime=z.read(required[3]).decode('utf-8')
              assert 'isDocumentWideVocabSweep' in pre
              assert 'reader-vocab-stability-style-v1' in fix
              assert 'data-reader-vocab-synthetic-known' in fix
              assert 'applyVocabularyAfterRender' in chapter
              assert "vocab-estimate-stability-fix.js?v=1" in runtime
              plain=z.read(required[4])
              assert hashlib.sha256(plain).hexdigest()=='e656865c38735d4a314d13e91a02a5ba6589361ecceaf93a52f20a9cba70fd64'
              assert len(plain.decode('utf-8').splitlines())==39999
          PY
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1 || true)"
          if [[ -n "$AAPT" ]]; then
            "$AAPT" dump badging "$APK" | tee /tmp/aapt-badging.txt
            grep -q "versionCode='61'" /tmp/aapt-badging.txt
            grep -q "versionName='77.42-toc41-debug'" /tmp/aapt-badging.txt
          fi
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1 || true)"
          if [[ -n "$APKSIGNER" ]]; then "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apksigner.txt; fi
          cp "$APK" /tmp/Reader-AI-77.42-toc41-build61.apk
          sha256sum /tmp/Reader-AI-77.42-toc41-build61.apk | tee /tmp/Reader-AI-77.42-toc41-build61.sha256

      - name: Upload verified toc41 APK
        uses: actions/upload-artifact@v4
        with:
          name: Reader-AI-77.42-toc41-build61
          path: |
            /tmp/Reader-AI-77.42-toc41-build61.apk
            /tmp/Reader-AI-77.42-toc41-build61.sha256
            /tmp/aapt-badging.txt
            /tmp/apksigner.txt
          if-no-files-found: error
