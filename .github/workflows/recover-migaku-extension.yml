name: Stage Reader AI toc44

on:
  push:
    branches:
      - tmp-recover-migaku-extension-20260825

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9c223393820825472a3470f34cb04c10db6aad90
          fetch-depth: 0

      - name: Apply fixed-slot and pagination-freeze patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '9c223393820825472a3470f34cb04c10db6aad90'
          git show 'origin/tmp-recover-migaku-extension-20260825:.github/toc44/patch.py' > /tmp/toc44_patch.py
          python3 /tmp/toc44_patch.py
          node --check js/reader/zh-unknown-gloss.js
          node --check js/reader/zh-unknown-gloss-readable.js
          node --check js/reader/zh-stable-slots.js
          node --check js/reader/pages-mode.js
          node --check js/reader/interactions-runtime.js
          git diff --check

      - name: Verify toc44 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 64" android/app/build.gradle
          grep -q "versionName '77.42-toc44'" android/app/build.gradle
          grep -qF "import './zh-stable-slots.js?v=1';" js/reader/interactions-runtime.js
          ! grep -q "vocab-layout-lock.js" js/reader/interactions-runtime.js
          test ! -e js/reader/vocab-layout-lock.js
          grep -q "readerPrepareZhStableSlots" js/reader/pages-mode.js
          grep -q "paginationFrozen" js/reader/pages-mode.js
          grep -q "position:absolute !important" js/reader/zh-stable-slots.js
          grep -q "grid-template-rows:.58em 1.08em .54em" js/reader/zh-stable-slots.js
          grep -q "wrap.dataset.zhGlossRu = ru || '';" js/reader/zh-unknown-gloss.js
          ! grep -q "wrap.dataset.zhGlossRu = ru || '…';" js/reader/zh-unknown-gloss.js
          ! grep -q "unwrapWord(el);" <(sed -n '/function scan()/,/^}/p' js/reader/zh-unknown-gloss.js)
          python3 - <<'PY'
          from pathlib import Path
          import gzip,hashlib
          plain=gzip.decompress(Path('data/zh_vocab_frequency.txt.gz').read_bytes())
          words=plain.decode('utf-8').splitlines()
          assert len(words)==39999 and len(set(words))==39999
          assert hashlib.sha256(plain).hexdigest()=='e656865c38735d4a314d13e91a02a5ba6589361ecceaf93a52f20a9cba70fd64'
          PY

      - name: Commit staged toc44 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(reader): stabilize Chinese slots before pagination'
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SOURCE_SHA=${FINAL_SHA}"
          git push --force origin HEAD:refs/heads/tmp-toc44-ready-20260825
