name: Stage Reader AI toc45

on:
  push:
    branches:
      - tmp-recover-migaku-extension-20260825

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1aad5765a021bbdccac4333b008bd4be18a3c831
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply toc45 fixed label geometry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '1aad5765a021bbdccac4333b008bd4be18a3c831'
          git show 'origin/tmp-recover-migaku-extension-20260825:.github/toc45/patch.py' > /tmp/toc45_patch.py
          python3 /tmp/toc45_patch.py
          node --check js/reader/zh-stable-slots.js
          node --check js/reader/interactions-runtime.js
          node --check js/reader/pages-mode.js
          git diff --check

      - name: Verify toc45 geometry invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 65" android/app/build.gradle
          grep -q "versionName '77.42-toc45'" android/app/build.gradle
          grep -qF "import './zh-stable-slots.js?v=2';" js/reader/interactions-runtime.js
          grep -q "--rw-zh-slot-width" js/reader/zh-stable-slots.js
          grep -q "width:calc(100% - .10em)" js/reader/zh-stable-slots.js
          grep -q "max-width:calc(100% - .10em)" js/reader/zh-stable-slots.js
          ! grep -q "width:max-content !important" js/reader/zh-stable-slots.js
          grep -q "readerPrepareZhStableSlots" js/reader/pages-mode.js
          grep -q "paginationFrozen" js/reader/pages-mode.js
          grep -q "wrap.dataset.zhGlossRu = ru || '';" js/reader/zh-unknown-gloss.js
          ! grep -q "wrap.dataset.zhGlossRu = ru || '…';" js/reader/zh-unknown-gloss.js
          node scripts/check-reader-paragraph-help-render.mjs
          node scripts/check-reader-paragraph-help-runtime.mjs
          node scripts/check-reader-paragraph-tap-selection.mjs
          node scripts/check-reader-zh-unknown-gloss.mjs
          python3 - <<'PY'
          from pathlib import Path
          import gzip,hashlib
          plain=gzip.decompress(Path('data/zh_vocab_frequency.txt.gz').read_bytes())
          words=plain.decode('utf-8').splitlines()
          assert len(words)==39999 and len(set(words))==39999
          assert hashlib.sha256(plain).hexdigest()=='e656865c38735d4a314d13e91a02a5ba6589361ecceaf93a52f20a9cba70fd64'
          PY

      - name: Commit staged toc45 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(reader): constrain Chinese hints to stable slots'
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SOURCE_SHA=${FINAL_SHA}"
          git push --force origin HEAD:refs/heads/tmp-toc45-ready-20260825
