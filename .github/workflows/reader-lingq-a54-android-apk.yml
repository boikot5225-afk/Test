name: Reader AI LingQ Galaxy A54 APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/lingq-reader-v77
    paths:
      - '.github/workflows/reader-lingq-a54-android-apk.yml'
      - '.github/workflows/reader-stage1-android-apk.yml'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - 'data/**'
      - 'manifest.json'
      - 'sw.js'

permissions:
  contents: read

jobs:
  build-a54-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Reader AI
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate verified Galaxy A54 wrapper
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/reader-stage1-android-apk.yml').read_text()
          marker = '      - name: Generate isolated WebView wrapper\n'
          start = source.index(marker) + len(marker)
          run_marker = '        run: |\n'
          start = source.index(run_marker, start) + len(run_marker)
          end = source.index('\n      - name: Build debug APK', start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/generate-reader-a54-wrapper.sh').write_text(script)
          PY

          bash /tmp/generate-reader-a54-wrapper.sh

          JAVA_FILE='.stage1-android/app/src/main/java/space/saintjust/reader/stage1/MainActivity.java'
          BUILD_FILE='.stage1-android/app/build.gradle'
          MANIFEST_FILE='.stage1-android/app/src/main/AndroidManifest.xml'
          ASSETS_ROOT='.stage1-android/app/src/main/assets'
          WWW="$ASSETS_ROOT/www"

          sed -i 's#https://appassets.androidplatform.net/assets/index.html#https://appassets.androidplatform.net/assets/www/index.html#' "$JAVA_FILE"
          sed -i "s/applicationId 'space.saintjust.reader.stage1'/applicationId 'space.saintjust.reader.lingqa54'/" "$BUILD_FILE"
          sed -i 's/versionCode 2/versionCode 12/' "$BUILD_FILE"
          sed -i "s/versionName 'stage1-test'/versionName 'lingq-a54-v0.7.2'/" "$BUILD_FILE"
          sed -i 's/Reader AI Stage 1/Reader AI LingQ A54/' "$MANIFEST_FILE"

          test -f "$WWW/index.html"
          test ! -f "$ASSETS_ROOT/index.html"
          grep -F 'private static final String APP_URL = "https://appassets.androidplatform.net/assets/www/index.html";' "$JAVA_FILE"
          ! grep -Fq 'private static final String APP_URL = "https://appassets.androidplatform.net/assets/index.html";' "$JAVA_FILE"
          grep -F "applicationId 'space.saintjust.reader.lingqa54'" "$BUILD_FILE"
          grep -F 'versionCode 12' "$BUILD_FILE"
          grep -F "versionName 'lingq-a54-v0.7.2'" "$BUILD_FILE"

          test -f "$WWW/js/lingq-reader-restore-v6.js"
          test -f "$WWW/js/reader-mobile-galaxy-a54-v7.js"
          test -f "$WWW/js/reader-mobile-galaxy-a54-search-v71.js"
          test -f "$WWW/js/reader/pages-mode.js"
          test -f "$WWW/js/reader/display.js"

          node --check "$WWW/js/lingq-reader-restore-v6.js"
          node --check "$WWW/js/reader-mobile-galaxy-a54-v7.js"
          node --check "$WWW/js/reader-mobile-galaxy-a54-search-v71.js"

      - name: Build verified APK
        working-directory: .stage1-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify packaged web app
        shell: bash
        run: |
          set -euo pipefail
          APK='.stage1-android/app/build/outputs/apk/debug/app-debug.apk'
          rm -rf /tmp/reader-a54-apk
          mkdir -p /tmp/reader-a54-apk
          unzip -q "$APK" -d /tmp/reader-a54-apk
          test -f /tmp/reader-a54-apk/assets/www/index.html
          test ! -f /tmp/reader-a54-apk/assets/index.html
          test -f /tmp/reader-a54-apk/assets/www/js/reader-mobile-galaxy-a54-v7.js
          test -f /tmp/reader-a54-apk/assets/www/js/reader-mobile-galaxy-a54-search-v71.js

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp .stage1-android/app/build/outputs/apk/debug/app-debug.apk \
            dist/Reader-AI-LingQ-v0.7.2-Galaxy-A54-Fixed.apk
          sha256sum dist/Reader-AI-LingQ-v0.7.2-Galaxy-A54-Fixed.apk | \
            tee dist/Reader-AI-LingQ-v0.7.2-Galaxy-A54-Fixed.apk.sha256

      - name: Upload verified Galaxy A54 APK
        uses: actions/upload-artifact@v4
        with:
          name: Reader-AI-LingQ-v0.7.2-Galaxy-A54-Fixed-APK
          path: |
            dist/Reader-AI-LingQ-v0.7.2-Galaxy-A54-Fixed.apk
            dist/Reader-AI-LingQ-v0.7.2-Galaxy-A54-Fixed.apk.sha256
          if-no-files-found: error
          retention-days: 14
