name: Smart Book Chinese pinyin APK

on:
  push:
    branches:
      - feature/smartbook-chinese-pinyin
    paths:
      - data/zh_dict_core.json
      - tools/smartbook-chinese-pinyin/**
      - .github/workflows/smartbook-pinyin-patched-apk.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartbook-pinyin-patched-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-patched-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build offline pinyin dictionary
        run: |
          python3 tools/smartbook-chinese-pinyin/tools/build_lexicon.py \
            data/zh_dict_core.json \
            tools/smartbook-chinese-pinyin/xposed-module/src/main/assets/zh_pinyin.tsv.gz

      - name: Run segmentation regression tests
        run: gradle -p tools/smartbook-chinese-pinyin smokeTest --no-daemon

      - name: Build signed pinyin module
        run: gradle -p tools/smartbook-chinese-pinyin/xposed-module assembleDebug --no-daemon

      - name: Download and verify official Smart Book 3.6 APK
        run: |
          mkdir -p build/download build/output
          curl --fail --location --retry 4 --retry-all-errors \
            --user-agent 'Mozilla/5.0 GitHub-Actions SmartBook-Pinyin' \
            'https://smart-book.net/apk' \
            --output build/download/smartbook-original.apk
          test "$(stat -c%s build/download/smartbook-original.apk)" -gt 10000000
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/download/smartbook-original.apk \
            | tee build/original-badging.txt
          grep -q "package: name='com.kursx.smartbook'" build/original-badging.txt
          ORIGINAL_VERSION="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" build/original-badging.txt | head -n1)"
          echo "Official universal APK version: $ORIGINAL_VERSION"
          test "$ORIGINAL_VERSION" = '3.6'

      - name: Download latest official NPatch CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 4 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/7723mod/NPatch/releases/latest' \
            --output build/npatch-release.json
          JAR_URL="$(jq -r '.assets[] | select(.name | test("^jar-v.*-release\\.jar$")) | .browser_download_url' build/npatch-release.json | head -n1)"
          JAR_NAME="$(jq -r '.assets[] | select(.name | test("^jar-v.*-release\\.jar$")) | .name' build/npatch-release.json | head -n1)"
          JAR_DIGEST="$(jq -r '.assets[] | select(.name | test("^jar-v.*-release\\.jar$")) | (.digest // "")' build/npatch-release.json | head -n1)"
          test -n "$JAR_URL"
          curl --fail --location --retry 4 "$JAR_URL" --output build/npatch.jar
          if [[ "$JAR_DIGEST" == sha256:* ]]; then
            echo "${JAR_DIGEST#sha256:}  build/npatch.jar" | sha256sum --check --strict
          fi
          printf '%s\n' "$JAR_NAME" > build/npatch-version.txt

      - name: Embed pinyin module into Smart Book
        run: |
          MODULE=tools/smartbook-chinese-pinyin/xposed-module/build/outputs/apk/debug/xposed-module-debug.apk
          java -jar build/npatch.jar \
            --embed "$MODULE" \
            --sigbypasslv 2 \
            --output build/output \
            --verbose \
            build/download/smartbook-original.apk
          PATCHED="$(find build/output -maxdepth 1 -type f -name '*-npatched.apk' -print -quit)"
          test -n "$PATCHED"
          mv "$PATCHED" build/output/SmartBook-3.6-Chinese-Pinyin-v0.1.0.apk

      - name: Verify patched APK and embedded module
        run: |
          APK=build/output/SmartBook-3.6-Chinese-Pinyin-v0.1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" \
            | tee build/patched-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
            | tee build/patched-badging.txt
          grep -q "package: name='com.kursx.smartbook'" build/patched-badging.txt
          grep -q "versionName='3.6'" build/patched-badging.txt
          unzip -l "$APK" | grep -q 'assets/npatch/modules/com.bulat.smartbookpinyin.apk'

      - name: Write reproducibility report
        run: |
          {
            echo 'Smart Book Chinese Pinyin build'
            echo "Git commit: $GITHUB_SHA"
            echo "Built at UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Original SHA-256: $(sha256sum build/download/smartbook-original.apk | cut -d' ' -f1)"
            echo "Patched SHA-256: $(sha256sum build/output/SmartBook-3.6-Chinese-Pinyin-v0.1.0.apk | cut -d' ' -f1)"
            echo "NPatch: $(cat build/npatch-version.txt)"
            echo
            echo 'Original package:'
            cat build/original-badging.txt
            echo
            echo 'Patched package:'
            cat build/patched-badging.txt
          } > build/output/BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SmartBook-Chinese-Pinyin-v0.1.0
          path: |
            build/output/SmartBook-3.6-Chinese-Pinyin-v0.1.0.apk
            build/output/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14

      - name: Record latest build status
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
        run: |
          BRANCH="$GITHUB_REF_NAME"
          git fetch origin "$BRANCH"
          NEWER_SOURCE_CHANGES="$(git diff --name-only "$GITHUB_SHA..origin/$BRANCH" | grep -v '^\.ci-status/' || true)"
          if [[ -n "$NEWER_SOURCE_CHANGES" ]]; then
            echo 'A newer source commit exists; skip stale status publication.'
            exit 0
          fi

          ORIGINAL_VERSION="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" build/original-badging.txt 2>/dev/null | head -n1 || true)"
          NPATCH_VERSION="$(cat build/npatch-version.txt 2>/dev/null || true)"
          PATCHED_SHA=''
          if [[ -f build/output/SmartBook-3.6-Chinese-Pinyin-v0.1.0.apk ]]; then
            PATCHED_SHA="$(sha256sum build/output/SmartBook-3.6-Chinese-Pinyin-v0.1.0.apk | cut -d' ' -f1)"
          fi

          git checkout -B "$BRANCH" "origin/$BRANCH"
          mkdir -p .ci-status
          jq -n \
            --arg status "$BUILD_STATUS" \
            --arg workflow_sha "$GITHUB_SHA" \
            --arg finished_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg original_version "$ORIGINAL_VERSION" \
            --arg npatch "$NPATCH_VERSION" \
            --arg patched_sha256 "$PATCHED_SHA" \
            '{status:$status,workflow_sha:$workflow_sha,finished_at:$finished_at,run_url:$run_url,original_version:$original_version,npatch:$npatch,patched_sha256:$patched_sha256,artifact:"SmartBook-Chinese-Pinyin-v0.1.0"}' \
            > .ci-status/smartbook-pinyin-patched.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .ci-status/smartbook-pinyin-patched.json
          git commit -m "ci: record Smart Book pinyin build status" || exit 0
          git push origin "HEAD:$BRANCH"
