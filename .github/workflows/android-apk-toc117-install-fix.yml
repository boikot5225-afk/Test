name: Android APK toc117 install package fix

on:
  push:
    branches:
      - feature/77.42-zh-lexical-pipeline-v2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/77.42-zh-lexical-pipeline-v2
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore established Reader AI signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64}"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/reader-ai.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/reader-ai.jks" >> "$GITHUB_ENV"

      - name: Reproduce maintained Chinese patch chain
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/wire-toc104-native-bridges.py
          python3 scripts/patch-toc112-zh-context-inline.py
          python3 scripts/patch-toc113-zh-context-coverage.py
          python3 scripts/patch-toc114-zh-core-first-paint.py
          python3 scripts/patch-toc115-zh-missing-only-auth.py
          python3 scripts/patch-zh-lexical-pipeline-v2.py
          python3 scripts/patch-zh-lexical-global-access.py
          python3 scripts/patch-zh-context-pinyin-trust.py

      - name: Set toc117 install identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          if s.count('versionCode 118') != 1:
              raise SystemExit('unexpected base versionCode')
          if s.count("versionName '77.42-toc98'") != 1:
              raise SystemExit('unexpected base versionName')
          s = s.replace('versionCode 118', 'versionCode 1006', 1)
          s = s.replace("versionName '77.42-toc98'", "versionName '77.42-toc117-zh-lexical-install-fix'", 1)
          p.write_text(s)
          PY

      - name: Run lexical regression gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_zh_migaku_resources.py --self-test
          python3 scripts/build_zh_migaku_resources_v2.py --self-test
          python3 scripts/build_zh_migaku_sqlite.py --self-test
          mkdir -p build/toc117-lexical-gate
          python3 scripts/build_zh_migaku_sqlite.py --output-dir build/toc117-lexical-gate --cache-dir build/toc117-migaku-cache
          python3 scripts/export_zh_jieba_rank_asset.py build/toc117-lexical-gate/zh_migaku.sqlite3 build/toc117-lexical-gate/zh_jieba_top100k.txt --limit 100000
          node scripts/check-zh-lexical-pipeline-v2.mjs build/toc117-lexical-gate/zh_jieba_top100k.txt data/zh_dict_core.json data/zh_lexical_regressions.json

      - name: Remove CI scratch data before web asset sync
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build

      - name: Validate patched runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find js -type f -name '*.js' -print0)

      - name: Build signed debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Validate installable APK layout and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -f "$APK"
          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p unique-out
          "${BUILD_TOOLS}/apksigner" verify --verbose --print-certs "$APK" | tee unique-out/APKSIGNER.txt
          "${BUILD_TOOLS}/aapt" dump badging "$APK" | tee unique-out/BADGING.txt
          "${BUILD_TOOLS}/zipalign" -c -P 16 -v 4 "$APK" > unique-out/ZIPALIGN.txt
          unzip -t "$APK" >/dev/null
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" unique-out/APKSIGNER.txt
          grep -q "certificate SHA-256 digest: 9d853f2c43529b55a2d63202b7377c7485bae700b6e4113ca71ceae930664790" unique-out/APKSIGNER.txt
          grep -q "package: name='space.saintjust.reader.semanticstage1clean.formatfix.debug' versionCode='1006'" unique-out/BADGING.txt
          unzip -l "$APK" | grep -qF 'assets/data/zh_migaku.sqlite3'
          unzip -l "$APK" | grep -qF 'assets/data/zh_jieba_top100k.txt'
          if unzip -l "$APK" | grep -qF 'assets/www/build/'; then
            echo 'CI scratch build directory leaked into APK' >&2
            exit 1
          fi
          cp "$APK" unique-out/Reader-AI-77.42-toc117-zh-lexical-install-fix-vc1006.apk
          sha256sum unique-out/Reader-AI-77.42-toc117-zh-lexical-install-fix-vc1006.apk | tee unique-out/SHA256.txt

      - name: Upload exact APK
        uses: actions/upload-artifact@v4
        with:
          name: Reader-AI-77.42-toc117-zh-lexical-install-fix-vc1006
          path: |
            unique-out/Reader-AI-77.42-toc117-zh-lexical-install-fix-vc1006.apk
            unique-out/SHA256.txt
            unique-out/APKSIGNER.txt
            unique-out/BADGING.txt
            unique-out/ZIPALIGN.txt
          if-no-files-found: error
          retention-days: 30
