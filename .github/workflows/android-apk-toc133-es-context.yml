name: Android APK toc133 Spanish context + frozen toc132 gates

on:
  push:
    branches:
      - feature/77.42-toc133-es-context-batch
    paths:
      - '.github/workflows/android-apk-toc133-es-context.yml'
      - 'scripts/build_es_reader_resources.py'
      - 'scripts/materialize_es_vocab_module.py'
      - 'scripts/audit_toc133_spanish_context_live.py'
      - 'scripts/run_toc133_spanish_emulator.sh'
      - 'js/reader/es-reader-pipeline-v1.js'
      - 'js/reader/es-context-batch-v1.js'
      - 'js/reader/interactions-runtime.js'
      - 'functions/es-context-task.js'
      - 'android/app/build.gradle'
  workflow_dispatch:

jobs:
  spanish-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/77.42-toc133-es-context-batch
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore established Reader AI signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64}"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/reader-ai.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/reader-ai.jks" >> "$GITHUB_ENV"

      - name: Materialize offline guest cold-start fix
        shell: bash
        run: python3 scripts/patch_toc126_guest_cold_start.py

      - name: Validate frozen toc132 architecture first
        shell: bash
        run: bash scripts/validate_toc126_storage_import_v2.sh

      - name: Validate Spanish source and generated vocabulary owner
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_es_reader_resources.py --output-dir /tmp/es-self --cache-dir /tmp/es-cache --self-test
          python3 scripts/materialize_es_vocab_module.py /tmp/es-vocab-estimate.js
          node --check /tmp/es-vocab-estimate.js
          node --check js/reader/es-reader-pipeline-v1.js
          node --check js/reader/es-context-batch-v1.js
          node --check functions/es-context-task.js
          grep -qF "es-reader-pipeline-v1.js?v=1" js/reader/interactions-runtime.js
          grep -qF "es-context-batch-v1.js?v=1" js/reader/interactions-runtime.js
          grep -qF "const MIN_CONFIDENCE = 0.90" js/reader/es-context-batch-v1.js
          grep -qF "await refineParagraph(paragraph, dict)" js/reader/es-context-batch-v1.js
          if grep -qF "schedule('next-paragraph'" js/reader/es-context-batch-v1.js; then
            echo 'Spanish context batch resurrected toc132 paragraph starvation scheduler' >&2
            exit 1
          fi
          grep -qF "task: 'es_context_batch'" js/reader/es-context-batch-v1.js
          grep -qF "sourceLang: 'es'" js/reader/es-context-batch-v1.js
          grep -qF "versionCode 1026" android/app/build.gradle
          grep -qF "versionName '77.42-toc133-es-context-batch'" android/app/build.gradle

      - name: Build universal APK directly from validated source
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify Spanish and frozen payload inside universal APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          for f in \
            assets/www/js/reader/es-vocab-estimate.js \
            assets/www/js/reader/es-reader-pipeline-v1.js \
            assets/www/js/reader/es-context-batch-v1.js \
            assets/esreader/es_vocab_frequency.tsv \
            assets/esreader/es_vocab_lemma.tsv \
            assets/esreader/es_ru_core.json \
            assets/esreader/es_ru_senses.json \
            assets/esreader/NOTICE.txt \
            assets/www/js/reader/en-context-batch-v2.js \
            assets/frreader/fr_ru_core.json \
            assets/www/js/reader/epub-stage1-real.js; do
            unzip -l "$APK" | grep -qF "$f"
          done
          unzip -p "$APK" assets/esreader/es_vocab_frequency.tsv > /tmp/es_vocab_frequency.tsv
          unzip -p "$APK" assets/esreader/es_vocab_lemma.tsv > /tmp/es_vocab_lemma.tsv
          unzip -p "$APK" assets/esreader/es_ru_core.json > /tmp/es_ru_core.json
          unzip -p "$APK" assets/esreader/es_ru_senses.json > /tmp/es_ru_senses.json
          test "$(wc -l < /tmp/es_vocab_frequency.tsv)" -ge 45000
          python3 - <<'PY'
          import json
          core=json.load(open('/tmp/es_ru_core.json',encoding='utf-8'))
          senses=json.load(open('/tmp/es_ru_senses.json',encoding='utf-8'))
          assert isinstance(core,dict) and len(core)>=8000, len(core)
          assert isinstance(senses,dict) and len(senses)>=100, len(senses)
          assert 'banco' in core, core.get('banco')
          print('Spanish assets:',len(core),'translations,',len(senses),'ambiguous heads')
          PY
          unzip -p "$APK" assets/www/js/reader/interactions-runtime.js | grep -qF "es-context-batch-v1.js?v=1"
          unzip -p "$APK" assets/www/js/reader/es-context-batch-v1.js | grep -qF 'const MIN_CONFIDENCE = 0.90'
          unzip -p "$APK" assets/www/js/reader/es-context-batch-v1.js | grep -qF 'await refineParagraph(paragraph, dict)'
          unzip -p "$APK" assets/www/js/reader/es-vocab-estimate.js | grep -qF 'an2_reader_vocab_estimate_es_v1'
          unzip -p "$APK" assets/www/js/reader/es-vocab-estimate.js | grep -qF 'readerSpanishLemmaFor'
          unzip -p "$APK" assets/www/js/reader/epub-stage1-real.js | grep -qF 'normalizeDropCapWrappers'
          if unzip -l "$APK" | grep -q 'assets/www/build/'; then
            echo 'transient repo build cache leaked into APK' >&2
            exit 1
          fi

      - name: Prepare realistic EPUB and audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/make_toc126_storage_audit_epub.py
          test "$(stat -c %s runtime-audit/toc126-storage-audit.epub)" -gt 4000000
          python3 -m pip install --quiet websocket-client requests

      - name: Enable emulator hardware acceleration
        shell: bash
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Android 15 frozen toc132 suite then toc133 Spanish
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash scripts/run_toc133_spanish_emulator.sh

      - name: Upload toc133 live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toc133-es-context-frozen-toc132-live-evidence
          path: runtime-audit/
          if-no-files-found: warn
          retention-days: 90

      - name: Configure final Galaxy A54 ABI only
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/configure_toc123_a54_abi.py
          rm -rf android/app/build

      - name: Build final Galaxy A54 APK directly
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Sign and validate vc1026 A54 APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p unique-out
          OUT=unique-out/Reader-AI-77.42-toc133-es-context-batch-a54-vc1026.apk
          KSPASS="${ANDROID_KEYSTORE_PASSWORD:-readerai2026}"
          KEYPASS="${ANDROID_KEY_PASSWORD:-$KSPASS}"
          ALIAS="${ANDROID_KEY_ALIAS:-reader-ai}"
          "${BUILD_TOOLS}/apksigner" sign \
            --ks "${ANDROID_KEYSTORE_PATH}" \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KSPASS" \
            --key-pass "pass:$KEYPASS" \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT" "$APK"
          "${BUILD_TOOLS}/apksigner" verify --verbose --print-certs "$OUT" | tee unique-out/APKSIGNER.txt
          "${BUILD_TOOLS}/aapt" dump badging "$OUT" | tee unique-out/BADGING.txt
          "${BUILD_TOOLS}/zipalign" -c -P 16 -v 4 "$OUT" > unique-out/ZIPALIGN.txt
          unzip -t "$OUT" >/dev/null
          for f in \
            assets/www/js/reader/es-vocab-estimate.js \
            assets/www/js/reader/es-reader-pipeline-v1.js \
            assets/www/js/reader/es-context-batch-v1.js \
            assets/esreader/es_vocab_frequency.tsv \
            assets/esreader/es_vocab_lemma.tsv \
            assets/esreader/es_ru_core.json \
            assets/esreader/es_ru_senses.json \
            assets/www/js/reader/en-context-batch-v2.js \
            assets/frreader/fr_ru_core.json; do
            unzip -l "$OUT" | grep -qF "$f"
          done
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" unique-out/APKSIGNER.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" unique-out/APKSIGNER.txt
          grep -q "certificate SHA-256 digest: 9d853f2c43529b55a2d63202b7377c7485bae700b6e4113ca71ceae930664790" unique-out/APKSIGNER.txt
          grep -q "versionCode='1026'" unique-out/BADGING.txt
          grep -q "versionName='77.42-toc133-es-context-batch-debug'" unique-out/BADGING.txt
          grep -q "native-code: 'arm64-v8a'" unique-out/BADGING.txt
          if unzip -l "$OUT" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo 'non-A54 ABI leaked into final package' >&2
            exit 1
          fi
          if unzip -l "$OUT" | grep -q 'assets/www/build/'; then
            echo 'transient repo build cache leaked into final APK' >&2
            exit 1
          fi
          sha256sum "$OUT" | tee unique-out/SHA256.txt
          stat -c '%n %s bytes' "$OUT" | tee unique-out/SIZE.txt

      - name: Upload verified toc133 A54 APK
        uses: actions/upload-artifact@v4
        with:
          name: Reader-AI-77.42-toc133-es-context-batch-a54-vc1026
          path: unique-out/
          if-no-files-found: error
          retention-days: 30
