name: Build Spanish Verbs Trainer APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download prototype
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 --retry-delay 3 'https://replit.com/@boikot5225/Verb-Trainer-Pro.zip' -o /tmp/app.zip
          unzip -t /tmp/app.zip
          mkdir -p /tmp/src
          unzip -q /tmp/app.zip -d /tmp/src

      - name: Prepare standalone app
        shell: bash
        run: |
          set -euxo pipefail
          APP_DIR="$(find /tmp/src -type d -path '*/artifacts/mobile' | head -n 1)"
          test -n "$APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          cd "$APP_DIR"
          rm -rf node_modules android package-lock.json
          cat > package.json <<'JSON'
          {
            "name":"spanish-verbs-trainer",
            "version":"1.0.0",
            "private":true,
            "main":"expo-router/entry",
            "scripts":{"typecheck":"tsc --noEmit"},
            "dependencies":{
              "@expo-google-fonts/inter":"^0.4.0",
              "@expo/vector-icons":"^15.0.3",
              "@react-native-async-storage/async-storage":"2.2.0",
              "@tanstack/react-query":"^5.90.21",
              "expo":"~54.0.27",
              "expo-blur":"~15.0.8",
              "expo-constants":"~18.0.11",
              "expo-font":"~14.0.10",
              "expo-glass-effect":"~0.1.4",
              "expo-haptics":"~15.0.8",
              "expo-linking":"~8.0.10",
              "expo-router":"~6.0.17",
              "expo-speech":"^14.0.8",
              "expo-splash-screen":"~31.0.12",
              "expo-symbols":"~1.0.8",
              "expo-system-ui":"~6.0.9",
              "expo-web-browser":"~15.0.10",
              "react":"19.1.0",
              "react-dom":"19.1.0",
              "react-native":"0.81.5",
              "react-native-gesture-handler":"~2.28.0",
              "react-native-keyboard-controller":"1.18.5",
              "react-native-reanimated":"~4.1.1",
              "react-native-safe-area-context":"~5.6.0",
              "react-native-screens":"~4.16.0",
              "react-native-svg":"15.12.1",
              "react-native-web":"^0.21.0",
              "react-native-worklets":"0.5.1"
            },
            "devDependencies":{
              "@babel/core":"^7.25.2",
              "@types/react":"~19.1.10",
              "typescript":"~5.9.2"
            }
          }
          JSON
          cat > app.json <<'JSON'
          {
            "expo":{
              "name":"Spanish Verbs Trainer",
              "slug":"spanish-verbs-trainer",
              "version":"1.0.0",
              "orientation":"portrait",
              "icon":"./assets/images/icon.png",
              "scheme":"spanishverbstrainer",
              "userInterfaceStyle":"light",
              "newArchEnabled":true,
              "splash":{"image":"./assets/images/icon.png","resizeMode":"contain","backgroundColor":"#F8FAFC"},
              "android":{"package":"com.bulat.spanishverbstrainer","versionCode":1,"adaptiveIcon":{"foregroundImage":"./assets/images/icon.png","backgroundColor":"#F8FAFC"}},
              "plugins":["expo-router","expo-font","expo-web-browser"],
              "experiments":{"typedRoutes":true}
            }
          }
          JSON
          if grep -R "@workspace/" app components context data hooks utils constants 2>/dev/null; then exit 1; fi

      - name: Install dependencies
        run: cd "$APP_DIR" && npm install --legacy-peer-deps --no-audit --no-fund
      - name: Type check
        run: cd "$APP_DIR" && npm run typecheck
      - name: Prebuild Android
        run: cd "$APP_DIR" && npx expo prebuild --platform android --clean --no-install
      - name: Build APK
        run: cd "$APP_DIR/android" && chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          APK="$(find "$APP_DIR/android/app/build/outputs/apk/release" -name '*.apk' | head -n 1)"
          test -f "$APK"
          cp "$APK" out/Spanish-Verbs-Trainer-v1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Spanish-Verbs-Trainer-APK
          path: out/Spanish-Verbs-Trainer-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
