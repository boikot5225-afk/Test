name: Build Spanish Verbs Trainer APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore standalone source
        shell: bash
        run: |
          set -euxo pipefail
          cat spanish-verbs-source/chunk-* > /tmp/spanish-verbs-source.b64
          base64 --decode /tmp/spanish-verbs-source.b64 > /tmp/spanish-verbs-source.tar.xz
          mkdir -p /tmp/spanish-verbs
          tar -xJf /tmp/spanish-verbs-source.tar.xz -C /tmp/spanish-verbs
          test -f /tmp/spanish-verbs/svt_buildsrc/package.json
          echo "APP_DIR=/tmp/spanish-verbs/svt_buildsrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: bash
        run: |
          cd "$APP_DIR"
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Check source
        shell: bash
        run: |
          cd "$APP_DIR"
          npm run typecheck
          npm run test:data

      - name: Generate Android project
        shell: bash
        run: |
          cd "$APP_DIR"
          npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        shell: bash
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          APK="$(find "$APP_DIR/android/app/build/outputs/apk/release" -type f -name '*.apk' | head -n 1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/out/Spanish-Verbs-Trainer-v1.0.0.apk"
          sha256sum "$GITHUB_WORKSPACE/out/Spanish-Verbs-Trainer-v1.0.0.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spanish-Verbs-Trainer-APK
          path: out/Spanish-Verbs-Trainer-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
