name: Extract reader audio baseline

on:
  push:
    branches: [reader-refactor]
    paths:
      - 'js/reader/audio.js'
      - 'scripts/extract-reader-audio-baseline.mjs'
      - '.github/workflows/extract-reader-audio-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reader-refactor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract baseline reader audio
        run: node scripts/extract-reader-audio-baseline.mjs
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/reader/audio.js
          node --check scripts/extract-reader-audio-baseline.mjs
      - name: Commit extracted app wiring
        run: |
          if git diff --quiet -- js/app.js; then
            echo "No app wiring changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "refactor: extract baseline reader audio"
          git push origin HEAD:reader-refactor

# This workflow only moves existing reader audio code; it intentionally changes no user-facing behaviour.
