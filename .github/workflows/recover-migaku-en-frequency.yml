name: Recover Migaku English frequency

on:
  push:
    branches:
      - tmp-recover-migaku-en-frequency-20260825

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact Migaku English data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/ext recovery/report
          url='https://clients2.google.com/service/update2/crx?response=redirect&prodversion=131.0&acceptformat=crx2,crx3&x=id%3Dlkhiljgmbeecmljiogckofcalncmfnfo%26uc'
          curl -fL --retry 4 --connect-timeout 30 --max-time 600 "$url" -o recovery/migaku.crx
          python3 - <<'PY'
          from pathlib import Path
          import struct
          b=Path('recovery/migaku.crx').read_bytes(); assert b[:4]==b'Cr24'
          ver=struct.unpack('<I',b[4:8])[0]
          if ver==2:
              a,c=struct.unpack('<II',b[8:16]); off=16+a+c
          else:
              h=struct.unpack('<I',b[8:12])[0]; off=12+h
          Path('recovery/ext.zip').write_bytes(b[off:])
          PY
          unzip -q recovery/ext.zip -d recovery/ext
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib, sqlite3, re

          root=Path('recovery/ext')
          report={}
          for rel in ['core/en.json','core/en.db.json','core/en.db']:
              p=root/rel
              report[rel]={'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}

          # Describe JSON formats without shipping the huge source files.
          for rel in ['core/en.json','core/en.db.json']:
              p=root/rel
              obj=json.loads(p.read_text('utf-8'))
              info=report[rel]
              info['top_type']=type(obj).__name__
              if isinstance(obj,dict):
                  info['keys']=list(obj.keys())[:40]
                  for k,v in list(obj.items())[:8]:
                      info.setdefault('value_types',{})[k]=type(v).__name__
                      if isinstance(v,list):
                          info.setdefault('list_lengths',{})[k]=len(v)
                          info.setdefault('samples',{})[k]=v[:3]
                      elif isinstance(v,dict):
                          info.setdefault('dict_lengths',{})[k]=len(v)
                          info.setdefault('samples',{})[k]=list(v.items())[:3]
                      else:
                          info.setdefault('samples',{})[k]=v
              elif isinstance(obj,list):
                  info['length']=len(obj)
                  info['sample']=obj[:5]

          # SQLite schema/counts, to compare with the user-provided en.db.
          con=sqlite3.connect(root/'core/en.db')
          tables=[r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name")]
          report['core/en.db']['tables']={}
          for t in tables:
              cols=[r[1] for r in con.execute(f'PRAGMA table_info("{t}")')]
              count=con.execute(f'SELECT COUNT(*) FROM "{t}"').fetchone()[0]
              sample=con.execute(f'SELECT * FROM "{t}" LIMIT 3').fetchall()
              report['core/en.db']['tables'][t]={'columns':cols,'count':count,'sample':sample}
          con.close()

          # Recover exact English assessment list (hen) from app-router.
          candidates=[]
          for p in (root/'assets').glob('*.js'):
              if p.stat().st_size<1_000_000: continue
              text=p.read_text('utf-8',errors='ignore')
              marker='const hen=[['
              pos=text.find(marker)
              if pos<0: continue
              start=pos+len('const hen=')
              # Balanced bracket scanner aware of quoted strings.
              i=start; depth=0; quote=None; esc=False; end=None
              while i<len(text):
                  ch=text[i]
                  if quote:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==quote: quote=None
                  else:
                      if ch in "\"'": quote=ch
                      elif ch=='[': depth+=1
                      elif ch==']':
                          depth-=1
                          if depth==0:
                              end=i+1; break
                  i+=1
              arr=json.loads(text[start:end])
              candidates.append({'path':str(p.relative_to(root)),'count':len(arr),'unique':len({x[0] for x in arr}),'first20':arr[:20],'last20':arr[-20:],'sha256_json':hashlib.sha256(json.dumps(arr,ensure_ascii=False,separators=(',',':')).encode()).hexdigest()})
              Path('recovery/report/en_frequency.json').write_text(json.dumps(arr,ensure_ascii=False,separators=(',',':')),'utf-8')
          report['hen_candidates']=candidates
          Path('recovery/report/en-core-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),'utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if not candidates or candidates[0]['count']!=36566 or candidates[0]['unique']!=36566:
              raise SystemExit('English assessment list validation failed')
          PY
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: migaku-en-core-report
          path: recovery/report/
          if-no-files-found: error
