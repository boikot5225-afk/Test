name: Android APK toc98 visible context

on:
  push:
    branches:
      - feature/77.42-toc98-visible-context
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "::warning::No shared signing key; install-over may fail."
            exit 0
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/reader-ai.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/reader-ai.jks" >> "$GITHUB_ENV"

      - name: Validate Chinese resource builders
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_zh_migaku_resources.py --self-test
          python3 scripts/build_zh_migaku_resources_v2.py --self-test
          python3 scripts/build_zh_migaku_sqlite.py --self-test

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check js/reader/zh-context-batch.js
          node --check js/reader/interactions-runtime.js
          node --check functions/zh-context-task.js

      - name: Verify toc98 isolation contract
        shell: bash
        run: |
          set -euo pipefail
          grep -qF "versionCode 118" android/app/build.gradle
          grep -qF "versionName '77.42-toc98'" android/app/build.gradle
          grep -qF "zh-context-batch.js?v=2" js/reader/interactions-runtime.js
          grep -qF "function visibleParagraphs()" js/reader/zh-context-batch.js
          grep -qF "MAX_VISIBLE_PARAGRAPHS = 5" js/reader/zh-context-batch.js
          grep -qF "processVisibleParagraphs" js/reader/zh-context-batch.js
          grep -qF "readerAI" js/reader/zh-context-batch.js
          grep -qF "zh_context_batch" js/reader/zh-context-batch.js
          grep -qF "rw-migaku-unknown" js/reader/zh-context-batch.js
          grep -qF "rw-zh-gloss-wrap" js/reader/zh-context-batch.js
          grep -qF "zhGlossStickyRu" js/reader/zh-context-batch.js
          grep -qF "zhGlossStickyPinyin" js/reader/zh-context-batch.js
          grep -qF "getBoundingClientRect" js/reader/zh-context-batch.js
          # Context layer may fill existing text slots, but must not own token
          # DOM, re-render the chapter, or navigate the reader.
          if grep -Eq 'innerHTML[[:space:]]*=|replaceChildren\(|createElement\(|renderReaderChapter|readerNextParagraph|readerPrevParagraph|readerSelectParagraph' js/reader/zh-context-batch.js; then
            echo "toc98 context layer crossed the toc94 layout/navigation boundary" >&2
            exit 1
          fi
          # The old active-only implementation must be gone.
          if grep -qF "function activeParagraph()" js/reader/zh-context-batch.js; then
            echo "toc98 is still active-paragraph-only" >&2
            exit 1
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify toc98 APK contents
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -f "$APK"
          unzip -l "$APK" | grep -qF 'assets/data/zh_migaku.sqlite3'
          unzip -l "$APK" | grep -qF 'assets/data/zh_migaku_manifest.json'
          unzip -l "$APK" | grep -qF 'assets/www/js/reader/zh-resource-profiles.js'
          unzip -l "$APK" | grep -qF 'assets/www/js/reader/zh-readable-inline.js'
          unzip -l "$APK" | grep -qF 'assets/www/js/reader/zh-context-batch.js'
          unzip -p "$APK" assets/www/js/reader/zh-context-batch.js | grep -qF 'function visibleParagraphs()'
          unzip -p "$APK" assets/www/js/reader/interactions-runtime.js | grep -qF 'zh-context-batch.js?v=2'
          unzip -p "$APK" assets/data/zh_migaku.sqlite3 > /tmp/zh_migaku.sqlite3
          python3 - <<'PY'
          import sqlite3
          con=sqlite3.connect('file:/tmp/zh_migaku.sqlite3?mode=ro', uri=True)
          count=con.execute('select count(*) from entries').fetchone()[0]
          assert count >= 500_000, count
          assert con.execute('pragma integrity_check').fetchone()[0] == 'ok'
          con.close()
          print('SQLite rows:', count)
          PY
          mkdir -p unique-out
          cp "$APK" unique-out/Reader-AI-77.42-toc98-build118.apk
          sha256sum unique-out/Reader-AI-77.42-toc98-build118.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reader-AI-77.42-toc98-build118
          path: unique-out/Reader-AI-77.42-toc98-build118.apk
          if-no-files-found: error
          retention-days: 30
