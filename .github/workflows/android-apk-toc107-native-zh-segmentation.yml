name: Android APK toc107 native Chinese segmentation

on:
  push:
    branches:
      - feature/77.42-toc107-native-zh-segmentation
    paths:
      - '.github/workflows/android-apk-toc107-native-zh-segmentation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reader-toc107-native-zh-segmentation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/77.42-toc107-native-zh-segmentation
          fetch-depth: 0

      - name: Apply native Chinese segmentation patch
        run: python3 scripts/patch-toc107-native-zh-segmentation.py

      - name: Verify native segmentation source
        shell: bash
        run: |
          set -euo pipefail
          node --check js/reader-app.js
          node --check js/reader/zh-native-segmentation.js
          node --check js/app.js

          grep -qF 'public void segmentText(String requestId, String text)' android/app/src/main/java/space/saintjust/reader/stage1/ChineseResourceBridge.java
          grep -qF 'native-sqlite-dp-v1' android/app/src/main/java/space/saintjust/reader/stage1/ChineseResourceBridge.java
          grep -qF 'isLikelyThreeCharName' android/app/src/main/java/space/saintjust/reader/stage1/ChineseResourceBridge.java
          grep -qF "readerNativeChineseSegmentationSync?.(s)" js/reader-app.js
          grep -qF 'readerEnsureNativeChineseSegmentation' js/reader-app.js
          grep -qF 'readerPrefetchNativeChineseSegmentation' js/reader/zh-native-segmentation.js
          grep -qF "reader-app.js?v=77.36-native-zh-seg" js/app.js
          grep -qF "js/app.js?v=77.35-native-zh-seg" index.html

          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          db = Path('android/app/src/main/assets/data/zh_migaku.sqlite3')
          assert db.exists(), db
          con = sqlite3.connect(db)
          required = ['国家','中央军委','副主席','职务','免去','委员','同时','终止','全国人大代表','资格','此前','涉嫌','严重','违纪','违法','接受','调查','因此','传闻','国家机构','层面','正式','清除']
          missing=[]
          for w in required:
              row=con.execute('select 1 from entries where word=? limit 1',(w,)).fetchone()
              if not row: missing.append(w)
          print('dictionary missing:', missing)
          # The DP has single-character fallback, but these core compounds must be
          # present or the screenshot regression cannot be guaranteed.
          must_have=['中央军委','副主席','职务','免去','终止','涉嫌','严重','违纪','违法','接受','调查','国家机构']
          assert not [w for w in must_have if w in missing], missing
          con.close()

          # Mirror the Java scoring against the real SQLite data and require the
          # reported sentence to keep its meaningful compounds and two names.
          surnames=set('赵钱孙李周吴郑王冯陈褚卫蒋沈韩杨朱秦尤许何吕施张孔曹严华金魏陶姜戚谢邹喻柏水窦章云苏潘葛奚范彭郎鲁韦昌马苗凤花方俞任袁柳鲍史唐费廉岑薛雷贺倪汤滕殷罗毕郝邬安常乐于时傅皮卞齐康伍余元卜顾孟平黄和穆萧尹姚邵湛汪祁毛禹狄米贝明臧计伏成戴谈宋茅庞熊纪舒屈项祝董梁杜阮蓝闵席季麻强贾路娄危江童颜郭梅盛林刁钟徐邱骆高夏蔡田樊胡凌霍虞万支柯昝管卢莫经房裘缪干解应宗丁宣邓郁单杭洪包诸左石崔吉龚程嵇邢裴陆荣翁荀羊甄曲封芮储靳汲邴糜松井段富巫乌焦巴弓牧隗山谷车侯宓蓬全郗班仰秋仲伊宫宁仇栾暴甘钭厉戎祖武符刘景詹束龙叶幸司韶郜黎蓟薄印宿白怀蒲邰从鄂索咸籍赖卓蔺屠蒙池乔阴胥能苍双闻莘党翟谭贡劳逄姬申扶堵冉宰郦雍郤璩桑桂濮牛寿通边扈燕冀郏浦尚农温别庄晏柴瞿阎充慕连茹习宦艾鱼容向古易慎戈廖庾终暨居衡步都耿满弘匡国文寇广禄阙东欧殳沃利蔚越夔隆师巩厍聂晁勾敖融冷訾辛阚那简饶空曾毋沙乜养鞠须丰巢关蒯相查后荆红游竺权逯盖益桓公')
          stop=set('的了着过们是有在和与及并就也都很又而为被把将从到对起后前中上下来去这那其之')
          con=sqlite3.connect(db)
          score_cache={}
          MISS=-1e12
          def dscore(w):
              if w in score_cache:return score_cache[w]
              row=con.execute('select blcu,subtlex,jieba from entries where word=? limit 1',(w,)).fetchone()
              if not row: score_cache[w]=MISS; return MISS
              ranks=[int(v) for v in row if v is not None and int(v)>0]
              import math
              bonus=0 if not ranks else max(0,6-math.log10(min(ranks)+1)*1.15)
              score_cache[w]=len(w)*len(w)*3+bonus
              return score_cache[w]
          def segment(run):
              n=len(run); best=[MISS]*(n+1); nxt=[0]*(n+1); best[n]=0; nxt[n]=n
              for i in range(n-1,-1,-1):
                  best[i]=.15+best[i+1]; nxt[i]=i+1
                  for ln in range(2,min(8,n-i)+1):
                      w=run[i:i+ln]; sc=dscore(w)
                      if sc<=MISS/2 and ln==3 and w[0] in surnames and w[1] not in stop and w[2] not in stop and dscore(w[:2])<=MISS/2:
                          sc=28
                      if sc<=MISS/2: continue
                      total=sc+best[i+ln]
                      if total>best[i]: best[i]=total; nxt[i]=i+ln
              out=[]; i=0
              while i<n:
                  j=nxt[i] if nxt[i]>i else i+1; out.append(run[i:j]); i=j
              return out
          text='去张又侠的国家中央军委副主席职务，并免去刘振立的国家中央军委委员职务。两人同时被终止全国人大代表资格。此前他们自2026年1月起就已因涉嫌严重违纪违法接受调查，因此这次不是传闻，而是国家机构层面的正式清除。'
          import re
          tokens=[]
          for part in re.findall(r'[\u3400-\u9fff]+|[^\u3400-\u9fff]+',text):
              tokens.extend(segment(part) if re.fullmatch(r'[\u3400-\u9fff]+',part) else [part])
          print('toc107 segmentation:', ' / '.join(tokens))
          for required_token in ['张又侠','刘振立','中央军委','副主席','职务','免去','终止','涉嫌','严重','违纪','违法','接受','调查','国家机构','正式','清除']:
              assert required_token in tokens, (required_token,tokens)
          con.close()
          print('toc107 screenshot segmentation regression: OK')
          PY

      - name: Commit toc107 source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/space/saintjust/reader/stage1/ChineseResourceBridge.java js/reader-app.js js/app.js index.html
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
          else
            git commit -m 'fix(reader): segment Chinese with native SQLite before paint'
            git fetch origin feature/77.42-toc107-native-zh-segmentation
            git rebase origin/feature/77.42-toc107-native-zh-segmentation
            git push origin HEAD:feature/77.42-toc107-native-zh-segmentation
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo '::warning::No shared signing key; install-over may fail.'
            exit 0
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/reader-ai.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/reader-ai.jks" >> "$GITHUB_ENV"

      - name: Validate Instant Translate remains absent
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'InstantTranslate|screen.textcopy|BIND_ACCESSIBILITY_SERVICE' android/app/src/main/AndroidManifest.xml; then
            echo 'Manifest contains Instant Translate remnants' >&2
            exit 1
          fi

      - name: Wire maintained native translation bridges
        run: python3 scripts/wire-toc104-native-bridges.py

      - name: Prepare toc107 build identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          assert s.count('versionCode 118') == 1
          assert s.count("versionName '77.42-toc98'") == 1
          s=s.replace('versionCode 118','versionCode 127',1)
          s=s.replace("versionName '77.42-toc98'","versionName '77.42-toc107'",1)
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify toc107 APK and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -f "$APK"
          unzip -p "$APK" assets/www/js/reader/zh-native-segmentation.js | grep -qF 'readerNativeChineseSegmentationSync'
          unzip -p "$APK" assets/www/js/reader-app.js | grep -qF 'readerEnsureNativeChineseSegmentation'
          unzip -p "$APK" assets/www/js/reader-app.js | grep -qF 'readerNativeChineseSegmentationSync?.(s)'
          unzip -p "$APK" assets/www/js/app.js | grep -qF 'reader-app.js?v=77.36-native-zh-seg'
          unzip -p "$APK" assets/www/index.html | grep -qF 'js/app.js?v=77.35-native-zh-seg'
          unzip -p "$APK" classes.dex | strings | grep -qF 'native-sqlite-dp-v1'
          mkdir -p unique-out
          cp "$APK" unique-out/Reader-AI-77.42-toc107-build127.apk
          sha256sum unique-out/Reader-AI-77.42-toc107-build127.apk | tee unique-out/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reader-AI-77.42-toc107-build127
          path: |
            unique-out/Reader-AI-77.42-toc107-build127.apk
            unique-out/SHA256.txt
          if-no-files-found: error
          retention-days: 30
