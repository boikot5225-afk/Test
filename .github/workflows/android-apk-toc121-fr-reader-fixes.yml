name: Android APK toc121 French reader fixes

on:
  push:
    branches:
      - feature/77.42-toc121-fr-reader-fixes
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/77.42-toc121-fr-reader-fixes
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore established Reader AI signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64}"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/reader-ai.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/reader-ai.jks" >> "$GITHUB_ENV"

      - name: Reproduce maintained Reader runtime and configure toc121
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/wire-toc104-native-bridges.py
          python3 scripts/patch-toc112-zh-context-inline.py
          python3 scripts/patch-toc113-zh-context-coverage.py
          python3 scripts/patch-toc114-zh-core-first-paint.py
          python3 scripts/patch-toc115-zh-missing-only-auth.py
          python3 scripts/patch-zh-lexical-pipeline-v2.py
          python3 scripts/patch-zh-lexical-global-access.py
          python3 scripts/patch-zh-context-pinyin-trust.py
          python3 scripts/patch-toc119-zh-reader-quality.py
          python3 scripts/patch-toc121-fr-reader-fixes.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/app/build.gradle')
          s = p.read_text()
          if s.count('versionCode 118') != 1 or s.count("versionName '77.42-toc98'") != 1:
              raise SystemExit('unexpected Android base identity')
          s = s.replace('versionCode 118', 'versionCode 1010', 1)
          s = s.replace("versionName '77.42-toc98'", "versionName '77.42-toc121-fr-reader-fixes'", 1)
          p.write_text(s)

          index = Path('index.html')
          text = index.read_text()
          text, count = re.subn(r"window\.AN2_BUILD = 'v77\.42-toc119-zh-reader-quality';",
                                "window.AN2_BUILD = 'v77.42-toc121-fr-reader-fixes';", text, count=1)
          if count != 1:
              raise SystemExit('toc121 index build marker patch failed')
          text, count = re.subn(r'<script type="module" src="js/app\.js\?v=77\.42-zh-reader-quality"></script>',
                                '<script type="module" src="js/app.js?v=77.42-fr-reader-fixes"></script>', text, count=1)
          if count != 1:
              raise SystemExit('toc121 app entry cache bust failed')
          index.write_text(text)

          app = Path('js/app.js')
          text = app.read_text()
          text, count = re.subn(r"\} from './reader-app\.js\?v=77\.42-zh-reader-quality';",
                                "} from './reader-app.js?v=77.42-fr-reader-fixes';", text, count=1)
          if count != 1:
              raise SystemExit('toc121 reader app cache bust failed')
          app.write_text(text)
          PY
          rm -rf build

      - name: French morphology context and manual-state regression gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_fr_reader_resources.py --output-dir build/fr-self-test --cache-dir build/fr-self-test-cache --self-test
          node --check js/reader/fr-vocab-estimate.js
          node --check js/reader/fr-lexical-pipeline-v2.js
          node --check js/reader/fr-unknown-gloss.js
          node --check js/reader/fr-context-gloss-v2.js
          node --check js/reader/word-state.js
          node --check js/reader/word-lookup.js
          node --check js/reader-app.js
          cp js/reader/fr-context-gloss-v2.js /tmp/fr-context-gloss-v2.mjs
          node --input-type=module - <<'JS'
          const m = await import('file:///tmp/fr-context-gloss-v2.mjs');
          const cases = [
            [['плохой'], 'он пахнет плохо', 'плохо'],
            [['остановка'], 'он работал без остановки', 'остановки'],
            [['набирать'], 'он набрал номер', 'набрал'],
            [['приносить'], 'это принесло деньги ферме', 'принесло'],
          ];
          for (const [candidate, translated, expected] of cases) {
            const got = m.chooseContextToken(candidate, translated);
            if (got !== expected) throw new Error(`${candidate[0]} + ${translated}: ${got} != ${expected}`);
          }
          console.log('French target-token context regressions PASS');
          JS
          python3 - <<'PY'
          from pathlib import Path
          runtime = Path('js/reader/interactions-runtime.js').read_text()
          vocab = Path('js/reader/fr-vocab-estimate.js').read_text()
          lexical = Path('js/reader/fr-lexical-pipeline-v2.js').read_text()
          gloss = Path('js/reader/fr-unknown-gloss.js').read_text()
          context = Path('js/reader/fr-context-gloss-v2.js').read_text()
          state = Path('js/reader/word-state.js').read_text()
          lookup = Path('js/reader/word-lookup.js').read_text()
          app = Path('js/reader-app.js').read_text()
          activity = Path('android/app/src/main/java/space/saintjust/reader/stage1/MainActivity.java').read_text()
          bridge = Path('android/app/src/main/java/space/saintjust/reader/stage1/FrenchContextTranslateBridge.java').read_text()

          for needle in (
              "fr-vocab-estimate.js?v=2-manual-authority",
              "fr-lexical-pipeline-v2.js?v=2",
              "fr-unknown-gloss.js?v=2-sanitize",
              "fr-context-gloss-v2.js?v=2",
          ):
              assert needle in runtime, needle
          assert "fr-context-gloss.js?v=1" not in runtime
          assert "status=known?'known':'problem'" in vocab
          assert "alias.manualKnowledge=manual" in vocab and "alias.linkedLemma=found.canonical" in vocab
          assert "manual === 'unknown'" in state and "!state.manualKnowledge" in state
          assert "readerFrenchLexicalAnalysisFor" in lookup
          assert "productiveLemma" in lexical and "readerFrenchLexicalOverrideLemmaFor" in lexical
          assert "readerFrenchSanitizeRussian" in lexical and "proper_noun" in lexical
          assert "reader:fr-analysis-ready" in app
          assert "context_pos" in app and "Every user-visible string" in app
          assert "readerFrenchIsProperWord" in gloss
          assert "mlkit-target-token" in context and "deepseek-context" in context
          assert 'ReaderFrenchContextTranslate' in activity
          assert 'TranslateLanguage.FRENCH' in bridge and 'TranslateLanguage.RUSSIAN' in bridge
          print('toc121 French architecture/manual-state gate PASS')
          PY

      - name: Chinese live-page regression gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_zh_migaku_resources.py --self-test
          python3 scripts/build_zh_migaku_resources_v2.py --self-test
          python3 scripts/build_zh_migaku_sqlite.py --self-test
          mkdir -p build/toc121-zh-gate
          python3 scripts/build_zh_migaku_sqlite.py --output-dir build/toc121-zh-gate --cache-dir build/toc121-zh-cache
          python3 scripts/export_zh_jieba_rank_asset.py build/toc121-zh-gate/zh_migaku.sqlite3 build/toc121-zh-gate/zh_jieba_top100k.txt --limit 100000
          node scripts/check-zh-lexical-pipeline-v2.mjs build/toc121-zh-gate/zh_jieba_top100k.txt data/zh_dict_core.json data/zh_lexical_regressions.json
          rm -rf build

      - name: Chinese runtime architecture gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app = Path('js/reader-app.js').read_text()
          runtime = Path('js/reader/interactions-runtime.js').read_text()
          readable = Path('js/reader/zh-readable-inline.js').read_text()
          context = Path('js/reader/zh-context-batch.js').read_text()
          assert 'an2_zh_segment_cache_v8_quality' in app
          assert "zh-direct-ru-fallback.js" not in runtime
          assert "zh-readable-inline.js?v=8-quality" in runtime
          assert "zh-context-batch.js?v=8-quality" in runtime
          assert "fr-vocab-estimate.js?v=2-manual-authority" in runtime
          assert "an2_reader_zh_context_gloss_v4_quality" in context
          assert "schedule(350); return;" in context
          assert "reader-zh-readable-inline-v8-quality" in readable
          assert "toLocaleLowerCase('en-US')" in readable
          marker = "reader:zh-segmentation-ready"
          pos = app.index(marker)
          assert pos >= 0
          window = app[pos:pos + 500]
          assert 'renderReaderChapterInPlace()' not in window, window
          print('toc121 Chinese non-regression architecture gate PASS')
          PY

      - name: Build universal signed APK for real install test
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify universal package before install
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -f "$APK"
          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "${BUILD_TOOLS}/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/APKSIGNER-universal.txt
          grep -q "certificate SHA-256 digest: 9d853f2c43529b55a2d63202b7377c7485bae700b6e4113ca71ceae930664790" /tmp/APKSIGNER-universal.txt
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -qF 'assets/frreader/fr_vocab_frequency.tsv'
          unzip -l "$APK" | grep -qF 'assets/frreader/fr_vocab_lemma.tsv'
          unzip -l "$APK" | grep -qF 'assets/frreader/fr_ru_core.json'
          unzip -l "$APK" | grep -qF 'assets/frreader/fr_ru_senses.json'

      - name: Enable emulator hardware acceleration
        shell: bash
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Install and cold-launch on clean Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: >-
            sh -c 'set -eu; APK="$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)"; test -n "$APK"; echo "Installing $APK"; adb install -r "$APK" > /tmp/install.txt 2>&1 || { cat /tmp/install.txt; exit 1; }; cat /tmp/install.txt; grep -q "^Success$" /tmp/install.txt; adb shell pm path space.saintjust.reader.semanticstage1clean.formatfix.debug; adb shell am start -W -n space.saintjust.reader.semanticstage1clean.formatfix.debug/space.saintjust.reader.stage1.MainActivity > /tmp/launch.txt 2>&1 || { cat /tmp/launch.txt; exit 1; }; cat /tmp/launch.txt; grep -q "Status: ok" /tmp/launch.txt'

      - name: Configure final Galaxy A54 arm64 package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          anchor = "        targetSdk 35\n"
          if s.count(anchor) != 1:
              raise SystemExit('targetSdk anchor not unique')
          s = s.replace(anchor, anchor + "        ndk {\n            abiFilters 'arm64-v8a'\n        }\n", 1)
          p.write_text(s)
          PY
          rm -rf android/app/build

      - name: Build final A54 arm64 APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Re-sign and validate exact toc121 A54 APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -f "$APK"
          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p unique-out
          OUT=unique-out/Reader-AI-77.42-toc121-fr-reader-fixes-a54-vc1010.apk
          KSPASS="${ANDROID_KEYSTORE_PASSWORD:-readerai2026}"
          KEYPASS="${ANDROID_KEY_PASSWORD:-$KSPASS}"
          ALIAS="${ANDROID_KEY_ALIAS:-reader-ai}"
          "${BUILD_TOOLS}/apksigner" sign \
            --ks "${ANDROID_KEYSTORE_PATH}" \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KSPASS" \
            --key-pass "pass:$KEYPASS" \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT" "$APK"
          "${BUILD_TOOLS}/apksigner" verify --verbose --print-certs "$OUT" | tee unique-out/APKSIGNER.txt
          "${BUILD_TOOLS}/aapt" dump badging "$OUT" | tee unique-out/BADGING.txt
          "${BUILD_TOOLS}/zipalign" -c -P 16 -v 4 "$OUT" > unique-out/ZIPALIGN.txt
          unzip -t "$OUT" >/dev/null
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" unique-out/APKSIGNER.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" unique-out/APKSIGNER.txt
          grep -q "certificate SHA-256 digest: 9d853f2c43529b55a2d63202b7377c7485bae700b6e4113ca71ceae930664790" unique-out/APKSIGNER.txt
          grep -q "versionCode='1010'" unique-out/BADGING.txt
          grep -q "native-code: 'arm64-v8a'" unique-out/BADGING.txt
          if unzip -l "$OUT" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo 'non-A54 ABI leaked into APK' >&2
            exit 1
          fi
          unzip -l "$OUT" | grep -qF 'lib/arm64-v8a/libtranslate_jni.so'
          unzip -l "$OUT" | grep -qF 'assets/data/zh_jieba_top100k.txt'
          unzip -l "$OUT" | grep -qF 'assets/data/zh_migaku.sqlite3'
          unzip -l "$OUT" | grep -qF 'assets/frreader/fr_vocab_frequency.tsv'
          unzip -l "$OUT" | grep -qF 'assets/frreader/fr_vocab_lemma.tsv'
          unzip -l "$OUT" | grep -qF 'assets/frreader/fr_vocab_manifest.json'
          unzip -l "$OUT" | grep -qF 'assets/frreader/fr_ru_core.json'
          unzip -l "$OUT" | grep -qF 'assets/frreader/fr_ru_senses.json'
          unzip -l "$OUT" | grep -qF 'assets/frreader/NOTICE.txt'
          if unzip -l "$OUT" | grep -q 'assets/www/build/'; then
            echo 'temporary build directory leaked into APK' >&2
            exit 1
          fi
          sha256sum "$OUT" | tee unique-out/SHA256.txt
          wc -c "$OUT" | tee unique-out/SIZE.txt

      - name: Upload exact toc121 A54 APK
        uses: actions/upload-artifact@v4
        with:
          name: Reader-AI-77.42-toc121-fr-reader-fixes-a54-vc1010
          path: |
            unique-out/Reader-AI-77.42-toc121-fr-reader-fixes-a54-vc1010.apk
            unique-out/SHA256.txt
            unique-out/SIZE.txt
            unique-out/APKSIGNER.txt
            unique-out/BADGING.txt
            unique-out/ZIPALIGN.txt
          retention-days: 30
          if-no-files-found: error
