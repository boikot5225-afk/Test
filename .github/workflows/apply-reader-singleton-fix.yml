name: Apply Reader singleton fix

on:
  push:
    branches:
      - feature/77.42-epub-toc
    paths:
      - '.github/workflows/apply-reader-singleton-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/77.42-epub-toc
      - name: Apply Chinese render stability patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch-zh-stability.py
          node --check js/reader-app.js
          node --check js/reader/chapter-render-next.js
          node --check js/reader/vocab-estimate.js
          node --check js/reader/zh-stable-slots.js
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add js/reader-app.js js/reader/chapter-render-next.js js/reader/vocab-estimate.js js/reader/zh-stable-slots.js
          git commit -m 'fix(reader): keep Chinese late data off live DOM [skip ci]'
          git push origin HEAD:feature/77.42-epub-toc
