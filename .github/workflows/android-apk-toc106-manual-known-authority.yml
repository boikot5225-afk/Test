name: Android APK toc106 manual Known authority

on:
  push:
    branches:
      - feature/77.42-toc106-manual-known-authority
    paths:
      - '.github/workflows/android-apk-toc106-manual-known-authority.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reader-toc106-manual-known-authority
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/77.42-toc106-manual-known-authority
          fetch-depth: 0

      - name: Apply manual Known authority patch
        run: python3 scripts/patch-toc106-manual-known-authority.py

      - name: Verify manual Known authority
        shell: bash
        run: |
          set -euo pipefail
          node --check js/reader-app.js
          node --check js/reader/word-state.js
          node --check js/reader/vocab-estimate.js
          node --check js/reader/en-vocab-estimate.js
          node --check js/reader/interactions-runtime.js
          node --check js/app.js

          grep -qF "state.manualKnowledge = 'known'" js/reader/word-state.js
          grep -qF "state?.known === true && status === 'known' && state?.autoKnown === false" js/reader/vocab-estimate.js
          grep -qF "state?.known === true && status === 'known' && state?.autoKnown === false" js/reader/en-vocab-estimate.js
          grep -qF "classification.source !== 'manual' && el.classList.contains('rw-known')" js/reader/vocab-estimate.js
          grep -qF "info.source !== 'manual' && el.classList.contains('rw-known')" js/reader/en-vocab-estimate.js
          grep -qF "if (classification.source === 'manual') el.classList.remove('rw-known')" js/reader/vocab-estimate.js
          grep -qF "if (info.source === 'manual') el.classList.remove('rw-known')" js/reader/en-vocab-estimate.js
          grep -qF "vocab-estimate.js?v=9-manual-known" js/reader/interactions-runtime.js
          grep -qF "en-vocab-estimate.js?v=2-manual-known" js/reader/interactions-runtime.js
          grep -qF "en-manual-knowledge-bridge.js?v=3-manual-known" js/reader/interactions-runtime.js
          grep -qF "word-state.js?v=5-manual-known" js/reader-app.js
          grep -qF "reader-app.js?v=77.35-manual-known" js/app.js
          grep -qF "js/app.js?v=77.34-manual-known" index.html

          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          function getManualKnowledge(path) {
            const src = fs.readFileSync(path, 'utf8');
            const m = src.match(/function manualKnowledge\(state\) \{([\s\S]*?)\n\}/);
            if (!m) throw new Error('manualKnowledge not found: ' + path);
            return new Function('state', m[1]);
          }
          for (const path of ['js/reader/vocab-estimate.js','js/reader/en-vocab-estimate.js']) {
            const fn = getManualKnowledge(path);
            assert.equal(fn({ manualKnowledge:'known', known:false, status:'new' }), 'known');
            assert.equal(fn({ known:true, status:'known', autoKnown:false }), 'known');
            assert.equal(fn({ known:true, status:'known', autoKnown:'common' }), '');
            assert.equal(fn({ known:false, saved:true, status:'problem' }), 'unknown');
            assert.equal(fn({ known:false, saved:false, status:'new' }), '');
          }
          console.log('manual Known classifier regression: OK');
          NODE

          python3 - <<'PY'
          from pathlib import Path
          zh = Path('js/reader/vocab-estimate.js').read_text()
          en = Path('js/reader/en-vocab-estimate.js').read_text()
          core = Path('js/reader/word-state.js').read_text()
          assert "state.manualKnowledge = 'known'" in core
          assert "if (classification.source !== 'manual' && el.classList.contains('rw-known'))" in zh
          assert "if (info.source !== 'manual' && el.classList.contains('rw-known'))" in en
          assert "if (classification.source === 'manual') el.classList.remove('rw-known')" in zh
          assert "if (info.source === 'manual') el.classList.remove('rw-known')" in en
          # There must be exactly one path that can clear rw-known in each
          # classifier, and it is guarded by explicit manual Unknown.
          assert zh.count("el.classList.remove('rw-known');") == 1
          assert en.count("el.classList.remove('rw-known');") == 1
          print('Known cannot resurrect red; manual Unknown still works: OK')
          PY

      - name: Commit toc106 source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/reader-app.js js/reader/word-state.js js/reader/vocab-estimate.js js/reader/en-vocab-estimate.js js/reader/interactions-runtime.js js/app.js index.html
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
          else
            git commit -m 'fix(reader): manual Known is final authority'
            git fetch origin feature/77.42-toc106-manual-known-authority
            git rebase origin/feature/77.42-toc106-manual-known-authority
            git push origin HEAD:feature/77.42-toc106-manual-known-authority
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo '::warning::No shared signing key; install-over may fail.'
            exit 0
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/reader-ai.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/reader-ai.jks" >> "$GITHUB_ENV"

      - name: Validate Instant Translate remains absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e android/app/src/main/java/space/saintjust/reader/stage1/InstantTranslateActivity.java
          test ! -e android/app/src/main/java/space/saintjust/reader/stage1/InstantTranslateBridge.java
          test ! -e android/app/src/main/java/space/saintjust/reader/stage1/InstantTranslateCaptureService.java
          test ! -e android/app/src/main/java/space/saintjust/reader/stage1/InstantTranslateChatAccessibilityService.java
          test ! -e android/app/src/main/java/space/saintjust/reader/stage1/InstantTranslateChatBridge.java
          if grep -Eq 'InstantTranslate|screen.textcopy|BIND_ACCESSIBILITY_SERVICE' android/app/src/main/AndroidManifest.xml; then
            echo 'Manifest contains Instant Translate remnants' >&2
            exit 1
          fi

      - name: Wire maintained native translation bridges
        run: python3 scripts/wire-toc104-native-bridges.py

      - name: Prepare toc106 build identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          assert s.count('versionCode 118') == 1
          assert s.count("versionName '77.42-toc98'") == 1
          s=s.replace('versionCode 118','versionCode 126',1)
          s=s.replace("versionName '77.42-toc98'","versionName '77.42-toc106'",1)
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify toc106 APK and package artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -f "$APK"
          unzip -p "$APK" assets/www/js/reader/word-state.js | grep -qF "state.manualKnowledge = 'known'"
          unzip -p "$APK" assets/www/js/reader/vocab-estimate.js | grep -qF "classification.source !== 'manual' && el.classList.contains('rw-known')"
          unzip -p "$APK" assets/www/js/reader/en-vocab-estimate.js | grep -qF "info.source !== 'manual' && el.classList.contains('rw-known')"
          unzip -p "$APK" assets/www/js/reader/interactions-runtime.js | grep -qF "vocab-estimate.js?v=9-manual-known"
          unzip -p "$APK" assets/www/js/reader/interactions-runtime.js | grep -qF "en-vocab-estimate.js?v=2-manual-known"
          unzip -p "$APK" assets/www/js/reader-app.js | grep -qF "word-state.js?v=5-manual-known"
          unzip -p "$APK" assets/www/js/app.js | grep -qF "reader-app.js?v=77.35-manual-known"
          unzip -p "$APK" assets/www/index.html | grep -qF "js/app.js?v=77.34-manual-known"
          if unzip -l "$APK" | grep -Eqi 'reader-instant|instant_translate|InstantTranslate'; then
            echo 'Instant Translate file survived into APK' >&2
            exit 1
          fi
          mkdir -p unique-out
          cp "$APK" unique-out/Reader-AI-77.42-toc106-build126.apk
          sha256sum unique-out/Reader-AI-77.42-toc106-build126.apk | tee unique-out/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reader-AI-77.42-toc106-build126
          path: |
            unique-out/Reader-AI-77.42-toc106-build126.apk
            unique-out/SHA256.txt
          if-no-files-found: error
          retention-days: 30
