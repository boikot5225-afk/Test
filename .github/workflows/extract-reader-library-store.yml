name: Extract reader library storage

on:
  push:
    branches: [reader-refactor-clean]
    paths:
      - 'js/reader/library-store.js'
      - '.github/workflows/extract-reader-library-store.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reader-refactor-clean
          fetch-depth: 0
      - name: Extract library storage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('js/app.js')
          source = path.read_text()

          def skip_string(text, index):
              quote = text[index]
              index += 1
              escaped = False
              while index < len(text):
                  char = text[index]
                  if escaped:
                      escaped = False
                  elif char == '\\':
                      escaped = True
                  elif char == quote:
                      return index + 1
                  index += 1
              raise RuntimeError('Unclosed string')

          def find_body(name):
              match = re.search(r'(?:async\s+)?function\s+' + re.escape(name) + r'\s*\(', source)
              if not match:
                  raise RuntimeError('Missing function: ' + name)
              start = match.start()
              index = source.find('(', start)
              parens = 0
              while index < len(source):
                  char = source[index]
                  if char in "'\"`":
                      index = skip_string(source, index)
                      continue
                  if char == '(':
                      parens += 1
                  elif char == ')':
                      parens -= 1
                      if parens == 0:
                          index += 1
                          break
                  index += 1
              while index < len(source) and source[index].isspace():
                  index += 1
              if index >= len(source) or source[index] != '{':
                  raise RuntimeError('Body missing: ' + name)
              depth = 0
              while index < len(source):
                  char = source[index]
                  if char in "'\"`":
                      index = skip_string(source, index)
                      continue
                  if char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth == 0:
                          return start, index + 1
                  index += 1
              raise RuntimeError('Body unclosed: ' + name)

          def replace(name, replacement):
              global source
              start, end = find_body(name)
              source = source[:start] + replacement + source[end:]

          if "./reader/library-store.js" not in source:
              anchor = "import { renderHome } from './home.js';"
              source = source.replace(anchor, "import { createReaderLibraryStore } from './reader/library-store.js?v=1';\n" + anchor)

          if 'const readerLibrary = createReaderLibraryStore(' not in source:
              anchor = 'const readerWordState = createReaderWordState({'
              setup = """const readerLibrary = createReaderLibraryStore({
            getBooks: () => readerBooks,
            setBooks: (value) => { readerBooks = value; },
            storageKey: readerBooksStorageKey,
            dedupeBooks: readerDedupeBooks,
            getCloudUserId: readerCloudUserId,
            isCloudReady: () => !!isSupabaseReady?.(),
            db: () => sb,
            bookImportKey: readerBookImportKey,
            getCloudLoadedOnce: () => readerCloudLoadedOnce,
            setCloudLoadedOnce: (value) => { readerCloudLoadedOnce = value; },
            getCloudSaving: () => readerCloudSaving,
            setCloudSaving: (value) => { readerCloudSaving = value; },
            getCloudSaveTimer: () => readerCloudSaveTimer,
            setCloudSaveTimer: (value) => { readerCloudSaveTimer = value; },
            getCurrentBookId: () => readerCurrentBookId,
          });

          """
              source = source.replace(anchor, setup + anchor)

          replacements = {
              'loadReaderBooks': 'function loadReaderBooks() { return readerLibrary.load(); }',
              'saveReaderBooks': 'function saveReaderBooks() { return readerLibrary.save(); }',
              'loadReaderBooksFromCloud': 'async function loadReaderBooksFromCloud(force = false) { return readerLibrary.loadFromCloud(force); }',
              'scheduleReaderCloudSave': 'function scheduleReaderCloudSave() { return readerLibrary.scheduleCloudSave(); }',
              'saveReaderBooksToCloud': 'async function saveReaderBooksToCloud(options = {}) { return readerLibrary.saveToCloud(options); }',
              'readerCurrentBook': 'function readerCurrentBook() { return readerLibrary.currentBook(); }',
              'readerBookProgress': 'function readerBookProgress(book) { return readerLibrary.progress(book); }',
              'readerContinueBook': 'function readerContinueBook() { return readerLibrary.continueBook(); }',
          }
          for name, replacement in replacements.items():
              replace(name, replacement)

          path.write_text(source)
          PY
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/reader/library-store.js
      - name: Commit extracted app wiring
        run: |
          if git diff --quiet -- js/app.js; then
            echo "No app wiring changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "refactor: extract reader library storage"
          git push origin HEAD:reader-refactor-clean
