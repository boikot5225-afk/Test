name: Wire reader display module

on:
  push:
    branches: [reader-refactor-clean]
    paths:
      - 'js/reader/display.js'
      - '.github/workflows/wire-reader-display.yml'

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reader-refactor-clean
          fetch-depth: 0
      - name: Wire display controller
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          source = path.read_text()

          import_anchor = "import { createReaderLibraryStore } from './reader/library-store.js?v=1';"
          import_line = "import { createReaderDisplay } from './reader/display.js?v=1';\n"
          if "./reader/display.js" not in source:
              if import_anchor not in source:
                  raise RuntimeError('Display import anchor missing')
              source = source.replace(import_anchor, import_anchor + '\n' + import_line)

          start_marker = "const READER_DISPLAY_KEY = 'an2_reader_display_v1';"
          end_marker = 'function readerZhPinyinMode()'
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise RuntimeError('Display block markers not found')

          block = (
              "const READER_DISPLAY_KEY = 'an2_reader_display_v1';\n"
              "const readerDisplay = createReaderDisplay({ key: READER_DISPLAY_KEY });\n\n"
              "function readerLoadDisplay() { return readerDisplay.load(); }\n"
              "function readerSaveDisplay(settings) { return readerDisplay.save(settings); }\n"
              "function readerApplyDisplay(settings) { return readerDisplay.apply(settings); }\n"
              "function readerInitDisplay() { return readerDisplay.init(); }\n"
              "function readerToggleDisplayPanel() { return readerDisplay.togglePanel(); }\n"
              "function readerCloseDisplayPanel() { return readerDisplay.closePanel(); }\n"
              "function rdSetFont(name, element) { return readerDisplay.setFont(name, element); }\n"
              "function rdSetSize(input) { return readerDisplay.setSize(input); }\n"
              "function rdSetLH(input) { return readerDisplay.setLineHeight(input); }\n"
              "function rdSetTheme(theme, element) { return readerDisplay.setTheme(theme, element); }\n\n"
          )
          source = source[:start] + block + source[end:]
          path.write_text(source)
          PY
      - name: Check syntax
        run: |
          node --check js/app.js
          node --check js/reader/display.js
      - name: Commit wiring
        run: |
          if git diff --quiet -- js/app.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "refactor: wire reader display module"
          git push origin HEAD:reader-refactor-clean
