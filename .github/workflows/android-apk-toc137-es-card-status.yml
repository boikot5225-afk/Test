name: Android APK toc137 Spanish card status + frozen toc136

on:
  push:
    branches:
      - feature/77.42-toc137-es-card-status
    paths:
      - '.github/workflows/android-apk-toc137-es-card-status.yml'
      - 'scripts/materialize_es_vocab_module.py'
      - 'scripts/validate_toc137_frozen_toc136.sh'
      - 'scripts/validate_toc137_es_card_status.sh'
      - 'scripts/audit_toc137_es_card_status_live.py'
      - 'scripts/run_toc137_es_card_status_emulator.sh'
      - 'android/app/build.gradle'
  workflow_dispatch:

jobs:
  spanish-card-status-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/77.42-toc137-es-card-status
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore established Reader AI signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64}"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/reader-ai.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/reader-ai.jks" >> "$GITHUB_ENV"

      - name: Materialize offline guest cold-start fix
        shell: bash
        run: python3 scripts/patch_toc126_guest_cold_start.py

      - name: Validate frozen toc136 plus Spanish panel ownership
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/validate_toc137_es_card_status.sh
          python3 -m py_compile scripts/audit_toc137_es_card_status_live.py

      - name: Build universal APK from validated source
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify generated Spanish card owner inside APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          ES_JS="$(mktemp)"
          unzip -p "$APK" assets/www/js/reader/es-vocab-estimate.js > "$ES_JS"
          grep -qF 'readerEsVocabPanelHook' "$ES_JS"
          grep -qF "panel.dataset.migakuKnowledge!=='es1'" "$ES_JS"
          grep -qF "panel.dataset.migakuKnowledge='es1'" "$ES_JS"
          grep -qF 'reader-es-known-btn' "$ES_JS"
          grep -qF 'reader-es-unknown-btn' "$ES_JS"
          grep -qF 'reader-es-knowledge-source' "$ES_JS"
          if grep -qF 'readerFrVocabPanelHook' "$ES_JS"; then
            echo 'French panel hook leaked into Spanish generated owner' >&2
            exit 1
          fi
          if grep -qF "panel.dataset.migakuKnowledge='fr1'" "$ES_JS"; then
            echo 'French panel marker leaked into Spanish generated owner' >&2
            exit 1
          fi
          rm -f "$ES_JS"

      - name: Prepare realistic EPUB and audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/make_toc126_storage_audit_epub.py
          test "$(stat -c %s runtime-audit/toc126-storage-audit.epub)" -gt 4000000
          python3 -m pip install --quiet websocket-client requests

      - name: Enable emulator hardware acceleration
        shell: bash
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Android 15 full toc136 suite plus FR-to-ES lazy card status
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash scripts/run_toc137_es_card_status_emulator.sh

      - name: Upload toc137 live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toc137-es-card-status-live-evidence
          path: runtime-audit/
          if-no-files-found: warn
          retention-days: 90

      - name: Configure final Galaxy A54 ABI only
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/configure_toc123_a54_abi.py
          rm -rf android/app/build

      - name: Build final Galaxy A54 APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Sign and validate vc1030 A54 APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p unique-out
          OUT=unique-out/Reader-AI-77.42-toc137-es-card-status-a54-vc1030.apk
          KSPASS="${ANDROID_KEYSTORE_PASSWORD:-readerai2026}"
          KEYPASS="${ANDROID_KEY_PASSWORD:-$KSPASS}"
          ALIAS="${ANDROID_KEY_ALIAS:-reader-ai}"
          "${BUILD_TOOLS}/apksigner" sign \
            --ks "${ANDROID_KEYSTORE_PATH}" \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KSPASS" \
            --key-pass "pass:$KEYPASS" \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT" "$APK"
          "${BUILD_TOOLS}/apksigner" verify --verbose --print-certs "$OUT" | tee unique-out/APKSIGNER.txt
          "${BUILD_TOOLS}/aapt" dump badging "$OUT" | tee unique-out/BADGING.txt
          "${BUILD_TOOLS}/zipalign" -c -P 16 -v 4 "$OUT" > unique-out/ZIPALIGN.txt
          unzip -t "$OUT" >/dev/null
          ES_JS="$(mktemp)"
          unzip -p "$OUT" assets/www/js/reader/es-vocab-estimate.js > "$ES_JS"
          grep -qF 'readerEsVocabPanelHook' "$ES_JS"
          grep -qF "panel.dataset.migakuKnowledge='es1'" "$ES_JS"
          grep -qF 'reader-es-knowledge-source' "$ES_JS"
          rm -f "$ES_JS"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" unique-out/APKSIGNER.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" unique-out/APKSIGNER.txt
          grep -q "certificate SHA-256 digest: 9d853f2c43529b55a2d63202b7377c7485bae700b6e4113ca71ceae930664790" unique-out/APKSIGNER.txt
          grep -q "versionCode='1030'" unique-out/BADGING.txt
          grep -q "versionName='77.42-toc137-es-card-status-debug'" unique-out/BADGING.txt
          grep -q "targetSdkVersion:'35'" unique-out/BADGING.txt
          grep -q "native-code: 'arm64-v8a'" unique-out/BADGING.txt
          if unzip -l "$OUT" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo 'non-A54 ABI leaked into final package' >&2
            exit 1
          fi
          sha256sum "$OUT" | tee unique-out/SHA256.txt
          stat -c '%n %s bytes' "$OUT" | tee unique-out/SIZE.txt

      - name: Upload verified toc137 A54 APK
        uses: actions/upload-artifact@v4
        with:
          name: Reader-AI-77.42-toc137-es-card-status-a54-vc1030
          path: unique-out/
          if-no-files-found: error
          retention-days: 30
