name: Deploy toc132 readerAI English + French context batch

on:
  push:
    branches:
      - feature/77.42-toc126-storage-import-v2
    paths:
      - 'functions/en-context-task.js'
      - 'functions/fr-context-task.js'
      - 'functions/zh-context-task.js'
      - 'functions/zh-polyphones-packed.js'
      - '.github/workflows/deploy-toc132-reader-ai-context.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-reader-ai-french-da79a
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS }}
      GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/77.42-toc126-storage-import-v2

      - name: Inject bounded ZH FR EN context tasks into readerAI only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('functions/index.js')
          source = path.read_text(encoding='utf-8')

          prompt_anchor = "  const langName = sourceLangName(lang);\n\n"
          prompt_patch = """  const langName = sourceLangName(lang);\n\n  if (task === 'zh_context_batch') {\n    const { buildZhContextBatchPrompt } = require('./zh-context-task');\n    try {\n      return buildZhContextBatchPrompt(body);\n    } catch (error) {\n      throw new HttpsError('invalid-argument', error?.message || String(error));\n    }\n  }\n\n  if (task === 'fr_context_batch') {\n    const { buildFrContextBatchPrompt } = require('./fr-context-task');\n    try {\n      return buildFrContextBatchPrompt(body);\n    } catch (error) {\n      throw new HttpsError('invalid-argument', error?.message || String(error));\n    }\n  }\n\n  if (task === 'en_context_batch') {\n    const { buildEnContextBatchPrompt } = require('./en-context-task');\n    try {\n      return buildEnContextBatchPrompt(body);\n    } catch (error) {\n      throw new HttpsError('invalid-argument', error?.message || String(error));\n    }\n  }\n\n"""
          if source.count(prompt_anchor) != 1:
              raise SystemExit(f'buildPrompt anchor count={source.count(prompt_anchor)}')
          source = source.replace(prompt_anchor, prompt_patch, 1)

          token_anchor = "function maxTokensForTask(task) {\n  if (task === 'generate_verb') return 1400;"
          token_patch = "function maxTokensForTask(task) {\n  if (task === 'zh_context_batch') return 1200;\n  if (task === 'fr_context_batch') return 1500;\n  if (task === 'en_context_batch') return 1500;\n  if (task === 'generate_verb') return 1400;"
          if source.count(token_anchor) != 1:
              raise SystemExit(f'maxTokens anchor count={source.count(token_anchor)}')
          source = source.replace(token_anchor, token_patch, 1)

          auth_anchor = """  async (request) => {\n    if (!request.auth?.uid) {\n      throw new HttpsError('unauthenticated', 'Нужно войти в Firebase Auth.');\n    }\n\n    const body = request.data || {};\n    const task = String(body.task || '').trim();\n    if (!task) throw new HttpsError('invalid-argument', 'Missing task');\n"""
          auth_patch = """  async (request) => {\n    const body = request.data || {};\n    const task = String(body.task || '').trim();\n    if (!task) throw new HttpsError('invalid-argument', 'Missing task');\n\n    const lang = sourceLang(body);\n    const guestReaderContext =\n      (task === 'fr_context_batch' && lang === 'fr') ||\n      (task === 'en_context_batch' && lang === 'en');\n    if (!request.auth?.uid && !guestReaderContext) {\n      throw new HttpsError('unauthenticated', 'Нужно войти в Firebase Auth.');\n    }\n"""
          if source.count(auth_anchor) != 1:
              raise SystemExit(f'readerAI auth anchor count={source.count(auth_anchor)}')
          source = source.replace(auth_anchor, auth_patch, 1)

          usage_anchor = "    await enforceDailyLimit(request.auth.uid, task);"
          usage_patch = "    await enforceDailyLimit(request.auth?.uid || `guest_${sourceLang(body)}_context`, task);"
          if source.count(usage_anchor) != 1:
              raise SystemExit(f'usage anchor count={source.count(usage_anchor)}')
          source = source.replace(usage_anchor, usage_patch, 1)

          # Deploy only readerAI. TTS/STT functions and unrelated secrets are
          # deliberately cut out so this English change cannot alter them.
          marker = '// Cloud TTS proxy:'
          marker_at = source.find(marker)
          if marker_at < 0:
              raise SystemExit('Cloud TTS marker not found')
          section_at = source.rfind('// ─', 0, marker_at)
          if section_at < 0:
              raise SystemExit('readerAI section boundary not found')
          source = source[:section_at].rstrip() + '\n'

          for declaration in (
              "const OPENROUTER_API_KEY = defineSecret('OPENROUTER_API_KEY');\n",
              "const SELFHOST_TTS_STT_URL = defineSecret('SELFHOST_TTS_STT_URL');\n",
              "const SELFHOST_TOKEN = defineSecret('SELFHOST_TOKEN');\n",
          ):
              source = source.replace(declaration, '')

          required = (
              "exports.readerAI = onCall(",
              "task === 'zh_context_batch'",
              "buildZhContextBatchPrompt(body)",
              "task === 'fr_context_batch'",
              "buildFrContextBatchPrompt(body)",
              "task === 'en_context_batch'",
              "buildEnContextBatchPrompt(body)",
              "if (task === 'en_context_batch') return 1500",
              "const guestReaderContext =",
              "task === 'en_context_batch' && lang === 'en'",
              "if (!request.auth?.uid && !guestReaderContext)",
              "thinking: { type: 'disabled' }",
              "response_format: { type: 'json_object' }",
          )
          for item in required:
              if item not in source:
                  raise SystemExit(f'Required readerAI behavior missing: {item}')
          path.write_text(source, encoding='utf-8')
          PY

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install and verify conservative English prompt
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix functions ci --ignore-scripts
          node --check functions/index.js
          node --check functions/en-context-task.js
          node --check functions/fr-context-task.js
          node --check functions/zh-context-task.js
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { buildEnContextBatchPrompt } = require('./functions/en-context-task');
          const prompt = buildEnContextBatchPrompt({
            context: 'He sat on the bank of the river, then ran out of patience and gave up.',
            targets: [
              { id:'t0', surface:'bank', lemma:'bank', localRu:'банк', senses:['банк','берег'] },
              { id:'t1', surface:'ran', lemma:'run', localRu:'бежать' },
              { id:'t2', surface:'up', lemma:'up', localRu:'вверх' },
            ],
          });
          assert.match(prompt, /offline WikDict gloss/);
          assert.match(prompt, /bank.*банк.*берег/s);
          assert.match(prompt, /run out/);
          assert.match(prompt, /give up/);
          assert.match(prompt, /Be conservative with confidence/);

          const source = fs.readFileSync('functions/index.js','utf8');
          assert.match(source, /task === 'zh_context_batch'/);
          assert.match(source, /task === 'fr_context_batch'/);
          assert.match(source, /task === 'en_context_batch'/);
          assert.match(source, /guestReaderContext/);
          assert.match(source, /task === 'en_context_batch' && lang === 'en'/);
          assert.equal((source.match(/exports\.readerAI\s*=\s*onCall/g)||[]).length,1);
          console.log('readerAI ZH + FR + conservative EN context deploy source PASS');
          NODE

      - name: Select deployment credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${FIREBASE_TOKEN}" ]]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
            exit 0
          fi
          credentials="${FIREBASE_SERVICE_ACCOUNT_JSON}"
          [[ -n "$credentials" ]] || credentials="${GOOGLE_CREDENTIALS_JSON}"
          [[ -n "$credentials" ]] || credentials="${GCP_SA_KEY_JSON}"
          if [[ -z "$credentials" ]]; then
            echo '::error::No Firebase deployment credential is configured.'
            exit 1
          fi
          credentials_file="${RUNNER_TEMP}/firebase-service-account.json"
          printf '%s' "$credentials" > "$credentials_file"
          chmod 600 "$credentials_file"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${credentials_file}" >> "$GITHUB_ENV"
          echo "FIREBASE_AUTH_MODE=adc" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        shell: bash
        run: |
          set -euo pipefail
          cli_root="${RUNNER_TEMP}/firebase-cli"
          npm --prefix "$cli_root" install --no-save --ignore-scripts firebase-tools@15.24.0
          node "$cli_root/node_modules/firebase-tools/lib/bin/firebase.js" --version

      - name: Deploy existing readerAI only
        shell: bash
        run: |
          set -euo pipefail
          firebase_cli="${RUNNER_TEMP}/firebase-cli/node_modules/firebase-tools/lib/bin/firebase.js"
          args=(deploy --only functions:readerAI --project french-da79a --non-interactive)
          if [[ "${FIREBASE_AUTH_MODE}" == "token" ]]; then
            node "$firebase_cli" "${args[@]}" --token "$FIREBASE_TOKEN"
          else
            node "$firebase_cli" "${args[@]}"
          fi
