name: Smart Book pinyin core

on:
  push:
    branches:
      - feature/smartbook-chinese-pinyin
    paths:
      - tools/smartbook-chinese-pinyin/**
      - .github/workflows/smartbook-pinyin-core.yml
  workflow_dispatch:

concurrency:
  group: smartbook-pinyin-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run segmentation and pinyin regression tests
        run: gradle -p tools/smartbook-chinese-pinyin smokeTest --no-daemon
