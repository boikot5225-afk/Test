name: Android APK toc97 context batch

on:
  push:
    branches:
      - feature/77.42-toc97-context-batch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "::warning::No shared signing key; install-over may fail."
            exit 0
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/reader-ai.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/reader-ai.jks" >> "$GITHUB_ENV"

      - name: Validate resource builders
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_zh_migaku_resources.py --self-test
          python3 scripts/build_zh_migaku_resources_v2.py --self-test
          python3 scripts/build_zh_migaku_sqlite.py --self-test

      - name: Check JavaScript and function syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find js -type f -name '*.js' -print0)
          node --check functions/zh-batch-index.js

      - name: Verify toc97 isolation contract
        shell: bash
        run: |
          set -euo pipefail
          grep -qF "versionCode 117" android/app/build.gradle
          grep -qF "versionName '77.42-toc97'" android/app/build.gradle
          grep -qF "zh-resource-profiles.js?v=2" js/reader/interactions-runtime.js
          grep -qF "zh-readable-inline.js?v=6" js/reader/interactions-runtime.js
          grep -qF "zh-context-batch.js?v=1" js/reader/interactions-runtime.js
          grep -qF "readerZhBatch" js/reader/zh-context-batch.js
          grep -qF ".reader-word[data-word]" js/reader/zh-context-batch.js
          grep -qF "classList.contains('rw-migaku-unknown')" js/reader/zh-context-batch.js
          grep -qF "rw-zh-gloss-wrap" js/reader/zh-context-batch.js
          grep -qF "zhGlossStickyRu" js/reader/zh-context-batch.js
          grep -qF "zhGlossStickyPinyin" js/reader/zh-context-batch.js
          grep -qF "MAX_TARGETS = 18" js/reader/zh-context-batch.js
          grep -qF "exports.readerZhBatch = onCall(" functions/zh-batch-index.js
          grep -qF 'boundary="suspect"' functions/zh-batch-index.js
          # The new layer may annotate existing wrappers, but must never own the
          # token DOM or repaginate/re-render the chapter.
          if grep -Eq 'innerHTML[[:space:]]*=|replaceChildren\(|renderReaderChapter|readerNextParagraph|readerPrevParagraph' js/reader/zh-context-batch.js; then
            echo "Context batch crossed the toc94 layout/navigation boundary" >&2
            exit 1
          fi
          node scripts/check-reader-zh-unknown-gloss.mjs

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify toc97 APK contents
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -f "$APK"
          unzip -l "$APK" | grep -qF 'assets/data/zh_migaku.sqlite3'
          unzip -l "$APK" | grep -qF 'assets/data/zh_migaku_manifest.json'
          unzip -l "$APK" | grep -qF 'assets/www/js/reader/zh-resource-profiles.js'
          unzip -l "$APK" | grep -qF 'assets/www/js/reader/zh-readable-inline.js'
          unzip -l "$APK" | grep -qF 'assets/www/js/reader/zh-context-batch.js'
          unzip -p "$APK" assets/data/zh_migaku.sqlite3 > /tmp/zh_migaku.sqlite3
          python3 - <<'PY'
          import sqlite3
          con=sqlite3.connect('file:/tmp/zh_migaku.sqlite3?mode=ro', uri=True)
          count=con.execute('select count(*) from entries').fetchone()[0]
          assert count >= 500_000, count
          for word in ('摇头','立刻','特警','觉得','中国'):
              assert con.execute('select 1 from entries where word=? limit 1',(word,)).fetchone(), word
          assert con.execute('pragma integrity_check').fetchone()[0] == 'ok'
          con.close()
          print('SQLite rows:', count)
          PY
          mkdir -p unique-out
          cp "$APK" unique-out/Reader-AI-77.42-toc97-build117.apk
          sha256sum unique-out/Reader-AI-77.42-toc97-build117.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reader-AI-77.42-toc97-build117
          path: unique-out/Reader-AI-77.42-toc97-build117.apk
          if-no-files-found: error
          retention-days: 30
