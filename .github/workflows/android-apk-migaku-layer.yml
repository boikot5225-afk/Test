name: Android APK toc95 Migaku layer

on:
  push:
    branches:
      - feature/77.42-toc94-migaku-layer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "::warning::No shared signing key; install-over may fail."
            exit 0
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/reader-ai.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/reader-ai.jks" >> "$GITHUB_ENV"

      - name: Validate resource parser
        run: python3 scripts/build_zh_migaku_resources.py --self-test

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find js -type f -name '*.js' -print0)

      - name: Verify toc95 wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -qF "versionCode 115" android/app/build.gradle
          grep -qF "versionName '77.42-toc95'" android/app/build.gradle
          grep -qF "zh-resource-profiles.js?v=1" js/reader/interactions-runtime.js
          grep -qF "dependsOn 'prepareZhMigakuResources'" android/app/build.gradle
          grep -qF "Migaku Mandarin Dictionary" scripts/build_zh_migaku_resources.py
          grep -qF "TV & Movies" scripts/build_zh_migaku_resources.py
          node scripts/check-reader-zh-unknown-gloss.mjs

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify bundled Chinese resources
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -f "$APK"
          unzip -l "$APK" | grep -qF 'assets/data/zh_migaku_dict.json'
          unzip -l "$APK" | grep -qF 'assets/data/zh_migaku_profiles.json'
          unzip -l "$APK" | grep -qF 'assets/data/zh_migaku_manifest.json'
          unzip -l "$APK" | grep -qF 'assets/www/js/reader/zh-resource-profiles.js'
          unzip -p "$APK" assets/data/zh_migaku_manifest.json | tee /tmp/zh_migaku_manifest.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/zh_migaku_manifest.json', encoding='utf-8'))
          assert p['dictionary']['count'] >= 1000, p
          assert p['frequency']['blcu']['count'] >= 1000, p
          assert p['frequency']['subtlex']['count'] >= 1000, p
          assert p['frequency']['jieba']['count'] >= 1000, p
          print('dictionary', p['dictionary']['count'])
          print('BLCU', p['frequency']['blcu']['count'])
          print('SUBTLEX', p['frequency']['subtlex']['count'])
          print('Jieba', p['frequency']['jieba']['count'])
          print('union', p['unionCount'])
          PY
          mkdir -p unique-out
          cp "$APK" unique-out/Reader-AI-77.42-toc95-build115.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reader-AI-77.42-toc95-build115
          path: unique-out/Reader-AI-77.42-toc95-build115.apk
          if-no-files-found: error
          retention-days: 30
