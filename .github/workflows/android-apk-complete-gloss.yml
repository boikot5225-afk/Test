name: Android APK toc100 complete Chinese gloss

on:
  push:
    branches:
      - feature/77.42-toc100-complete-gloss
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "::warning::No shared signing key; install-over may fail."
            exit 0
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/reader-ai.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/reader-ai.jks" >> "$GITHUB_ENV"

      - name: Validate toc100 Chinese gloss source
        shell: bash
        run: |
          set -euo pipefail
          node --check js/reader/zh-context-batch.js
          node --check js/reader/zh-direct-ru-fallback.js
          node --check js/reader/zh-context-auth-wakeup.js
          node --check js/reader/interactions-runtime.js
          node --check functions/zh-polyphones-packed.js
          node --check functions/zh-context-task.js

          grep -qF "an2_reader_zh_context_gloss_v3" js/reader/zh-context-batch.js
          grep -qF "MAX_RETRY_ATTEMPTS = 4" js/reader/zh-context-batch.js
          grep -qF "if (!stored.ru)" js/reader/zh-context-batch.js
          grep -qF "noteIncomplete(occurrence.cacheKey)" js/reader/zh-context-batch.js
          grep -qF "an2_reader_zh_mlkit_ru_v1" js/reader/zh-direct-ru-fallback.js
          grep -qF "ReaderChineseTranslate" js/reader/zh-direct-ru-fallback.js
          grep -qF "zh-direct-ru-fallback.js?v=1" js/reader/interactions-runtime.js
          grep -qF "zh-context-auth-wakeup.js?v=1" js/reader/interactions-runtime.js
          grep -qF "zh-context-batch.js?v=4" js/reader/interactions-runtime.js

          python3 - <<'PY'
          from pathlib import Path
          s=Path('js/reader/zh-context-batch.js').read_text()
          incomplete=s.index('if (!stored.ru)')
          complete=s.index('cache.set(occurrence.cacheKey, stored)', incomplete)
          branch=s[incomplete:complete]
          assert 'cache.set(occurrence.cacheKey, stored)' not in branch
          assert 'noteIncomplete(occurrence.cacheKey)' in branch
          assert "CACHE_BASE_KEY = 'an2_reader_zh_context_gloss_v3'" in s
          print('toc100 incomplete-result retry contract: OK')
          PY

          node - <<'NODE'
          const assert = require('node:assert/strict');
          const poly = require('./functions/zh-polyphones-packed');
          const { buildZhContextBatchPrompt } = require('./functions/zh-context-task');
          assert.equal(poly.count, 792);
          assert.deepEqual(poly.lookupPolyphone('还').readings, ['hái','huán']);
          const prompt = buildZhContextBatchPrompt({context:'把书还给我。',targets:[{id:'t0',surface:'还'}]});
          assert.match(prompt, /pinyinCandidates/);
          assert.match(prompt, /hái/);
          assert.match(prompt, /huán/);
          NODE

      - name: Validate Chinese resource builders
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_zh_migaku_resources.py --self-test
          python3 scripts/build_zh_migaku_resources_v2.py --self-test
          python3 scripts/build_zh_migaku_sqlite.py --self-test
          grep -qF "com.google.mlkit:translate:17.0.3" android/app/build.gradle
          grep -qF "TranslateLanguage.CHINESE" android/app/src/main/java/space/saintjust/reader/stage1/ChineseOfflineTranslateBridge.java
          grep -qF "TranslateLanguage.RUSSIAN" android/app/src/main/java/space/saintjust/reader/stage1/ChineseOfflineTranslateBridge.java
          grep -qF "downloadModelIfNeeded" android/app/src/main/java/space/saintjust/reader/stage1/ChineseOfflineTranslateBridge.java

      - name: Wire native Chinese to Russian bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/java/space/saintjust/reader/stage1/MainActivity.java')
          s=p.read_text()

          field='    private ChineseResourceBridge chineseResourceBridge;\n'
          field_patch=field+'    private ChineseOfflineTranslateBridge chineseOfflineTranslateBridge;\n'
          assert s.count(field) == 1
          s=s.replace(field, field_patch, 1)

          anchor='        webView.addJavascriptInterface(chineseResourceBridge, "ReaderChineseResources");\n'
          patch=anchor+'\n        // toc100: direct on-device Chinese -> Russian fallback. It only returns\n        // strings; toc94 still owns all Chinese layout and Known/Unknown state.\n        chineseOfflineTranslateBridge = new ChineseOfflineTranslateBridge(this, webView);\n        webView.addJavascriptInterface(chineseOfflineTranslateBridge, "ReaderChineseTranslate");\n'
          assert s.count(anchor) == 1
          s=s.replace(anchor, patch, 1)

          destroy='        if (chineseResourceBridge != null) {\n            chineseResourceBridge.shutdown();\n            chineseResourceBridge = null;\n        }\n'
          destroy_patch=destroy+'        if (chineseOfflineTranslateBridge != null) {\n            chineseOfflineTranslateBridge.shutdown();\n            chineseOfflineTranslateBridge = null;\n        }\n'
          assert s.count(destroy) == 1
          s=s.replace(destroy, destroy_patch, 1)

          p.write_text(s)
          PY
          grep -qF 'addJavascriptInterface(chineseOfflineTranslateBridge, "ReaderChineseTranslate")' android/app/src/main/java/space/saintjust/reader/stage1/MainActivity.java
          grep -qF 'chineseOfflineTranslateBridge.shutdown()' android/app/src/main/java/space/saintjust/reader/stage1/MainActivity.java

      - name: Prepare toc100 build identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          if s.count('versionCode 118') != 1 or s.count("versionName '77.42-toc98'") != 1:
              raise SystemExit('toc98 build identity anchor changed')
          s=s.replace('versionCode 118','versionCode 120',1)
          s=s.replace("versionName '77.42-toc98'","versionName '77.42-toc100'",1)
          p.write_text(s)
          PY
          grep -qF 'versionCode 120' android/app/build.gradle
          grep -qF "versionName '77.42-toc100'" android/app/build.gradle

      - name: Verify toc94 layout contract remains untouched
        shell: bash
        run: |
          set -euo pipefail
          grep -qF 'toc94 Chinese reading aid' js/reader/zh-readable-inline.js
          for file in js/reader/zh-context-batch.js js/reader/zh-direct-ru-fallback.js js/reader/zh-context-auth-wakeup.js; do
            if grep -Eq 'renderReaderChapter|readerNextParagraph|readerPrevParagraph|readerSelectParagraph' "$file"; then
              echo "toc100 crossed toc94 layout/navigation boundary: $file" >&2
              exit 1
            fi
          done
          if grep -Eq 'appendChild\(|createElement\(|replaceChildren\(' js/reader/zh-direct-ru-fallback.js; then
            echo 'direct ZH->RU fallback must not create or move Reader DOM' >&2
            exit 1
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify toc100 APK contents
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -f "$APK"
          unzip -l "$APK" | grep -qF 'assets/data/zh_migaku.sqlite3'
          unzip -l "$APK" | grep -qF 'assets/www/js/reader/zh-readable-inline.js'
          unzip -l "$APK" | grep -qF 'assets/www/js/reader/zh-context-batch.js'
          unzip -l "$APK" | grep -qF 'assets/www/js/reader/zh-direct-ru-fallback.js'
          unzip -l "$APK" | grep -qF 'assets/www/js/reader/zh-context-auth-wakeup.js'
          unzip -p "$APK" assets/www/js/reader/interactions-runtime.js | grep -qF 'zh-direct-ru-fallback.js?v=1'
          unzip -p "$APK" assets/www/js/reader/interactions-runtime.js | grep -qF 'zh-context-batch.js?v=4'
          unzip -p "$APK" assets/www/js/reader/zh-context-batch.js | grep -qF 'an2_reader_zh_context_gloss_v3'
          unzip -p "$APK" assets/www/js/reader/zh-direct-ru-fallback.js | grep -qF 'ReaderChineseTranslate'
          unzip -p "$APK" 'classes*.dex' | strings | grep -qF 'ReaderChineseTranslate'
          unzip -p "$APK" 'classes*.dex' | strings | grep -qF 'mlkit_zh_ru_offline'

          unzip -p "$APK" assets/data/zh_migaku.sqlite3 > /tmp/zh_migaku.sqlite3
          python3 - <<'PY'
          import sqlite3
          con=sqlite3.connect('file:/tmp/zh_migaku.sqlite3?mode=ro', uri=True)
          count=con.execute('select count(*) from entries').fetchone()[0]
          assert count >= 500_000, count
          assert con.execute('pragma integrity_check').fetchone()[0] == 'ok'
          con.close()
          print('SQLite rows:', count)
          PY

          mkdir -p unique-out
          cp "$APK" unique-out/Reader-AI-77.42-toc100-build120.apk
          sha256sum unique-out/Reader-AI-77.42-toc100-build120.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reader-AI-77.42-toc100-build120
          path: unique-out/Reader-AI-77.42-toc100-build120.apk
          if-no-files-found: error
          retention-days: 30
