name: Recover Migaku payload

on:
  push:
    branches:
      - tmp-recover-migaku-20260825

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match exact APK prefix against Migaku official lists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/db
          base='https://migaku-public-data.migaku.com/dicts/zh_CN/frequency_lists'
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 "$base/Beijing%20Language%20and%20Culture%20University%20Corpus.db.gz" -o recovery/db/standard.db.gz
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 "$base/Jieba.db.gz" -o recovery/db/internet.db.gz
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 "$base/Loach.db.gz" -o recovery/db/tv_movies.db.gz
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 "$base/The%20Chairman%20Bao.db.gz" -o recovery/db/news.db.gz
          python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib, json, sqlite3

          exact=Path('data/zh_vocab_frequency_0.txt').read_text('utf-8').splitlines()
          assert len(exact)==5000
          names={
            'standard':'Standard / BLCU',
            'internet':'Internet / Jieba',
            'tv_movies':'TV & Movies / SUBTLEX-CH',
            'news':"News / The Chairman's Bao",
          }
          report=[]
          winner=None
          for slug,name in names.items():
              raw=Path(f'recovery/db/{slug}.db.gz').read_bytes()
              dbbytes=gzip.decompress(raw)
              dbp=Path(f'recovery/db/{slug}.db')
              dbp.write_bytes(dbbytes)
              con=sqlite3.connect(dbp)
              tables=[r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table'")]
              table='langFrequencyEntry' if 'langFrequencyEntry' in tables else next(t for t in tables if not t.startswith('sqlite_'))
              cols=[r[1] for r in con.execute(f'PRAGMA table_info("{table}")')]
              termcol='term' if 'term' in cols else cols[0]
              freqcol='frequency' if 'frequency' in cols else None
              idcol='id' if 'id' in cols else 'rowid'
              order=f'"{freqcol}" ASC, "{idcol}" ASC' if freqcol else f'"{idcol}" ASC'
              rows=con.execute(f'SELECT "{termcol}" FROM "{table}" ORDER BY {order}').fetchall()
              con.close()
              words=[str(r[0]) for r in rows]
              prefix=words[:len(exact)]
              mism=[(i+1,a,b) for i,(a,b) in enumerate(zip(exact,prefix)) if a!=b]
              if len(prefix)<len(exact):
                  mism.extend((i+1,exact[i],None) for i in range(len(prefix),len(exact)))
              info={
                'slug':slug,'name':name,'rows':len(words),'table':table,'columns':cols,
                'mismatch_count_first5000':len(mism),'first_mismatches':mism[:12],
                'first20':words[:20],'rank4990_5005':words[4989:5005],'last20':words[-20:],
                'gz_sha256':hashlib.sha256(raw).hexdigest(),
              }
              report.append(info)
              print(json.dumps(info,ensure_ascii=False,indent=2))
              if not mism and len(words)>=39999:
                  winner=(slug,name,words)

          Path('recovery/match-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),'utf-8')
          if winner:
              slug,name,words=winner
              top=words[:39999]
              payload=json.dumps(top,ensure_ascii=False,separators=(',',':'))
              Path('recovery/zh_vocab_frequency.json').write_text(payload,'utf-8')
              summary={'winner':name,'slug':slug,'source_rows':len(words),'count':len(top),'unique':len(set(top)),'first20':top[:20],'last20':top[-20:],'sha256':hashlib.sha256(payload.encode()).hexdigest()}
              Path('recovery/winner.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),'utf-8')
              print('WINNER',json.dumps(summary,ensure_ascii=False,indent=2))
              assert len(top)==39999 and len(set(top))==39999
          else:
              Path('recovery/winner.json').write_text(json.dumps({'winner':None},indent=2),'utf-8')
              print('NO EXACT MATCH')
          PY
      - name: Upload match report
        uses: actions/upload-artifact@v4
        with:
          name: migaku-frequency-match
          path: |
            recovery/match-report.json
            recovery/winner.json
            recovery/zh_vocab_frequency.json
          if-no-files-found: warn
