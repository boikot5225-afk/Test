name: Recover Migaku payload

on:
  push:
    branches:
      - tmp-recover-migaku-20260825

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Migaku zh public frequency catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery
          curl -fL --retry 3 --connect-timeout 20 --max-time 120 \
            'https://migaku-public-data.migaku.com/dicts/index2.json' \
            -o recovery/index2.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          cat=json.loads(Path('recovery/index2.json').read_text('utf-8'))
          zh=next(x for x in cat.get('languages',[]) if x.get('code')=='zh_CN')
          out={k:zh.get(k) for k in ['code','name_en','frequency_url_db','frequency_lists','word_lists','vocabulary_lists'] if k in zh}
          Path('recovery/zh_CN_catalog.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),'utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Upload catalog
        uses: actions/upload-artifact@v4
        with:
          name: migaku-zh-catalog
          path: recovery/zh_CN_catalog.json
          if-no-files-found: error
