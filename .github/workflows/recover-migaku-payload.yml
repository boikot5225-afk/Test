name: Recover Migaku payload

on:
  push:
    branches:
      - tmp-recover-migaku-20260825

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect Migaku XAPK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/xapk recovery/report
          curl -fL --retry 4 --retry-delay 2 --connect-timeout 30 --max-time 1200 \
            'https://d.apkpure.net/b/XAPK/com.migaku.android?version=latest' \
            -o recovery/migaku.xapk
          echo "XAPK bytes: $(stat -c%s recovery/migaku.xapk)"
          sha256sum recovery/migaku.xapk | tee recovery/report/xapk.sha256
          unzip -q recovery/migaku.xapk -d recovery/xapk
          find recovery/xapk -maxdepth 2 -type f -printf '%s %p\n' | sort -nr | head -80 | tee recovery/report/xapk-files.txt
          python3 - <<'PY'
          from pathlib import Path
          import json
          for p in [Path('recovery/xapk/manifest.json'),Path('recovery/xapk/manifest.json')]:
              if p.exists():
                  print(p.read_text('utf-8',errors='replace')[:10000])
                  Path('recovery/report/manifest.json').write_bytes(p.read_bytes())
                  break
          PY

          mkdir -p recovery/apks
          i=0
          while IFS= read -r apk; do
            i=$((i+1))
            d="recovery/apks/$i"
            mkdir -p "$d"
            unzip -q "$apk" -d "$d" || true
            echo "$i $apk" >> recovery/report/apk-map.txt
          done < <(find recovery/xapk -type f -name '*.apk' | sort)

          echo '--- candidate frontend/data files ---' | tee recovery/report/candidates.txt
          find recovery/apks -type f \( -name '*.js' -o -name '*.json' -o -name '*.txt' -o -name '*.db' -o -name '*.sqlite' -o -name '*.html' -o -name '*.gz' -o -name '*.bin' \) \
            -printf '%s %p\n' | sort -nr | head -500 >> recovery/report/candidates.txt

          # Search text/binary assets for several signatures from the exact assessment list.
          for pat in '我.{0,30}的.{0,30}你.{0,30}了.{0,30}是' '竭尽全力' '据我所知' '围绕' 'Measure my level' 'measureMyLevel' 'vocabulary estimate'; do
            echo "=== PATTERN: $pat ===" | tee -a recovery/report/grep.txt
            grep -RIlEa --exclude='*.so' --exclude='*.dex' "$pat" recovery/apks 2>/dev/null | head -100 | tee -a recovery/report/grep.txt || true
          done

          # Copy modest-size matching files so they can be inspected outside logs.
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil, hashlib, json
          root=Path('recovery/apks')
          out=Path('recovery/matches'); out.mkdir(exist_ok=True)
          pats=[b'\xe6\x88\x91', '竭尽全力'.encode(), '据我所知'.encode(), b'Measure my level', b'measureMyLevel']
          rows=[]
          for p in root.rglob('*'):
              if not p.is_file(): continue
              try: size=p.stat().st_size
              except: continue
              if size>80_000_000: continue
              try: data=p.read_bytes()
              except: continue
              hits=[x.decode('utf-8','replace') if isinstance(x,bytes) else str(x) for x in pats if x in data]
              if not hits: continue
              row={'path':str(p),'size':size,'sha256':hashlib.sha256(data).hexdigest(),'hits':hits}
              rows.append(row)
              if size<=20_000_000:
                  name=(str(p.relative_to(root)).replace('/','__'))
                  shutil.copyfile(p,out/name)
          Path('recovery/report/matches.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),'utf-8')
          print(json.dumps(rows[:100],ensure_ascii=False,indent=2))
          PY

      - name: Upload inspection output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migaku-xapk-inspection
          path: |
            recovery/report/
            recovery/matches/
          if-no-files-found: error
