name: Android APK toc117 emulator install gate

on:
  push:
    branches:
      - feature/77.42-zh-lexical-pipeline-v2
  workflow_dispatch:

jobs:
  install-test:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/77.42-zh-lexical-pipeline-v2
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore established Reader AI signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64}"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/reader-ai.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/reader-ai.jks" >> "$GITHUB_ENV"

      - name: Reproduce toc117 source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/wire-toc104-native-bridges.py
          python3 scripts/patch-toc112-zh-context-inline.py
          python3 scripts/patch-toc113-zh-context-coverage.py
          python3 scripts/patch-toc114-zh-core-first-paint.py
          python3 scripts/patch-toc115-zh-missing-only-auth.py
          python3 scripts/patch-zh-lexical-pipeline-v2.py
          python3 scripts/patch-zh-lexical-global-access.py
          python3 scripts/patch-zh-context-pinyin-trust.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          s=s.replace('versionCode 118','versionCode 1006',1)
          s=s.replace("versionName '77.42-toc98'","versionName '77.42-toc117-zh-lexical-install-fix'",1)
          p.write_text(s)
          PY
          rm -rf build

      - name: Build toc117 APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Install and launch on clean Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
            adb install -r "$APK" > /tmp/install.txt 2>&1 || { cat /tmp/install.txt; exit 1; }
            cat /tmp/install.txt
            grep -q '^Success$' /tmp/install.txt
            adb shell pm path space.saintjust.reader.semanticstage1clean.formatfix.debug
            adb shell am start -W -n space.saintjust.reader.semanticstage1clean.formatfix.debug/space.saintjust.reader.stage1.MainActivity > /tmp/launch.txt 2>&1 || { cat /tmp/launch.txt; exit 1; }
            cat /tmp/launch.txt
            adb shell dumpsys package space.saintjust.reader.semanticstage1clean.formatfix.debug | head -80
