name: Android APK

# Builds the WebView shell in android/ as a debug APK. That project stages the
# repository root into assets/www itself (syncWebAssets, wired to preBuild), so
# there is nothing to assemble by hand here — unlike the older stage1 workflows,
# which generated a wrapper on the fly.

on:
  push:
    branches:
      - claude/check-branches-latest-changes-wydht2
      - fix/zh-pinyin-stability-77.37
      - fix/77.41-zh-open-a54
      - perf/77.41-reader-core
      - feature/77.42-epub-toc
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'icons/**'
  pull_request:
    branches:
      - claude/check-branches-latest-changes-wydht2
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'icons/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore the signing key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — this APK is signed with a throwaway key and will not install over previous builds."
            exit 0
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/reader-ai.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/reader-ai.jks" >> "${GITHUB_ENV}"
          echo "signing key restored"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find js -type f -name '*.js' -print0)

      - name: Check performance guards
        shell: bash
        run: |
          set -euo pipefail
          grep -qF "root.addEventListener('click'" js/reader/interactions.js \
            || { echo 'reader interactions are not delegated'; exit 1; }
          if grep -qF "root.querySelectorAll('.reader-word')" js/reader/interactions.js; then
            echo 'per-word listener scan returned'; exit 1
          fi
          grep -qF 'HOT PATH: once the state is in memory, load() must be O(1)' js/reader/word-state.js \
            || { echo 'O(1) word-state cache guard missing'; exit 1; }
          grep -qF 'const store = load();' js/reader/word-state.js \
            || { echo 'word-state paragraph batching missing'; exit 1; }
          grep -qF 'scheduleLocalCommit(550)' js/reader/library-store.js \
            || { echo 'deferred library commit missing'; exit 1; }
          grep -qF 'function waitForIdle()' js/reader/chapter-render-next.js \
            || { echo 'idle chapter backfill missing'; exit 1; }

      - name: Check EPUB TOC guards
        shell: bash
        run: |
          set -euo pipefail
          grep -qF "parseNcxToc" js/reader/toc-upgrade.js \
            || { echo 'EPUB2 NCX parser missing'; exit 1; }
          grep -qF "parseNavToc" js/reader/toc-upgrade.js \
            || { echo 'EPUB3 navigation parser missing'; exit 1; }
          grep -qF "book.toc = upgrade.toc" js/reader/toc-upgrade.js \
            || { echo 'book TOC persistence missing'; exit 1; }
          grep -qF "window.readerOpenToc = openUpgradedToc" js/reader/toc-upgrade.js \
            || { echo 'hierarchical TOC UI override missing'; exit 1; }
          grep -qF "import './toc-upgrade.js?v=1'" js/reader/interactions-runtime.js \
            || { echo 'TOC runtime is not loaded'; exit 1; }

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Check the reader assets actually shipped
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          for entry in \
            assets/www/data/zh_dict_core.json \
            assets/www/data/ja_dict_core.json \
            assets/www/js/reader/ja-dict.js \
            assets/www/js/reader/word-state.js \
            assets/www/js/reader/library-store.js \
            assets/www/js/reader/interactions.js \
            assets/www/js/reader/interactions-runtime.js \
            assets/www/js/reader/toc-upgrade.js \
            assets/www/js/reader/library-idb-store.js \
            assets/www/js/reader/word-state-idb-store.js \
            assets/www/js/reader/lexical-cache-idb-store.js \
            assets/www/js/reader/chapter-render-next.js \
            assets/www/js/reader-app.js \
            assets/www/index.html
          do
            unzip -l "$APK" | grep -qF "$entry" || { echo "missing from APK: $entry"; exit 1; }
          done
          unzip -p "$APK" assets/www/js/reader-app.js | grep -qF 'readerTokenizeJapaneseParagraph' \
            || { echo 'reader-app.js in the APK has no Japanese tokenizer'; exit 1; }
          unzip -p "$APK" assets/www/js/reader/word-state.js | grep -qF 'PASSIVE_RUBY_SENTINEL' \
            || { echo 'stable CJK ruby policy did not ship'; exit 1; }
          unzip -p "$APK" assets/www/js/reader/word-state.js | grep -qF 'load() must be O(1)' \
            || { echo 'word-state O(1) hot-path fix did not ship'; exit 1; }
          unzip -p "$APK" assets/www/js/reader/interactions.js | grep -qF "root.addEventListener('click'" \
            || { echo 'delegated reader interactions did not ship'; exit 1; }
          unzip -p "$APK" assets/www/js/reader/library-store.js | grep -qF 'scheduleLocalCommit(550)' \
            || { echo 'deferred library snapshot did not ship'; exit 1; }
          unzip -p "$APK" assets/www/js/reader/chapter-render-next.js | grep -qF 'startCjkCoreWarmupInBackground' \
            || { echo 'non-blocking CJK dictionary warm-up did not ship'; exit 1; }
          unzip -p "$APK" assets/www/js/reader/chapter-render-next.js | grep -qF 'function waitForIdle()' \
            || { echo 'idle chapter backfill did not ship'; exit 1; }
          unzip -p "$APK" assets/www/js/reader/chapter-render-next.js | grep -qF 'const PRIORITY_WINDOW = 8' \
            || { echo 'A54 first-paint window did not ship'; exit 1; }
          unzip -p "$APK" assets/www/js/reader/toc-upgrade.js | grep -qF 'EPUB2 NCX' \
            || { echo 'EPUB2 TOC support did not ship'; exit 1; }
          unzip -p "$APK" assets/www/js/reader/toc-upgrade.js | grep -qF 'EPUB3 nav' \
            || { echo 'EPUB3 TOC support did not ship'; exit 1; }
          unzip -p "$APK" assets/www/js/reader/toc-upgrade.js | grep -qF 'book.toc = upgrade.toc' \
            || { echo 'TOC persistence did not ship'; exit 1; }
          unzip -p "$APK" assets/www/js/reader/library-idb-store.js | grep -qF 'IDB_READ_TIMEOUT_MS = 1200' \
            || { echo 'library IndexedDB deadline did not ship'; exit 1; }
          unzip -p "$APK" assets/www/js/reader/word-state-idb-store.js | grep -qF 'IDB_READ_TIMEOUT_MS = 700' \
            || { echo 'word-state IndexedDB deadline did not ship'; exit 1; }
          unzip -p "$APK" assets/www/js/reader/lexical-cache-idb-store.js | grep -qF 'IDB_READ_TIMEOUT_MS = 700' \
            || { echo 'lexical-cache IndexedDB deadline did not ship'; exit 1; }
          if unzip -p "$APK" assets/www/js/reader/chapter-render-next.js | grep -qF 'holdFirstCjkPaintUntilCore'; then
            echo 'blocking single-paint CJK renderer is back'; exit 1
          fi
          unzip -p "$APK" classes.dex | strings | grep -qF 'ServiceWorkerControllerCompat' \
            || { echo 'native service-worker interception did not compile into the APK'; exit 1; }
          if unzip -l "$APK" | grep -qF 'assets/www/scripts/'; then
            echo 'dev scripts leaked into the APK'; exit 1
          fi
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -1)"
          if [[ -n "${APKSIGNER}" ]]; then
            "${APKSIGNER}" verify --print-certs "$APK" | grep -i 'SHA-256 digest' || true
          fi
          echo "all checks passed"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reader-ai-77.42-toc1-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  deliver:
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feature/77.42-epub-toc'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download the APK just built above
        uses: actions/download-artifact@v4
        with:
          name: reader-ai-77.42-toc1-debug
          path: apk-out

      - name: Commit APK to delivery branch
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find apk-out -name '*.apk' | head -1)"
          echo "found: $APK ($(du -h "$APK" | cut -f1))"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --orphan apk-delivery
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p delivered
          cp "$APK" delivered/reader-ai-77.42-toc1-debug.apk
          git add delivered/reader-ai-77.42-toc1-debug.apk
          git commit -m "chore: deliver reader-ai-77.42-toc1-debug.apk from run ${{ github.run_id }}"
          git push --force origin HEAD:apk-delivery
