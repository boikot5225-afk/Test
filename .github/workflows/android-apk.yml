name: Android APK

# Builds the WebView shell in android/ as a debug APK. That project stages the
# repository root into assets/www itself (syncWebAssets, wired to preBuild), so
# there is nothing to assemble by hand here — unlike the older stage1 workflows,
# which generated a wrapper on the fly.

on:
  push:
    branches:
      - claude/check-branches-latest-changes-wydht2
      - fix/zh-pinyin-stability-77.37
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'icons/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The keystore file is the only secret worth storing — its password and
      # alias are useless without it and have defaults in the build file. Absent
      # this, each runner signs with its own generated debug key and Android
      # refuses to install the new APK over the previous one.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      # Optional: only needed if the keystore is ever replaced by one that does
      # not use the defaults in android/app/build.gradle.
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore the signing key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — this APK is signed with a throwaway key and will not install over previous builds."
            exit 0
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/reader-ai.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/reader-ai.jks" >> "${GITHUB_ENV}"
          echo "signing key restored"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Check the reader assets actually shipped
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          for entry in \
            assets/www/data/zh_dict_core.json \
            assets/www/data/ja_dict_core.json \
            assets/www/js/reader/ja-dict.js \
            assets/www/js/reader/word-state.js \
            assets/www/js/reader/chapter-render-next.js \
            assets/www/js/reader-app.js \
            assets/www/index.html
          do
            unzip -l "$APK" | grep -qF "$entry" || { echo "missing from APK: $entry"; exit 1; }
          done
          unzip -p "$APK" assets/www/js/reader-app.js | grep -qF 'readerTokenizeJapaneseParagraph' \
            || { echo 'reader-app.js in the APK has no Japanese tokenizer'; exit 1; }
          unzip -p "$APK" assets/www/js/reader/word-state.js | grep -qF 'PASSIVE_RUBY_SENTINEL' \
            || { echo 'stable CJK ruby policy did not ship'; exit 1; }
          unzip -p "$APK" assets/www/js/reader/chapter-render-next.js | grep -qF 'holdFirstCjkPaintUntilCore' \
            || { echo 'single-paint CJK renderer did not ship'; exit 1; }
          unzip -p "$APK" assets/www/js/reader/chapter-render-next.js | grep -qF 'Подготавливаю слова и пиньинь' \
            || { echo 'Chinese dictionary warm-up state did not ship'; exit 1; }
          if unzip -l "$APK" | grep -qF 'assets/www/scripts/'; then
            echo 'dev scripts leaked into the APK'; exit 1
          fi
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -1)"
          if [[ -n "${APKSIGNER}" ]]; then
            "${APKSIGNER}" verify --print-certs "$APK" | grep -i 'SHA-256 digest' || true
          fi
          echo "all checks passed"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reader-ai-77.37-zh-stable-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
