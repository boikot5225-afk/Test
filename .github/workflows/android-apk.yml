name: Android APK

# Builds the WebView shell in android/ as a debug APK. That project stages the
# repository root into assets/www itself (syncWebAssets, wired to preBuild), so
# there is nothing to assemble by hand here — unlike the older stage1 workflows,
# which generated a wrapper on the fly.

on:
  push:
    branches:
      - claude/check-branches-latest-changes-wydht2
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'icons/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Empty unless the repository defines it. Without a shared keystore each
      # runner signs with its own generated debug key, and Android then refuses
      # to install the new APK over the previous one.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore the signing key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — this APK is signed with a throwaway key and will not install over previous builds."
            exit 0
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/reader-ai.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/reader-ai.jks" >> "${GITHUB_ENV}"
          echo "signing key restored"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Check the Japanese support actually shipped
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          # An APK that builds but leaves the dictionary behind would look fine
          # and read Japanese without furigana, so assert the assets are in it.
          for entry in \
            assets/www/data/ja_dict_core.json \
            assets/www/js/reader/ja-dict.js \
            assets/www/js/reader-app.js \
            assets/www/index.html
          do
            unzip -l "$APK" | grep -qF "$entry" || { echo "missing from APK: $entry"; exit 1; }
          done
          unzip -p "$APK" assets/www/js/reader-app.js | grep -qF 'readerTokenizeJapaneseParagraph' \
            || { echo 'reader-app.js in the APK has no Japanese tokenizer'; exit 1; }
          # Dev tooling must stay out — scripts/ is excluded by syncWebAssets.
          if unzip -l "$APK" | grep -qF 'assets/www/scripts/'; then
            echo 'dev scripts leaked into the APK'; exit 1
          fi
          # The signing certificate is what decides whether this APK can replace
          # the installed one, so print its fingerprint: it must stay the same
          # from build to build.
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -1)"
          if [[ -n "${APKSIGNER}" ]]; then
            "${APKSIGNER}" verify --print-certs "$APK" | grep -i 'SHA-256 digest' || true
          fi
          echo "all checks passed"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reader-ai-japanese-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
