name: Extract reader word lookup

on:
  push:
    branches: [reader-refactor-clean]
    paths:
      - 'js/reader/word-lookup.js'
      - '.github/workflows/extract-reader-word-lookup-clean.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reader-refactor-clean
          fetch-depth: 0
      - name: Extract local word lookup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('js/app.js')
          source = path.read_text()

          def skip_string(text, index):
              quote = text[index]
              index += 1
              escaped = False
              while index < len(text):
                  char = text[index]
                  if escaped:
                      escaped = False
                  elif char == '\\':
                      escaped = True
                  elif char == quote:
                      return index + 1
                  index += 1
              raise RuntimeError('Unclosed string')

          def find_body(name):
              match = re.search(r'(?:async\s+)?function\s+' + re.escape(name) + r'\s*\(', source)
              if not match:
                  raise RuntimeError('Missing function: ' + name)
              start = match.start()
              index = source.find('(', start)
              depth = 0
              while index < len(source):
                  char = source[index]
                  if char in "'\"`":
                      index = skip_string(source, index)
                      continue
                  if char == '(':
                      depth += 1
                  elif char == ')':
                      depth -= 1
                      if depth == 0:
                          index += 1
                          break
                  index += 1
              while index < len(source) and source[index].isspace():
                  index += 1
              if index >= len(source) or source[index] != '{':
                  raise RuntimeError('Body missing: ' + name)
              depth = 0
              while index < len(source):
                  char = source[index]
                  if char in "'\"`":
                      index = skip_string(source, index)
                      continue
                  if char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth == 0:
                          return start, index + 1
                  index += 1
              raise RuntimeError('Body unclosed: ' + name)

          if "./reader/word-lookup.js" not in source:
              anchor = "import { renderHome } from './home.js';"
              source = source.replace(anchor, "import { createReaderWordLookup } from './reader/word-lookup.js?v=1';\n" + anchor)

          if 'const readerWordLookup = createReaderWordLookup(' not in source:
              anchor = 'const readerWordPanel = createReaderWordPanel({'
              setup = """const readerWordLookup = createReaderWordLookup({
            currentLang: () => readerCurrentLang(),
            normalizeWord: readerNormalizeWord,
            lookupChineseWord: readerLookupChineseWord,
            fetchChineseDictEntry: readerFetchChineseDictEntry,
            quickLookup: readerQuickLookup,
            getCachedLexical: readerGetCachedLexical,
            findVerbByForm: readerFindVerbByForm,
            findKnownNoun: readerFindKnownNoun,
          });

          """
              source = source.replace(anchor, setup + anchor)

          start, end = find_body('readerLookupWord')
          source = source[:start] + "async function readerLookupWord(word) { return readerWordLookup.lookup(word); }" + source[end:]
          path.write_text(source)
          PY
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/reader/word-lookup.js
      - name: Commit extracted app wiring
        run: |
          if git diff --quiet -- js/app.js; then
            echo "No app wiring changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "refactor: extract reader local word lookup"
          git push origin HEAD:reader-refactor-clean
