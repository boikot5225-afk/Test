name: Android APK unique delivery

on:
  push:
    branches:
      - feature/77.42-epub-toc
    paths:
      - '.github/workflows/android-apk-unique.yml'
      - 'android/**'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'icons/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      filename: ${{ steps.meta.outputs.filename }}
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*/\1/p" android/app/build.gradle | head -1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' android/app/build.gradle | head -1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          FILENAME="Reader-AI-${VERSION_NAME}-build${VERSION_CODE}.apk"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "Building $FILENAME"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "::warning::No shared signing key; install-over may fail."
            exit 0
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/reader-ai.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/reader-ai.jks" >> "$GITHUB_ENV"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find js -type f -name '*.js' -print0)

      - name: Verify toc91 Chinese renderer wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -qF "import './zh-unknown-gloss-spacing.js?v=3'" js/reader/interactions-runtime.js
          grep -qF "import './zh-readable-inline.js?v=3'" js/reader/interactions-runtime.js
          grep -qF "reader-zh-readable-inline-v3" js/reader/zh-readable-inline.js
          grep -qF "display: contents !important" js/reader/zh-readable-inline.js
          grep -qF "position: absolute !important" js/reader/zh-readable-inline.js
          if grep -qF "display: inline-flex !important" js/reader/zh-readable-inline.js; then
            echo "Geometry-changing inline-flex returned"; exit 1
          fi
          if grep -qF "rw-zh-readable-pinyin'" js/reader/zh-readable-inline.js; then
            echo "A second pinyin lane returned"; exit 1
          fi
          grep -qF "versionCode 111" android/app/build.gradle
          grep -qF "versionName '77.42-toc91'" android/app/build.gradle
          node scripts/check-reader-zh-unknown-gloss.mjs

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Stage uniquely named APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -f "$APK"
          mkdir -p unique-out
          cp "$APK" "unique-out/${{ steps.meta.outputs.filename }}"
          unzip -l "$APK" | grep -qF 'assets/www/js/reader/zh-readable-inline.js'
          unzip -p "$APK" assets/www/js/reader/interactions-runtime.js | grep -qF "import './zh-readable-inline.js?v=3'"
          unzip -p "$APK" assets/www/js/reader/zh-readable-inline.js | grep -qF 'reader-zh-readable-inline-v3'
          echo "Unique APK staged: ${{ steps.meta.outputs.filename }}"

      - name: Upload unique APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reader-ai-unique-${{ github.sha }}
          path: unique-out/${{ steps.meta.outputs.filename }}
          if-no-files-found: error

  deliver:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download APK from this exact build
        uses: actions/download-artifact@v4
        with:
          name: reader-ai-unique-${{ github.sha }}
          path: apk-out

      - name: Publish without overwriting older APKs
        shell: bash
        run: |
          set -euo pipefail
          FILENAME='${{ needs.build.outputs.filename }}'
          APK="$(find apk-out -name '*.apk' | head -1)"
          test -f "$APK"
          cp "$APK" "${RUNNER_TEMP}/${FILENAME}"
          rm -rf apk-out

          # The legacy workflow still publishes its old toc3-debug name. Give it
          # time to finish, then append this immutable filename afterwards.
          sleep 75

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin apk-delivery:apk-delivery || true
          if git show-ref --verify --quiet refs/heads/apk-delivery; then
            git checkout apk-delivery
          else
            git checkout --orphan apk-delivery
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p delivered
          cp "${RUNNER_TEMP}/${FILENAME}" "delivered/${FILENAME}"
          git add "delivered/${FILENAME}"
          if git diff --cached --quiet; then
            echo "Already delivered: ${FILENAME}"
            exit 0
          fi
          git commit -m "chore: deliver ${FILENAME} from ${GITHUB_SHA}"
          git push origin HEAD:apk-delivery
          echo "Published delivered/${FILENAME}"
