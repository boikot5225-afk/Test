name: Android APK toc116 Chinese lexical pipeline v2

on:
  push:
    branches:
      - feature/77.42-zh-lexical-pipeline-v2
    paths:
      - 'js/reader/zh-segment-v2.js'
      - 'js/reader/zh-lexical-trust.js'
      - 'scripts/patch-zh-lexical-pipeline-v2.py'
      - 'scripts/patch-zh-lexical-global-access.py'
      - 'scripts/patch-zh-context-pinyin-trust.py'
      - 'scripts/patch-toc115-zh-missing-only-auth.py'
      - 'scripts/check-zh-lexical-pipeline-v2.mjs'
      - 'scripts/export_zh_jieba_rank_asset.py'
      - 'data/zh_lexical_regressions.json'
      - '.github/workflows/android-apk-toc116-zh-lexical-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-toc116-zh-lexical-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/77.42-zh-lexical-pipeline-v2
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore established Reader AI signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64}"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/reader-ai.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/reader-ai.jks" >> "$GITHUB_ENV"

      - name: Validate clean toc107 source base and patch chain
        shell: bash
        run: |
          set -euo pipefail
          grep -qF "window.AN2_BUILD = 'v77.42-toc107-zh-segmentation';" index.html
          grep -qF "const READER_ZH_SEGMENT_CACHE_KEY = 'an2_zh_segment_cache_v5';" js/reader-app.js
          test -f scripts/wire-toc104-native-bridges.py
          test -f scripts/patch-toc112-zh-context-inline.py
          test -f scripts/patch-toc113-zh-context-coverage.py
          test -f scripts/patch-toc114-zh-core-first-paint.py
          test -f scripts/patch-toc115-zh-missing-only-auth.py
          test -f scripts/patch-zh-lexical-pipeline-v2.py

      - name: Reproduce maintained toc112 to toc115 chain
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/wire-toc104-native-bridges.py
          python3 scripts/patch-toc112-zh-context-inline.py
          python3 scripts/patch-toc113-zh-context-coverage.py
          python3 scripts/patch-toc114-zh-core-first-paint.py
          python3 scripts/patch-toc115-zh-missing-only-auth.py

      - name: Apply Chinese lexical pipeline v2
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-zh-lexical-pipeline-v2.py
          python3 scripts/patch-zh-lexical-global-access.py
          python3 scripts/patch-zh-context-pinyin-trust.py

      - name: Set install-over version identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          if s.count('versionCode 118') != 1:
              raise SystemExit('unexpected base versionCode')
          if s.count("versionName '77.42-toc98'") != 1:
              raise SystemExit('unexpected base versionName')
          s = s.replace('versionCode 118', 'versionCode 1005', 1)
          s = s.replace("versionName '77.42-toc98'", "versionName '77.42-toc116-zh-lexical-v2'", 1)
          p.write_text(s)
          PY

      - name: Validate patched runtime invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -qF "an2_zh_segment_cache_v7_weighted" js/reader-app.js
          grep -qF "segmentChineseWeighted" js/reader-app.js
          grep -qF "ensureZhSegmentRanks" js/reader-app.js
          grep -qF "globalThis.readerLookupChineseWord = readerLookupChineseWord;" js/reader-app.js
          grep -qF "../data/zh_jieba_top100k.txt" js/reader/zh-segment-v2.js
          grep -qF "isUnlexicalizedProductiveForm" js/reader/zh-segment-v2.js
          grep -qF "chinesePinyinNeedsContext" js/reader/zh-context-batch.js
          grep -qF "classifyChineseGloss" js/reader/zh-context-batch.js
          grep -qF "globalThis.__AN2_FALLBACK_FIREBASE" js/reader/zh-context-batch.js
          grep -qF "setLane(wrap, word, pinyin, '');" js/reader/zh-readable-inline.js
          grep -qF "const CONTEXT_GRACE_MS = 2_200;" js/reader/zh-direct-ru-fallback.js
          grep -qF "window.AN2_BUILD = 'v77.42-toc116-zh-lexical-v2';" index.html
          grep -qF "versionCode 1005" android/app/build.gradle
          grep -qF "versionName '77.42-toc116-zh-lexical-v2'" android/app/build.gradle

          python3 - <<'PY'
          from urllib.parse import urljoin
          base='https://appassets.androidplatform.net/assets/www/index.html'
          target=urljoin(base, '../data/zh_jieba_top100k.txt')
          expected='https://appassets.androidplatform.net/assets/data/zh_jieba_top100k.txt'
          assert target == expected, (target, expected)
          print('Android WebView rank URL:', target)
          PY

          while IFS= read -r -d '' file; do node --check "$file"; done < <(find js -type f -name '*.js' -print0)

      - name: Build real lexical regression resources
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_zh_migaku_resources.py --self-test
          python3 scripts/build_zh_migaku_resources_v2.py --self-test
          python3 scripts/build_zh_migaku_sqlite.py --self-test
          mkdir -p build/toc116-lexical-gate
          python3 scripts/build_zh_migaku_sqlite.py \
            --output-dir build/toc116-lexical-gate \
            --cache-dir build/toc116-migaku-cache
          python3 scripts/export_zh_jieba_rank_asset.py \
            build/toc116-lexical-gate/zh_migaku.sqlite3 \
            build/toc116-lexical-gate/zh_jieba_top100k.txt \
            --limit 100000
          node scripts/check-zh-lexical-pipeline-v2.mjs \
            build/toc116-lexical-gate/zh_jieba_top100k.txt \
            data/zh_dict_core.json \
            data/zh_lexical_regressions.json

      - name: Build signed debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Validate exact APK and embedded lexical pipeline
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -f "$APK"
          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p unique-out

          "${BUILD_TOOLS}/apksigner" verify --verbose --print-certs "$APK" | tee unique-out/APKSIGNER.txt
          "${BUILD_TOOLS}/aapt" dump badging "$APK" | tee unique-out/BADGING.txt
          "${BUILD_TOOLS}/zipalign" -c -P 16 -v 4 "$APK" > unique-out/ZIPALIGN.txt
          unzip -t "$APK" >/dev/null

          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" unique-out/APKSIGNER.txt
          grep -q "certificate SHA-256 digest: 9d853f2c43529b55a2d63202b7377c7485bae700b6e4113ca71ceae930664790" unique-out/APKSIGNER.txt
          grep -q "package: name='space.saintjust.reader.semanticstage1clean.formatfix.debug' versionCode='1005'" unique-out/BADGING.txt

          unzip -l "$APK" | grep -qF 'assets/data/zh_migaku.sqlite3'
          unzip -l "$APK" | grep -qF 'assets/data/zh_jieba_top100k.txt'
          unzip -l "$APK" | grep -qF 'assets/www/js/reader/zh-segment-v2.js'
          unzip -l "$APK" | grep -qF 'assets/www/js/reader/zh-lexical-trust.js'

          unzip -p "$APK" assets/www/js/reader-app.js | grep -qF 'an2_zh_segment_cache_v7_weighted'
          unzip -p "$APK" assets/www/js/reader-app.js | grep -qF 'globalThis.readerLookupChineseWord = readerLookupChineseWord;'
          unzip -p "$APK" assets/www/js/reader/zh-segment-v2.js | grep -qF '../data/zh_jieba_top100k.txt'
          unzip -p "$APK" assets/www/js/reader/zh-context-batch.js | grep -qF 'chinesePinyinNeedsContext'
          unzip -p "$APK" assets/www/js/reader/zh-context-batch.js | grep -qF 'classifyChineseGloss'
          unzip -p "$APK" assets/www/js/reader/zh-readable-inline.js | grep -qF "setLane(wrap, word, pinyin, '');"
          unzip -p "$APK" assets/www/js/reader/zh-direct-ru-fallback.js | grep -qF 'CONTEXT_GRACE_MS = 2_200'

          RANK_LINES="$(unzip -p "$APK" assets/data/zh_jieba_top100k.txt | awk 'NF{n++} END{print n+0}')"
          test "$RANK_LINES" -ge 99000
          echo "Embedded Jieba ranks: $RANK_LINES"

          cp "$APK" unique-out/Reader-AI-77.42-toc116-zh-lexical-v2-vc1005.apk
          sha256sum unique-out/Reader-AI-77.42-toc116-zh-lexical-v2-vc1005.apk | tee unique-out/SHA256.txt

      - name: Upload exact APK
        uses: actions/upload-artifact@v4
        with:
          name: Reader-AI-77.42-toc116-zh-lexical-v2-vc1005
          path: |
            unique-out/Reader-AI-77.42-toc116-zh-lexical-v2-vc1005.apk
            unique-out/SHA256.txt
            unique-out/APKSIGNER.txt
            unique-out/BADGING.txt
            unique-out/ZIPALIGN.txt
          if-no-files-found: error
          retention-days: 30
