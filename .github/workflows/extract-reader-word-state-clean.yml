name: Extract reader word state

on:
  push:
    branches: [reader-refactor-clean]
    paths:
      - 'js/reader/word-state.js'
      - '.github/workflows/extract-reader-word-state-clean.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reader-refactor-clean
          fetch-depth: 0
      - name: Extract word state engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('js/app.js')
          source = path.read_text()

          def skip_string(text, index):
              quote = text[index]
              index += 1
              escaped = False
              while index < len(text):
                  char = text[index]
                  if escaped:
                      escaped = False
                  elif char == '\\':
                      escaped = True
                  elif char == quote:
                      return index + 1
                  index += 1
              raise RuntimeError('Unclosed string')

          def find_body(name):
              match = re.search(r'(?:async\s+)?function\s+' + re.escape(name) + r'\s*\(', source)
              if not match:
                  raise RuntimeError('Missing function: ' + name)
              start = match.start()
              index = source.find('(', start)
              depth = 0
              while index < len(source):
                  char = source[index]
                  if char in "'\"`":
                      index = skip_string(source, index)
                      continue
                  if char == '(':
                      depth += 1
                  elif char == ')':
                      depth -= 1
                      if depth == 0:
                          index += 1
                          break
                  index += 1
              while index < len(source) and source[index].isspace():
                  index += 1
              if index >= len(source) or source[index] != '{':
                  raise RuntimeError('Body missing: ' + name)
              depth = 0
              while index < len(source):
                  char = source[index]
                  if char in "'\"`":
                      index = skip_string(source, index)
                      continue
                  if char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth == 0:
                          return start, index + 1
                  index += 1
              raise RuntimeError('Body unclosed: ' + name)

          if "./reader/word-state.js" not in source:
              anchor = "import { renderHome } from './home.js';"
              source = source.replace(anchor, "import { createReaderWordState } from './reader/word-state.js?v=1';\n" + anchor)

          if 'const readerWordState = createReaderWordState(' not in source:
              anchor = 'const readerWordLookup = createReaderWordLookup({'
              setup = """const readerWordState = createReaderWordState({
            getCache: () => readerWordStateCache,
            setCache: (value) => { readerWordStateCache = value; },
            storageKey: readerWordStateStorageKey,
            canonicalLang: readerCanonicalLang,
            currentLang: () => readerCurrentLang(),
            normalizeWord: readerNormalizeWord,
            normalizeImportKey,
            commonWords: READER_COMMON_WORDS,
            seenAfter: READER_SEEN_AFTER,
            fadeAfter: READER_AUTO_FADE_AFTER,
            familiarAfter: READER_FAMILIAR_AFTER,
            getBookLang: readerBookLang,
            tokenizeParagraph: readerTokenizeParagraph,
            findVerbByForm: readerFindVerbByForm,
          });

          """
              source = source.replace(anchor, setup + anchor)

          replacements = {
              'loadReaderWordState': 'function loadReaderWordState() { return readerWordState.load(); }',
              'saveReaderWordState': 'function saveReaderWordState() { return readerWordState.save(); }',
              'readerWordStateKey': 'function readerWordStateKey(word, lang = null) { return readerWordState.key(word, lang); }',
              'readerIsCommonWord': 'function readerIsCommonWord(word, lang = null) { return readerWordState.isCommon(word, lang); }',
              'readerGetWordState': 'function readerGetWordState(word, lang = null) { return readerWordState.get(word, lang); }',
              'readerTouchWordState': 'function readerTouchWordState(word, lang = null) { return readerWordState.touch(word, lang); }',
              'readerTrackParagraphWords': 'function readerTrackParagraphWords(book, ch, paragraphIndex, paragraphText) { return readerWordState.trackParagraph(book, ch, paragraphIndex, paragraphText); }',
              'readerMarkWordClicked': 'function readerMarkWordClicked(word, lang = null) { return readerWordState.markClicked(word, lang); }',
              'readerMarkWordSaved': 'function readerMarkWordSaved(word, lemma = null, lang = null, ru = \'\') { return readerWordState.markSaved(word, lemma, lang, ru); }',
              'readerMarkWordKnown': 'function readerMarkWordKnown(word, lang = null) { return readerWordState.markKnown(word, lang); }',
              'readerWordVisual': 'function readerWordVisual(word, lang = null) { return readerWordState.visual(word, lang); }',
              'readerWordStatusRu': 'function readerWordStatusRu(st) { return readerWordState.statusRu(st); }',
          }
          for name, replacement in replacements.items():
              start, end = find_body(name)
              source = source[:start] + replacement + source[end:]

          path.write_text(source)
          PY
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/reader/word-state.js
      - name: Commit extracted app wiring
        run: |
          if git diff --quiet -- js/app.js; then
            echo "No app wiring changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "refactor: extract reader word state"
          git push origin HEAD:reader-refactor-clean
