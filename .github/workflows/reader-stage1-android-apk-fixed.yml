name: Reader v77.30 formatting and footnotes test APK

on:
  push:
    branches:
      - fix/reader-v7730-footnotes-formatting
    paths:
      - '.github/workflows/reader-stage1-android-apk-fixed.yml'
      - '.github/workflows/reader-stage1-android-apk.yml'
      - '.github/scripts/patch-reader-v7730.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v7730-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated fix branch
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate v77.29 wrapper and apply narrow fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/reader-stage1-android-apk.yml').read_text()
          marker = '      - name: Generate isolated WebView wrapper\n'
          start = source.index(marker) + len(marker)
          run_marker = '        run: |\n'
          start = source.index(run_marker, start) + len(run_marker)
          end = source.index('\n      - name: Build debug APK', start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/generate-stage1-wrapper.sh').write_text(script)
          PY
          bash /tmp/generate-stage1-wrapper.sh

          JAVA_FILE='.stage1-android/app/src/main/java/space/saintjust/reader/stage1/MainActivity.java'
          BUILD_FILE='.stage1-android/app/build.gradle'
          MANIFEST_FILE='.stage1-android/app/src/main/AndroidManifest.xml'
          WWW='.stage1-android/app/src/main/assets/www'

          sed -i 's#https://appassets.androidplatform.net/assets/index.html#https://appassets.androidplatform.net/assets/www/index.html#' "$JAVA_FILE"
          sed -i "s/applicationId 'space.saintjust.reader.stage1'/applicationId 'space.saintjust.reader.semanticstage1clean.formatfix'/" "$BUILD_FILE"
          sed -i 's/versionCode 2/versionCode 8/' "$BUILD_FILE"
          sed -i "s/versionName 'stage1-test'/versionName 'semantic-v77.30-formatfix'/" "$BUILD_FILE"
          sed -i 's/Reader AI Stage 1/Reader AI Test 77.30/' "$MANIFEST_FILE"

          python3 .github/scripts/patch-reader-v7730.py "$WWW"

          node --check "$WWW/js/reader/semantic-import-stage1.js"
          node --check "$WWW/js/reader/semantic-content-footnotes.js"
          node --check "$WWW/js/reader/chapter-render-stage1.js"
          node --check "$WWW/js/reader/semantic-import-bridge.js"
          node --check "$WWW/js/reader/chapter-render-dialogue.js"
          node --check "$WWW/js/reader/chapter-render.js"
          node --check "$WWW/js/reader-app.js"
          node --check "$WWW/js/app.js"

          cat > /tmp/test-v7730-chunks.mjs <<EOF
          import { splitSemanticItemChunksPreservingFootnotes } from 'file://${GITHUB_WORKSPACE}/$WWW/js/reader/semantic-import-stage1.js';
          const before = 'Palabra '.repeat(35);
          const after = ' continuación '.repeat(20);
          const item = {
            type: 'paragraph',
            blockStyle: { textAlign: 'justify', textIndent: '19.8425pt', marginTop: '0pt', marginBottom: '0pt' },
            runs: [
              { text: before, marks: [] },
              { text: '', marks: [], footnote: { label: '7', target: 'Notas.html#n7' } },
              { text: after, marks: ['italic'] },
            ],
          };
          const parts = splitSemanticItemChunksPreservingFootnotes(item, { maxChars: 280, minChars: 120 });
          const refs = parts.flatMap(part => part.runs || []).filter(run => run.footnote?.target);
          if (parts.length < 2) throw new Error('paragraph was not chunked');
          if (refs.length !== 1 || refs[0].footnote.target !== 'Notas.html#n7') throw new Error('footnote was lost');
          if (!parts.every((part, index) => part.semanticChunkIndex === index && part.semanticChunkCount === parts.length)) throw new Error('chunk metadata mismatch');
          if (!parts.every(part => part.blockStyle?.textAlign === 'justify')) throw new Error('paragraph style was lost');
          console.log(JSON.stringify({ ok: true, chunks: parts.length, footnotes: refs.length }));
          EOF
          node --experimental-default-type=module /tmp/test-v7730-chunks.mjs

          grep -F 'assets/www/index.html' "$JAVA_FILE"
          grep -F "applicationId 'space.saintjust.reader.semanticstage1clean.formatfix'" "$BUILD_FILE"
          grep -F 'versionCode 8' "$BUILD_FILE"
          grep -F "versionName 'semantic-v77.30-formatfix'" "$BUILD_FILE"
          grep -F 'v77.30-footnotes-formatting-test' "$WWW/index.html"
          grep -F 'splitSemanticItemChunksPreservingFootnotes' "$WWW/js/reader/semantic-import-stage1.js"
          grep -F 'reader-semantic-layout' "$WWW/js/reader/chapter-render-stage1.js"

      - name: Build isolated test APK
        working-directory: .stage1-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp .stage1-android/app/build/outputs/apk/debug/app-debug.apk dist/Reader-AI-v77.30-Formatting-Footnotes-Test.apk
          sha256sum dist/Reader-AI-v77.30-Formatting-Footnotes-Test.apk | tee dist/Reader-AI-v77.30-Formatting-Footnotes-Test.apk.sha256

      - name: Upload isolated test APK
        uses: actions/upload-artifact@v4
        with:
          name: Reader-AI-v77.30-Formatting-Footnotes-Test-APK
          path: |
            dist/Reader-AI-v77.30-Formatting-Footnotes-Test.apk
            dist/Reader-AI-v77.30-Formatting-Footnotes-Test.apk.sha256
          if-no-files-found: error
          retention-days: 14
