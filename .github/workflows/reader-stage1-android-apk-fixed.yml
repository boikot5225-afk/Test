name: Reader semantic EPUB Android APK

on:
  push:
    branches:
      - test/reader-epub-format-stage1
      - fix/reader-v77.32-startup
    paths:
      - '.github/workflows/reader-stage1-android-apk-fixed.yml'
      - '.github/workflows/reader-stage1-android-apk.yml'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - 'data/**'
      - 'manifest.json'
      - 'sw.js'
  pull_request:
    branches:
      - claude/epic-hawking-540kte
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk-fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate clean semantic EPUB wrapper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/reader-stage1-android-apk.yml').read_text()
          marker = '      - name: Generate isolated WebView wrapper\n'
          start = source.index(marker) + len(marker)
          run_marker = '        run: |\n'
          start = source.index(run_marker, start) + len(run_marker)
          end = source.index('\n      - name: Build debug APK', start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/generate-stage1-wrapper.sh').write_text(script)
          PY
          bash /tmp/generate-stage1-wrapper.sh

          JAVA_FILE='.stage1-android/app/src/main/java/space/saintjust/reader/stage1/MainActivity.java'
          BUILD_FILE='.stage1-android/app/build.gradle'
          MANIFEST_FILE='.stage1-android/app/src/main/AndroidManifest.xml'

          sed -i 's#https://appassets.androidplatform.net/assets/index.html#https://appassets.androidplatform.net/assets/www/index.html#' "$JAVA_FILE"
          sed -i "s/applicationId 'space.saintjust.reader.stage1'/applicationId 'space.saintjust.reader.semanticstage1clean'/" "$BUILD_FILE"
          sed -i 's/versionCode 2/versionCode 10/' "$BUILD_FILE"
          sed -i "s/versionName 'stage1-test'/versionName 'semantic-v77.32'/" "$BUILD_FILE"
          sed -i 's/Reader AI Stage 1/Reader AI EPUB Clean/' "$MANIFEST_FILE"

          grep -F 'assets/www/index.html' "$JAVA_FILE"
          grep -F "applicationId 'space.saintjust.reader.semanticstage1clean'" "$BUILD_FILE"
          grep -F 'versionCode 10' "$BUILD_FILE"
          grep -F "versionName 'semantic-v77.32'" "$BUILD_FILE"
          grep -F 'v77.32-startup-repair' '.stage1-android/app/src/main/assets/www/index.html'
          test -f '.stage1-android/app/src/main/assets/www/index.html'
          test -f '.stage1-android/app/src/main/assets/www/js/reader/semantic-import-bridge.js'
          test -f '.stage1-android/app/src/main/assets/www/js/reader/semantic-import-stage1.js'
          test -f '.stage1-android/app/src/main/assets/www/js/reader/chapter-render-stage1.js'
          test -f '.stage1-android/app/src/main/assets/www/js/reader/word-source-filters.js'
          ! grep -q 'semantic-stage1-proof' '.stage1-android/app/src/main/assets/www/js/reader/chapter-render.js'
          node --check '.stage1-android/app/src/main/assets/www/js/reader-app.js'
          ! grep -q '^Warning: truncated output' '.stage1-android/app/src/main/assets/www/js/reader-app.js'
          test "$(wc -l < '.stage1-android/app/src/main/assets/www/js/reader-app.js')" -gt 5000

      - name: Build clean semantic EPUB APK
        working-directory: .stage1-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Build broken v77.31 update baseline
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_SOURCE="$(mktemp -d /tmp/reader-v7731-source-XXXXXX)"
          git archive e749644089dba484ae76a4503445bb4d928ae2e0 | tar -x -C "$BASELINE_SOURCE"

          pushd "$BASELINE_SOURCE"
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/reader-stage1-android-apk.yml').read_text()
          marker = '      - name: Generate isolated WebView wrapper\n'
          start = source.index(marker) + len(marker)
          run_marker = '        run: |\n'
          start = source.index(run_marker, start) + len(run_marker)
          end = source.index('\n      - name: Build debug APK', start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/generate-v7731-wrapper.sh').write_text(script)
          PY
          bash /tmp/generate-v7731-wrapper.sh

          JAVA_FILE='.stage1-android/app/src/main/java/space/saintjust/reader/stage1/MainActivity.java'
          BUILD_FILE='.stage1-android/app/build.gradle'
          MANIFEST_FILE='.stage1-android/app/src/main/AndroidManifest.xml'

          sed -i 's#https://appassets.androidplatform.net/assets/index.html#https://appassets.androidplatform.net/assets/www/index.html#' "$JAVA_FILE"
          sed -i "s/applicationId 'space.saintjust.reader.stage1'/applicationId 'space.saintjust.reader.semanticstage1clean'/" "$BUILD_FILE"
          sed -i 's/versionCode 2/versionCode 9/' "$BUILD_FILE"
          sed -i "s/versionName 'stage1-test'/versionName 'semantic-v77.31'/" "$BUILD_FILE"
          sed -i 's/Reader AI Stage 1/Reader AI EPUB Clean/' "$MANIFEST_FILE"

          grep -F 'versionCode 9' "$BUILD_FILE"
          grep -F "versionName 'semantic-v77.31'" "$BUILD_FILE"
          grep -F 'v77.31-translation-cleanup' '.stage1-android/app/src/main/assets/www/index.html'
          grep -q '^Warning: truncated output' '.stage1-android/app/src/main/assets/www/js/reader-app.js'

          gradle --no-daemon -p .stage1-android :app:assembleDebug
          popd

          mkdir -p dist
          cp "$BASELINE_SOURCE/.stage1-android/app/build/outputs/apk/debug/app-debug.apk" \
            dist/Reader-AI-v77.31-Broken-Baseline.apk

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp .stage1-android/app/build/outputs/apk/debug/app-debug.apk dist/Reader-AI-EPUB-Stage1-Clean.apk
          sha256sum dist/Reader-AI-EPUB-Stage1-Clean.apk | tee dist/Reader-AI-EPUB-Stage1-Clean.apk.sha256

      - name: Verify v77.31 to v77.32 update on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/verify-reader-android-update.sh

      - name: Upload Android update diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reader-AI-v77.32-Android-Update-Diagnostics
          path: |
            dist/android-update-logcat.txt
            dist/android-update-ui.xml
            dist/android-update-screen.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload clean semantic EPUB APK
        uses: actions/upload-artifact@v4
        with:
          name: Reader-AI-EPUB-Stage1-Clean-APK
          path: |
            dist/Reader-AI-EPUB-Stage1-Clean.apk
            dist/Reader-AI-EPUB-Stage1-Clean.apk.sha256
          if-no-files-found: error
          retention-days: 14
