name: Reader module singleton regression

on:
  push:
    branches:
      - feature/77.42-epub-toc
    paths:
      - '.github/workflows/reader-module-singleton-regression.yml'
      - 'scripts/check-reader-module-singleton.mjs'
      - 'js/app.js'
      - 'js/dict-render.js'
      - 'js/reader-app.js'
      - 'js/reader/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  singleton:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify one Reader module URL
        run: node scripts/check-reader-module-singleton.mjs
