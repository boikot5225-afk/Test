name: Reader stage 1 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - test/reader-epub-format-stage1
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - 'data/**'
      - 'manifest.json'
      - 'sw.js'
      - '.github/workflows/reader-stage1-android-apk.yml'
  pull_request:
    branches:
      - claude/epic-hawking-540kte

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate isolated WebView wrapper
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          APP="$ROOT/.stage1-android"
          WWW="$APP/app/src/main/assets/www"

          mkdir -p "$APP/app/src/main/java/space/saintjust/reader/stage1" "$WWW"

          cat > "$APP/settings.gradle" <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = 'ReaderStage1'
          include ':app'
          EOF

          cat > "$APP/build.gradle" <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > "$APP/app/build.gradle" <<'EOF'
          plugins {
            id 'com.android.application'
          }

          android {
            namespace 'space.saintjust.reader.stage1'
            compileSdk 35

            defaultConfig {
              applicationId 'space.saintjust.reader.stage1'
              minSdk 24
              targetSdk 35
              versionCode 2
              versionName 'stage1-test'
            }

            buildTypes {
              debug {
                debuggable true
                applicationIdSuffix '.debug'
                versionNameSuffix '-debug'
              }
            }

            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }

          dependencies {
            implementation 'androidx.webkit:webkit:1.12.1'
            implementation 'androidx.annotation:annotation:1.9.1'
          }
          EOF

          cat > "$APP/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
              android:allowBackup="false"
              android:label="Reader AI Stage 1"
              android:theme="@style/AppTheme"
              android:usesCleartextTraffic="true">
              <activity
                android:name=".MainActivity"
                android:configChanges="keyboard|keyboardHidden|orientation|screenLayout|screenSize|smallestScreenSize|uiMode"
                android:launchMode="singleTask"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
                <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="content" />
                  <data android:scheme="file" />
                  <data android:mimeType="application/epub+zip" />
                  <data android:mimeType="application/x-fictionbook+xml" />
                  <data android:mimeType="application/x-fictionbook" />
                  <data android:mimeType="text/plain" />
                </intent-filter>
                <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="content" />
                  <data android:scheme="file" />
                  <data android:mimeType="*/*" />
                  <data android:pathPattern=".*\\.epub" />
                  <data android:pathPattern=".*\\.EPUB" />
                  <data android:pathPattern=".*\\.fb2" />
                  <data android:pathPattern=".*\\.FB2" />
                  <data android:pathPattern=".*\\.txt" />
                  <data android:pathPattern=".*\\.TXT" />
                </intent-filter>
                <intent-filter>
                  <action android:name="android.intent.action.SEND" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="application/epub+zip" />
                  <data android:mimeType="application/x-fictionbook+xml" />
                  <data android:mimeType="application/x-fictionbook" />
                  <data android:mimeType="text/plain" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          mkdir -p "$APP/app/src/main/res/values"
          cat > "$APP/app/src/main/res/values/styles.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:windowActionModeOverlay">true</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:statusBarColor">#111111</item>
              <item name="android:navigationBarColor">#111111</item>
            </style>
          </resources>
          EOF

          cat > "$APP/app/src/main/java/space/saintjust/reader/stage1/MainActivity.java" <<'EOF'
          package space.saintjust.reader.stage1;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.graphics.Color;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.OpenableColumns;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.MimeTypeMap;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.annotation.Nullable;
          import androidx.webkit.WebViewAssetLoader;

          import org.json.JSONObject;

          import java.io.InputStream;
          import java.util.Locale;

          public class MainActivity extends Activity {
            private static final int FILE_CHOOSER_REQUEST = 2201;
            private static final String APP_URL = "https://appassets.androidplatform.net/assets/index.html";
            private WebView webView;
            private ValueCallback<Uri[]> fileCallback;
            private Uri pendingImportUri;
            private String pendingImportName = "";
            private String pendingImportMime = "";
            private long pendingImportToken = 0L;
            private boolean pageReady = false;

            @Override
            protected void onCreate(@Nullable Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);

              webView = new WebView(this);
              webView.setBackgroundColor(Color.rgb(17, 17, 17));
              setContentView(webView, new ViewGroup.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                ViewGroup.LayoutParams.MATCH_PARENT
              ));

              WebSettings settings = webView.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setDatabaseEnabled(true);
              settings.setAllowContentAccess(true);
              settings.setAllowFileAccess(false);
              settings.setMediaPlaybackRequiresUserGesture(false);
              settings.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
              settings.setBuiltInZoomControls(false);
              settings.setDisplayZoomControls(false);

              CookieManager cookies = CookieManager.getInstance();
              cookies.setAcceptCookie(true);
              cookies.setAcceptThirdPartyCookies(webView, true);

              WebView.setWebContentsDebuggingEnabled(true);

              WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                .build();

              webView.setWebViewClient(new WebViewClient() {
                @Override
                public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                  Uri requestUri = request.getUrl();
                  if ("appassets.androidplatform.net".equals(requestUri.getHost())
                    && "/android-import/current".equals(requestUri.getPath())) {
                    return openPendingImportResponse();
                  }
                  return assetLoader.shouldInterceptRequest(request.getUrl());
                }

                @Override
                public void onPageFinished(WebView view, String url) {
                  super.onPageFinished(view, url);
                  if (url != null && url.startsWith("https://appassets.androidplatform.net/")) {
                    pageReady = true;
                    dispatchPendingImport();
                  }
                }
              });

              webView.setWebChromeClient(new WebChromeClient() {
                @Override
                public boolean onShowFileChooser(
                  WebView view,
                  ValueCallback<Uri[]> callback,
                  FileChooserParams params
                ) {
                  if (fileCallback != null) fileCallback.onReceiveValue(null);
                  fileCallback = callback;

                  Intent intent;
                  try {
                    intent = params.createIntent();
                  } catch (Exception error) {
                    intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                    intent.addCategory(Intent.CATEGORY_OPENABLE);
                    intent.setType("*/*");
                  }

                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  try {
                    startActivityForResult(intent, FILE_CHOOSER_REQUEST);
                    return true;
                  } catch (ActivityNotFoundException error) {
                    fileCallback = null;
                    Toast.makeText(MainActivity.this, "Не найден системный выбор файлов", Toast.LENGTH_LONG).show();
                    return false;
                  }
                }
              });

              captureExternalIntent(getIntent());
              if (savedInstanceState == null) {
                webView.loadUrl(APP_URL);
              } else {
                webView.restoreState(savedInstanceState);
              }
            }

            private void captureExternalIntent(@Nullable Intent intent) {
              if (intent == null) return;
              Uri uri = null;
              String action = intent.getAction();
              if (Intent.ACTION_VIEW.equals(action)) {
                uri = intent.getData();
              } else if (Intent.ACTION_SEND.equals(action)) {
                if (android.os.Build.VERSION.SDK_INT >= 33) {
                  uri = intent.getParcelableExtra(Intent.EXTRA_STREAM, Uri.class);
                } else {
                  //noinspection deprecation
                  uri = intent.getParcelableExtra(Intent.EXTRA_STREAM);
                }
              }
              if (uri == null) return;

              pendingImportUri = uri;
              pendingImportName = displayName(uri);
              pendingImportMime = getContentResolver().getType(uri);
              if (pendingImportMime == null || pendingImportMime.isEmpty()) {
                pendingImportMime = mimeFromName(pendingImportName);
              }
              pendingImportToken = System.nanoTime();
              dispatchPendingImport();
            }

            private String displayName(Uri uri) {
              if ("content".equalsIgnoreCase(uri.getScheme())) {
                try (Cursor cursor = getContentResolver().query(
                  uri,
                  new String[]{OpenableColumns.DISPLAY_NAME},
                  null,
                  null,
                  null
                )) {
                  if (cursor != null && cursor.moveToFirst()) {
                    int index = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                    if (index >= 0) {
                      String value = cursor.getString(index);
                      if (value != null && !value.trim().isEmpty()) return value;
                    }
                  }
                } catch (Exception ignored) {}
              }
              String segment = uri.getLastPathSegment();
              return segment == null || segment.trim().isEmpty() ? "book" : segment;
            }

            private String mimeFromName(String name) {
              String clean = name == null ? "" : name.toLowerCase(Locale.ROOT);
              if (clean.endsWith(".epub")) return "application/epub+zip";
              if (clean.endsWith(".fb2")) return "application/x-fictionbook+xml";
              String extension = MimeTypeMap.getFileExtensionFromUrl(clean);
              String detected = MimeTypeMap.getSingleton().getMimeTypeFromExtension(extension);
              return detected == null ? "application/octet-stream" : detected;
            }

            @Nullable
            private WebResourceResponse openPendingImportResponse() {
              Uri uri = pendingImportUri;
              if (uri == null) {
                return new WebResourceResponse(
                  "text/plain",
                  "utf-8",
                  404,
                  "Not Found",
                  java.util.Collections.emptyMap(),
                  new java.io.ByteArrayInputStream(new byte[0])
                );
              }
              try {
                InputStream stream = getContentResolver().openInputStream(uri);
                if (stream == null) throw new IllegalStateException("empty stream");
                return new WebResourceResponse(
                  pendingImportMime == null ? "application/octet-stream" : pendingImportMime,
                  null,
                  stream
                );
              } catch (Exception error) {
                return new WebResourceResponse(
                  "text/plain",
                  "utf-8",
                  500,
                  "Read failed",
                  java.util.Collections.emptyMap(),
                  new java.io.ByteArrayInputStream(
                    String.valueOf(error.getMessage()).getBytes(java.nio.charset.StandardCharsets.UTF_8)
                  )
                );
              }
            }

            private void dispatchPendingImport() {
              if (!pageReady || webView == null || pendingImportUri == null) return;
              try {
                JSONObject payload = new JSONObject();
                payload.put("name", pendingImportName);
                payload.put("mime", pendingImportMime);
                payload.put("url", "https://appassets.androidplatform.net/android-import/current?t=" + pendingImportToken);
                String json = payload.toString();
                String script = "(function retryReaderImport(n){"
                  + "if(typeof window.readerImportAndroidFile==='function'){window.readerImportAndroidFile(" + json + ");return;}"
                  + "if(n<300)setTimeout(function(){retryReaderImport(n+1)},100);"
                  + "})(0);";
                webView.evaluateJavascript(script, null);
              } catch (Exception error) {
                Toast.makeText(this, "Не удалось передать книгу в Reader AI", Toast.LENGTH_LONG).show();
              }
            }

            @Override
            protected void onNewIntent(Intent intent) {
              super.onNewIntent(intent);
              setIntent(intent);
              captureExternalIntent(intent);
            }

            @Override
            protected void onActivityResult(int requestCode, int resultCode, @Nullable Intent data) {
              super.onActivityResult(requestCode, resultCode, data);
              if (requestCode != FILE_CHOOSER_REQUEST || fileCallback == null) return;
              Uri[] result = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
              fileCallback.onReceiveValue(result);
              fileCallback = null;
            }

            @Override
            protected void onSaveInstanceState(Bundle outState) {
              webView.saveState(outState);
              super.onSaveInstanceState(outState);
            }

            @Override
            public void onBackPressed() {
              if (webView != null && webView.canGoBack()) webView.goBack();
              else super.onBackPressed();
            }

            @Override
            protected void onDestroy() {
              if (webView != null) {
                webView.loadUrl("about:blank");
                webView.stopLoading();
                webView.destroy();
              }
              super.onDestroy();
            }
          }
          EOF

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.stage1-android' \
            --exclude='functions' \
            --exclude='supabase' \
            --exclude='firebase' \
            --exclude='tests' \
            --exclude='node_modules' \
            "$ROOT/" "$WWW/"

          test -f "$WWW/index.html"
          test -f "$WWW/js/reader/chapter-render-stage1.js"
          test -f "$WWW/js/reader/semantic-import-stage1.js"

      - name: Build debug APK
        working-directory: .stage1-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp .stage1-android/app/build/outputs/apk/debug/app-debug.apk dist/Reader-AI-Stage1-Test.apk
          sha256sum dist/Reader-AI-Stage1-Test.apk | tee dist/Reader-AI-Stage1-Test.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reader-AI-Stage1-Test-APK
          path: |
            dist/Reader-AI-Stage1-Test.apk
            dist/Reader-AI-Stage1-Test.apk.sha256
          if-no-files-found: error
          retention-days: 14
