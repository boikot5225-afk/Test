name: Android APK toc129 import supersede fix

on:
  push:
    branches:
      - feature/77.42-toc126-storage-import-v2
    paths:
      - '.github/workflows/android-apk-toc126-storage-import-v2.yml'
      - 'scripts/patch_toc126_guest_cold_start.py'
      - 'scripts/validate_toc126_storage_import_v2.sh'
      - 'scripts/make_toc126_storage_audit_epub.py'
      - 'scripts/prepare_toc126_legacy_storage.py'
      - 'scripts/audit_toc126_storage_import_live.py'
      - 'scripts/audit_toc126_storage_restart.py'
      - 'scripts/audit_toc126_storage_delete.py'
      - 'scripts/audit_toc127_manual_import_ui.py'
      - 'scripts/audit_toc128_audio_epub_reuse.py'
      - 'scripts/run_toc126_storage_emulator.sh'
      - 'scripts/audit_toc125_frozen_swipe.py'
      - 'scripts/configure_toc123_a54_abi.py'
      - 'js/app.js'
      - 'js/reader/library-idb-store.js'
      - 'js/reader/library-store.js'
      - 'js/reader/semantic-import-bridge.js'
      - 'js/reader/semantic-import-stage1.js'
      - 'js/reader/epub.js'
      - 'js/reader/android-external-import.js'
      - 'js/reader/handler-bridge.js'
      - 'js/reader/audio-epub-import-isolation.js'
      - 'android/app/build.gradle'
  workflow_dispatch:

jobs:
  storage-import-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/77.42-toc126-storage-import-v2
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore established Reader AI signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64}"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/reader-ai.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/reader-ai.jks" >> "$GITHUB_ENV"

      - name: Materialize offline guest cold-start fix
        shell: bash
        run: python3 scripts/patch_toc126_guest_cold_start.py

      - name: Validate frozen Reader and storage/import architecture
        shell: bash
        run: bash scripts/validate_toc126_storage_import_v2.sh

      - name: Build universal APK directly from validated source
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify toc129 payload inside universal APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -qF 'assets/www/js/app.js'
          unzip -l "$APK" | grep -qF 'assets/www/js/reader/library-idb-store.js'
          unzip -l "$APK" | grep -qF 'assets/www/js/reader/semantic-import-stage1.js'
          unzip -l "$APK" | grep -qF 'assets/www/js/reader/semantic-import-bridge.js'
          unzip -l "$APK" | grep -qF 'assets/www/js/reader/android-external-import.js'
          unzip -l "$APK" | grep -qF 'assets/www/js/reader/handler-bridge.js'
          unzip -l "$APK" | grep -qF 'assets/www/js/reader/audio-epub-import-isolation.js'
          unzip -p "$APK" assets/www/js/app.js | grep -qF 'guest startup is local-first'
          unzip -p "$APK" assets/www/js/reader/handler-bridge.js | grep -qF "audio-epub-import-isolation.js?v=1"
          unzip -p "$APK" assets/www/js/reader/audio-epub-import-isolation.js | grep -qF '__readerAudioEpubIsolationV3'
          unzip -p "$APK" assets/www/js/reader/semantic-import-bridge.js | grep -qF '__readerSemanticImportStats'
          unzip -p "$APK" assets/www/js/reader/semantic-import-bridge.js | grep -qF 'semanticImportStats.superseded += 1'
          if unzip -l "$APK" | grep -q 'assets/www/build/'; then
            echo 'transient repo build cache leaked into APK' >&2
            exit 1
          fi

      - name: Prepare realistic EPUB and audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/make_toc126_storage_audit_epub.py
          test "$(stat -c %s runtime-audit/toc126-storage-audit.epub)" -gt 4000000
          python3 -m pip install --quiet websocket-client requests

      - name: Enable emulator hardware acceleration
        shell: bash
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Real ACTION_VIEW, swipe, manual and latest-EPUB-wins import on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash scripts/run_toc126_storage_emulator.sh

      - name: Upload toc129 live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toc129-import-live-evidence
          path: runtime-audit/
          if-no-files-found: warn
          retention-days: 90

      - name: Configure final Galaxy A54 ABI only
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/configure_toc123_a54_abi.py
          rm -rf android/app/build

      - name: Build final Galaxy A54 APK directly
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Sign and validate vc1022 A54 APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p unique-out
          OUT=unique-out/Reader-AI-77.42-toc129-import-supersede-a54-vc1022.apk
          KSPASS="${ANDROID_KEYSTORE_PASSWORD:-readerai2026}"
          KEYPASS="${ANDROID_KEY_PASSWORD:-$KSPASS}"
          ALIAS="${ANDROID_KEY_ALIAS:-reader-ai}"
          "${BUILD_TOOLS}/apksigner" sign \
            --ks "${ANDROID_KEYSTORE_PATH}" \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KSPASS" \
            --key-pass "pass:$KEYPASS" \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT" "$APK"
          "${BUILD_TOOLS}/apksigner" verify --verbose --print-certs "$OUT" | tee unique-out/APKSIGNER.txt
          "${BUILD_TOOLS}/aapt" dump badging "$OUT" | tee unique-out/BADGING.txt
          "${BUILD_TOOLS}/zipalign" -c -P 16 -v 4 "$OUT" > unique-out/ZIPALIGN.txt
          unzip -t "$OUT" >/dev/null
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" unique-out/APKSIGNER.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" unique-out/APKSIGNER.txt
          grep -q "certificate SHA-256 digest: 9d853f2c43529b55a2d63202b7377c7485bae700b6e4113ca71ceae930664790" unique-out/APKSIGNER.txt
          grep -q "versionCode='1022'" unique-out/BADGING.txt
          grep -q "versionName='77.42-toc129-import-supersede-debug'" unique-out/BADGING.txt
          grep -q "native-code: 'arm64-v8a'" unique-out/BADGING.txt
          if unzip -l "$OUT" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo 'non-A54 ABI leaked into final package' >&2
            exit 1
          fi
          if unzip -l "$OUT" | grep -q 'assets/www/build/'; then
            echo 'transient repo build cache leaked into final APK' >&2
            exit 1
          fi
          sha256sum "$OUT" | tee unique-out/SHA256.txt
          stat -c '%n %s bytes' "$OUT" | tee unique-out/SIZE.txt

      - name: Upload verified toc129 A54 APK
        uses: actions/upload-artifact@v4
        with:
          name: Reader-AI-77.42-toc129-import-supersede-a54-vc1022
          path: unique-out/
          if-no-files-found: error
          retention-days: 30
