name: toc123 vendor isolated French layer

on:
  push:
    branches:
      - feature/77.42-toc123-fr-isolated
    paths:
      - .github/workflows/toc123-vendor-fr-isolated.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/77.42-toc123-fr-isolated
          fetch-depth: 0

      - name: Import only additive French files
        shell: bash
        run: |
          set -euo pipefail
          SRC=origin/feature/77.42-toc122-fr-reader-architecture
          git fetch origin feature/77.42-toc122-fr-reader-architecture

          mkdir -p js/reader scripts
          for path in \
            js/reader/fr-vocab-estimate.js \
            js/reader/fr-unknown-gloss.js \
            scripts/build_fr_reader_resources.py
          do
            git show "${SRC}:${path}" > "$path"
          done

          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/reader/interactions-runtime.js')
          s = p.read_text(encoding='utf-8')
          anchor = "import './en-context-fixes-v1.js?v=2'; // toc105: DeepSeek context has final priority; text-only\n"
          block = (
              "import './fr-vocab-estimate.js?v=123-isolated'; // toc123: isolated French Known/Unknown + lemma\n"
              "import './fr-unknown-gloss.js?v=123-isolated'; // toc123: isolated bundled FR->RU glosses\n"
          )
          if block not in s:
              if anchor not in s:
                  raise SystemExit('English runtime anchor missing')
              s = s.replace(anchor, anchor + block, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Prove Reader core stayed byte-identical to toc119
        shell: bash
        run: |
          set -euo pipefail
          BASE=fa305f555ce16bcb1a790b1f0cb55b5bc1c2f840
          git diff --exit-code "$BASE" -- \
            js/reader/interactions.js \
            js/reader/pages-mode.js \
            js/reader/chapter-render.js \
            js/reader/chapter-render-next.js \
            js/reader/chapter-render-stage1.js \
            js/reader-app.js \
            js/reader/toc-upgrade.js \
            js/reader/display.js

      - name: Syntax gate
        shell: bash
        run: |
          set -euo pipefail
          node --check js/reader/fr-vocab-estimate.js
          node --check js/reader/fr-unknown-gloss.js
          node --check js/reader/interactions-runtime.js
          python3 -m py_compile scripts/build_fr_reader_resources.py

      - name: Commit vendored isolated source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git config user.name 'Reader AI CI'
          git config user.email 'reader-ai-ci@users.noreply.github.com'
          git add js/reader/fr-vocab-estimate.js js/reader/fr-unknown-gloss.js scripts/build_fr_reader_resources.py js/reader/interactions-runtime.js
          git commit -m 'feat(reader): vendor isolated French lexical layer [skip ci]'
          git push origin HEAD:feature/77.42-toc123-fr-isolated
