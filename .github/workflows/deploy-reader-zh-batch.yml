name: Deploy readerZhBatch

on:
  push:
    branches:
      - feature/77.42-toc97-context-batch
    paths:
      - 'functions/zh-batch-index.js'
      - 'functions/deepseek-model.js'
      - '.github/workflows/deploy-reader-zh-batch.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-reader-zh-batch-french-da79a
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS }}
      GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install and verify isolated batch source
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix functions ci --ignore-scripts
          node --check functions/zh-batch-index.js
          grep -qF "exports.readerZhBatch = onCall(" functions/zh-batch-index.js
          grep -qF "thinking: { type: 'disabled' }" functions/zh-batch-index.js
          grep -qF "response_format: { type: 'json_object' }" functions/zh-batch-index.js
          grep -qF "boundary" functions/zh-batch-index.js
          grep -qF "pinyin" functions/zh-batch-index.js
          grep -qF "ru" functions/zh-batch-index.js

      - name: Prepare isolated Firebase source
        shell: bash
        run: |
          set -euo pipefail
          cp functions/zh-batch-index.js functions/index.js
          node --check functions/index.js
          if grep -q "OPENROUTER_API_KEY" functions/index.js; then
            echo "readerZhBatch source must not pull TTS secrets" >&2
            exit 1
          fi
          grep -qF "defineSecret('DEEPSEEK_API_KEY')" functions/index.js
          grep -qF "exports.readerZhBatch = onCall(" functions/index.js

      - name: Select deployment credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${FIREBASE_TOKEN}" ]]; then
            echo "FIREBASE_AUTH_MODE=token" >> "${GITHUB_ENV}"
            exit 0
          fi
          credentials="${FIREBASE_SERVICE_ACCOUNT_JSON}"
          [[ -n "${credentials}" ]] || credentials="${GOOGLE_CREDENTIALS_JSON}"
          [[ -n "${credentials}" ]] || credentials="${GCP_SA_KEY_JSON}"
          if [[ -z "${credentials}" ]]; then
            echo "::error::No Firebase deployment credential is configured."
            exit 1
          fi
          credentials_file="${RUNNER_TEMP}/firebase-service-account.json"
          printf '%s' "${credentials}" > "${credentials_file}"
          chmod 600 "${credentials_file}"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${credentials_file}" >> "${GITHUB_ENV}"
          echo "FIREBASE_AUTH_MODE=adc" >> "${GITHUB_ENV}"

      - name: Install Firebase CLI
        shell: bash
        run: |
          set -euo pipefail
          cli_root="${RUNNER_TEMP}/firebase-cli"
          npm --prefix "${cli_root}" install --no-save --ignore-scripts firebase-tools@15.24.0
          node "${cli_root}/node_modules/firebase-tools/lib/bin/firebase.js" --version

      - name: Deploy readerZhBatch only
        shell: bash
        run: |
          set -euo pipefail
          firebase_cli="${RUNNER_TEMP}/firebase-cli/node_modules/firebase-tools/lib/bin/firebase.js"
          args=(deploy --only functions:readerZhBatch --project french-da79a --non-interactive)
          if [[ "${FIREBASE_AUTH_MODE}" == "token" ]]; then
            node "${firebase_cli}" "${args[@]}" --token "${FIREBASE_TOKEN}"
          else
            node "${firebase_cli}" "${args[@]}"
          fi
