name: Smart Book pinyin split toolchain

on:
  push:
    branches:
      - feature/smartbook-chinese-pinyin
    paths:
      - data/zh_dict_core.json
      - tools/smartbook-chinese-pinyin/**
      - .github/workflows/smartbook-pinyin-toolchain.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartbook-pinyin-toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build offline pinyin dictionary
        run: |
          python3 tools/smartbook-chinese-pinyin/tools/build_lexicon.py \
            data/zh_dict_core.json \
            tools/smartbook-chinese-pinyin/xposed-module/src/main/assets/zh_pinyin.tsv.gz

      - name: Build signed pinyin module
        run: gradle -p tools/smartbook-chinese-pinyin/xposed-module assembleDebug --no-daemon

      - name: Download NPatch and BKS provider
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/toolchain build/npatch-launcher
          curl --fail --location --retry 4 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/7723mod/NPatch/releases/latest' \
            --output build/npatch-release.json
          JAR_URL="$(jq -r '.assets[] | select(.name | test("^jar-v.*-release\\.jar$")) | .browser_download_url' build/npatch-release.json | head -n1)"
          JAR_NAME="$(jq -r '.assets[] | select(.name | test("^jar-v.*-release\\.jar$")) | .name' build/npatch-release.json | head -n1)"
          JAR_DIGEST="$(jq -r '.assets[] | select(.name | test("^jar-v.*-release\\.jar$")) | (.digest // "")' build/npatch-release.json | head -n1)"
          test -n "$JAR_URL"
          curl --fail --location --retry 4 "$JAR_URL" --output build/toolchain/npatch.jar
          if [[ "$JAR_DIGEST" == sha256:* ]]; then
            echo "${JAR_DIGEST#sha256:}  build/toolchain/npatch.jar" | sha256sum --check --strict
          fi
          printf '%s\n' "$JAR_NAME" > build/toolchain/npatch-version.txt

          BC_VERSION='1.84'
          BC_BASE="https://repo.maven.apache.org/maven2/org/bouncycastle/bcprov-jdk18on/$BC_VERSION"
          curl --fail --location --retry 4 \
            "$BC_BASE/bcprov-jdk18on-$BC_VERSION.jar" \
            --output build/toolchain/bcprov.jar
          curl --fail --location --retry 4 \
            "$BC_BASE/bcprov-jdk18on-$BC_VERSION.jar.sha256" \
            --output build/bcprov.jar.sha256
          echo "$(tr -d '\r\n ' < build/bcprov.jar.sha256)  build/toolchain/bcprov.jar" \
            | sha256sum --check --strict

          javac \
            -cp 'build/toolchain/npatch.jar:build/toolchain/bcprov.jar' \
            -d build/npatch-launcher \
            tools/smartbook-chinese-pinyin/tools/NPatchLauncher.java
          cp -R build/npatch-launcher build/toolchain/launcher

          MODULE="$(find tools/smartbook-chinese-pinyin/xposed-module/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$MODULE"
          cp "$MODULE" build/toolchain/SmartBook-Pinyin-Module.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/toolchain/SmartBook-Pinyin-Module.apk
          sha256sum build/toolchain/* > build/toolchain/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SmartBook-Pinyin-Split-Toolchain
          path: build/toolchain
          if-no-files-found: error
          retention-days: 7
