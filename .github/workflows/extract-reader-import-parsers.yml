name: Wire reader import parsers

on:
  push:
    branches: [reader-refactor-clean]
    paths:
      - 'js/reader/import-parsers.js'
      - '.github/workflows/extract-reader-import-parsers.yml'

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reader-refactor-clean
          fetch-depth: 0
      - name: Replace parser block with module wrappers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          source = path.read_text()

          import_anchor = "import { renderHome } from './home.js';"
          import_line = "import { splitTextToChapters as readerImportSplitTextToChapters, splitSongToChapters as readerImportSplitSongToChapters } from './reader/import-parsers.js?v=1';\n"
          if "./reader/import-parsers.js" not in source:
              if import_anchor not in source:
                  raise RuntimeError('Import anchor missing')
              source = source.replace(import_anchor, import_line + import_anchor)

          start_marker = 'function readerSplitTextToChapters('
          end_marker = 'function readerBookProgress('
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise RuntimeError('Import parser block markers not found')

          wrappers = (
              "function readerSplitTextToChapters(rawText, fallbackTitle = 'Текст') {\n"
              "  return readerImportSplitTextToChapters(rawText, fallbackTitle, readerChunkLongParagraph);\n"
              "}\n\n"
              "function readerSplitSongToChapters(rawText, fallbackTitle = 'Песня') {\n"
              "  return readerImportSplitSongToChapters(rawText, fallbackTitle);\n"
              "}\n\n"
          )
          source = source[:start] + wrappers + source[end:]
          path.write_text(source)
          PY
      - name: Check syntax
        run: |
          node --check js/app.js
          node --check js/reader/import-parsers.js
      - name: Commit wiring
        run: |
          if git diff --quiet -- js/app.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "refactor: wire reader import parsers"
          git push origin HEAD:reader-refactor-clean
