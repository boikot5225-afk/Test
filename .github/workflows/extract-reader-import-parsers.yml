name: Extract reader import parsers

on:
  push:
    branches: [reader-refactor-clean]
    paths:
      - 'js/reader/import-parsers.js'
      - '.github/workflows/extract-reader-import-parsers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reader-refactor-clean
          fetch-depth: 0
      - name: Extract import parsers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          source = path.read_text()

          if "./reader/import-parsers.js" not in source:
              anchor = "import { renderHome } from './home.js';"
              replacement = "import { splitTextToChapters as readerImportSplitTextToChapters, splitSongToChapters as readerImportSplitSongToChapters } from './reader/import-parsers.js?v=1';\n" + anchor
              if anchor not in source:
                  raise RuntimeError('Import anchor missing')
              source = source.replace(anchor, replacement)

          start_marker = 'function readerSplitTextToChapters('
          end_marker = 'function readerBookProgress('
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise RuntimeError('Import parser block markers not found')

          replacement = """function readerSplitTextToChapters(rawText, fallbackTitle = 'Текст') {
  return readerImportSplitTextToChapters(rawText, fallbackTitle, readerChunkLongParagraph);
}

function readerSplitSongToChapters(rawText, fallbackTitle = 'Песня') {
  return readerImportSplitSongToChapters(rawText, fallbackTitle);
}

"""
          source = source[:start] + replacement + source[end:]
          path.write_text(source)
          PY
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/reader/import-parsers.js
      - name: Commit extracted app wiring
        run: |
          if git diff --quiet -- js/app.js; then
            echo "No app wiring changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "refactor: extract reader import parsers"
          git push origin HEAD:reader-refactor-clean
