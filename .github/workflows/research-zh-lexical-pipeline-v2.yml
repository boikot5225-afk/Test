name: Research Chinese lexical pipeline v2

on:
  push:
    branches:
      - feature/77.42-zh-lexical-pipeline-v2
    paths:
      - 'scripts/research-zh-lexical-pipeline-v2.py'
      - 'scripts/export_zh_jieba_rank_asset.py'
      - 'scripts/check-zh-lexical-pipeline-v2.mjs'
      - 'js/reader/zh-segment-v2.js'
      - 'js/reader/zh-lexical-trust.js'
      - 'data/zh_lexical_regressions.json'
      - '.github/workflows/research-zh-lexical-pipeline-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/77.42-zh-lexical-pipeline-v2

      - name: Validate and build the exact Migaku SQLite used by Android
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_zh_migaku_resources.py --self-test
          python3 scripts/build_zh_migaku_resources_v2.py --self-test
          python3 scripts/build_zh_migaku_sqlite.py --self-test
          mkdir -p android/app/src/main/assets/data
          python3 scripts/build_zh_migaku_sqlite.py \
            --output-dir android/app/src/main/assets/data \
            --cache-dir build/migaku-zh-cache
          test -s android/app/src/main/assets/data/zh_migaku.sqlite3

      - name: Export compact synchronous segmentation ranks
        run: |
          python3 scripts/export_zh_jieba_rank_asset.py \
            android/app/src/main/assets/data/zh_migaku.sqlite3 \
            android/app/src/main/assets/data/zh_jieba_top100k.txt \
            --limit 100000
          test -s android/app/src/main/assets/data/zh_jieba_top100k.txt

      - name: Gate shipped JS segmentation and trust policy
        run: node scripts/check-zh-lexical-pipeline-v2.mjs

      - name: Run broader Python research including FreeDict
        id: benchmark
        continue-on-error: true
        run: python3 scripts/research-zh-lexical-pipeline-v2.py

      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reader-AI-zh-lexical-pipeline-v2-research
          path: build/zh-lexical-pipeline-v2/
          if-no-files-found: warn
          retention-days: 30
