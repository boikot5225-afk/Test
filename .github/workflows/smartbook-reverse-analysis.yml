name: Smart Book reverse analysis

on:
  push:
    branches:
      - feature/smartbook-chinese-pinyin
    paths:
      - .github/workflows/smartbook-reverse-analysis.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Smart Book and JADX
        run: |
          mkdir -p build/input build/tools build/output
          curl --fail --location --retry 4 --retry-all-errors \
            --user-agent 'Mozilla/5.0 GitHub-Actions SmartBook-Analysis' \
            'https://smart-book.net/apk' \
            --output build/input/smartbook.apk
          curl --fail --location --retry 4 --retry-all-errors \
            'https://github.com/skylot/jadx/releases/download/v1.5.5/jadx-1.5.5.zip' \
            --output build/tools/jadx.zip
          unzip -q build/tools/jadx.zip -d build/tools/jadx
          chmod +x build/tools/jadx/bin/jadx
          test "$(stat -c%s build/input/smartbook.apk)" -gt 10000000

      - name: Decompile application code
        run: |
          build/tools/jadx/bin/jadx \
            --no-res \
            --threads-count 4 \
            --deobf \
            --deobf-min 2 \
            --deobf-max 64 \
            --show-bad-code \
            --comments-level debug \
            -d build/jadx \
            build/input/smartbook.apk \
            2>&1 | tee build/output/jadx.log

      - name: Collect reader and authorization sources
        run: |
          SRC=build/jadx/sources
          mkdir -p build/output/sources

          find "$SRC" -type f \( \
            -name '*ReaderText*.java' -o \
            -name '*ParagraphHolder*.java' -o \
            -name '*ReaderSpan*.java' -o \
            -name '*ReaderUIState*.java' -o \
            -name '*ChapterModel*.java' -o \
            -name 'GoogleAuth*.java' -o \
            -name 'GoogleAuthUseCaseImpl*.java' -o \
            -name 'AuthApi*.java' -o \
            -name 'LoginFragment*.java' -o \
            -name 'LoginViewModel*.java' -o \
            -name 'LoginUseCaseImpl*.java' -o \
            -name 'Profile*.java' \
          \) -print | sort -u > build/output/file-list.txt

          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            rel="${file#$SRC/}"
            mkdir -p "build/output/sources/$(dirname "$rel")"
            cp "$file" "build/output/sources/$rel"
          done < build/output/file-list.txt

          {
            echo '=== Reader references ==='
            grep -RInE 'ReaderText|ParagraphHolder|ReaderSpan|setText\(' "$SRC/com/kursx/smartbook" 2>/dev/null | head -700
            echo
            echo '=== Authorization references ==='
            grep -RInE 'GoogleAuth|GetGoogleIdOption|CredentialManager|serverClientId|googleusercontent|idToken|AuthApi|LoginUseCase|certificate|signature' "$SRC/com/kursx/smartbook" 2>/dev/null | head -1200
          } > build/output/references.txt

          sha256sum build/input/smartbook.apk > build/output/smartbook-sha256.txt
          tar -C build/output -czf build/SmartBook-Reverse-Analysis.tar.gz .

      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: SmartBook-Reverse-Analysis
          path: build/SmartBook-Reverse-Analysis.tar.gz
          retention-days: 7
          if-no-files-found: error

      - name: Record status
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          BRANCH="$GITHUB_REF_NAME"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          mkdir -p .ci-status
          jq -n \
            --arg status "$BUILD_STATUS" \
            --arg workflow_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg artifact_id "$ARTIFACT_ID" \
            --arg finished_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{status:$status,workflow_sha:$workflow_sha,run_id:$run_id,artifact_id:$artifact_id,finished_at:$finished_at}' \
            > .ci-status/smartbook-reverse-analysis.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci-status/smartbook-reverse-analysis.json
          git commit -m 'ci: record Smart Book reverse analysis status' || exit 0
          git push origin "HEAD:$BRANCH"
