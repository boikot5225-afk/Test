name: Wire chapter renderer

on:
  push:
    branches: [reader-refactor-clean]
    paths:
      - 'js/reader/chapter-render.js'
      - '.github/workflows/wire-reader-chapter-render.yml'

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reader-refactor-clean
          fetch-depth: 0
      - name: Wire chapter renderer into app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          source = path.read_text()

          import_anchor = "import { createReaderPinyinControls } from './reader/pinyin.js?v=1';"
          import_line = "import { createReaderChapterRenderer } from './reader/chapter-render.js?v=1';\n"
          if "./reader/chapter-render.js" not in source:
              if import_anchor not in source:
                  raise RuntimeError('Chapter renderer import anchor missing')
              source = source.replace(import_anchor, import_anchor + "\n" + import_line)

          start_marker = 'function renderReaderChapter() {'
          end_marker = 'function bindReaderSwipe() {'
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise RuntimeError('Chapter renderer block markers not found')

          replacement = (
              "const readerChapterRenderer = createReaderChapterRenderer({\n"
              "  getCurrentBook: readerCurrentBook,\n"
              "  getBookLang: readerBookLang,\n"
              "  canonicalLang: readerCanonicalLang,\n"
              "  ensureZhCoreLoaded: readerEnsureZhCoreJsonLoaded,\n"
              "  needsZhCoreLoad: () => !readerZhCoreJson && !readerZhCoreJsonPromise,\n"
              "  trackParagraphSeen: readerTrackParagraphIndexSeen,\n"
              "  getBookProgress: readerBookProgress,\n"
              "  langBadge: readerLangBadge,\n"
              "  getTranslationsHidden: () => readerTranslationsHidden,\n"
              "  updatePinyinButton: readerUpdatePinyinButton,\n"
              "  renderSongSection,\n"
              "  bindParagraphEvents: bindReaderParagraphEvents,\n"
              "  bindSongStropheEvents,\n"
              "  renderParagraphText: readerRenderParagraphText,\n"
              "  renderTranslationBlock: renderReaderTranslationBlock,\n"
              "  renderAnalysisBlock: renderReaderAnalysisBlock,\n"
              "  bindVisibleParagraphTracking: readerBindVisibleParagraphTracking,\n"
              "  saveBooks: saveReaderBooks,\n"
              "  schedulePrefetch: readerSchedulePrefetch,\n"
              "  openParagraphTimer: readerTimeParagraphOpen,\n"
              "});\n\n"
              "function renderReaderChapter() {\n"
              "  return readerChapterRenderer.render();\n"
              "}\n\n\n"
          )
          source = source[:start] + replacement + source[end:]
          path.write_text(source)
          PY
          node --check js/app.js
          node --check js/reader/chapter-render.js
      - name: Commit wiring
        shell: bash
        run: |
          if git diff --quiet -- js/app.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "refactor: wire reader chapter renderer"
          git push origin HEAD:reader-refactor-clean
