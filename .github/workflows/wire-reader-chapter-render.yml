name: Wire reader chapter renderer

on:
  push:
    branches: [reader-refactor-clean]
    paths:
      - 'js/reader/chapter-render.js'
      - '.github/workflows/wire-reader-chapter-render.yml'

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reader-refactor-clean
          fetch-depth: 0
      - name: Wire chapter renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          source = path.read_text()

          import_anchor = "import { createReaderPinyinControls } from './reader/pinyin.js?v=1';"
          import_line = "import { createReaderChapterRenderer } from './reader/chapter-render.js?v=1';\n"
          if "./reader/chapter-render.js" not in source:
              if import_anchor not in source:
                  raise RuntimeError('Chapter renderer import anchor missing')
              source = source.replace(import_anchor, import_anchor + '\n' + import_line)

          start_marker = 'function renderReaderChapter() {'
          end_marker = 'function bindReaderSwipe() {'
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise RuntimeError('Chapter renderer block markers not found')

          replacement = """const readerChapterRenderer = createReaderChapterRenderer({
  getCurrentBook: readerCurrentBook,
  getBookLang: readerBookLang,
  canonicalLang: readerCanonicalLang,
  ensureZhCoreLoaded: readerEnsureZhCoreJsonLoaded,
  needsZhCoreLoad: () => !readerZhCoreJson && !readerZhCoreJsonPromise,
  trackParagraphSeen: readerTrackParagraphIndexSeen,
  getBookProgress: readerBookProgress,
  langBadge: readerLangBadge,
  getTranslationsHidden: () => readerTranslationsHidden,
  updatePinyinButton: readerUpdatePinyinButton,
  renderSongSection,
  bindParagraphEvents: bindReaderParagraphEvents,
  bindSongStropheEvents,
  renderParagraphText: readerRenderParagraphText,
  renderTranslationBlock: renderReaderTranslationBlock,
  renderAnalysisBlock: renderReaderAnalysisBlock,
  bindVisibleParagraphTracking: readerBindVisibleParagraphTracking,
  saveBooks: saveReaderBooks,
  schedulePrefetch: readerSchedulePrefetch,
  openParagraphTimer: readerTimeParagraphOpen,
});

function renderReaderChapter() {
  return readerChapterRenderer.render();
}


"""
          source = source[:start] + replacement + source[end:]
          path.write_text(source)
          PY
      - name: Check syntax
        run: |
          node --check js/app.js
          node --check js/reader/chapter-render.js
      - name: Commit wiring
        run: |
          if git diff --quiet -- js/app.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "refactor: wire reader chapter renderer"
          git push origin HEAD:reader-refactor-clean
