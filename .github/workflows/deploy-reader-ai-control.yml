name: Deploy Reader AI control

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-reader-ai-french-da79a
  cancel-in-progress: false

jobs:
  deploy-reader-ai:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'deploy-readerAI-0061bac-20260724'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS }}
      GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY }}

    steps:
      - name: Checkout verified Reader AI fix
        uses: actions/checkout@v4
        with:
          ref: 0061bacb48356da56ac931ccdd071f81c7ad8bdb
          fetch-depth: 1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install and verify function
        run: |
          npm --prefix functions ci --ignore-scripts
          node --check functions/index.js
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const { resolveDeepSeekModel } = require('./functions/deepseek-model');
          assert.equal(resolveDeepSeekModel(), 'deepseek-v4-flash');
          assert.equal(resolveDeepSeekModel('deepseek-chat'), 'deepseek-v4-flash');
          assert.equal(resolveDeepSeekModel('deepseek-reasoner'), 'deepseek-v4-flash');
          assert.equal(resolveDeepSeekModel('deepseek-v4-pro'), 'deepseek-v4-pro');
          NODE

      - name: Select deployment credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${FIREBASE_TOKEN}" ]]; then
            echo "FIREBASE_AUTH_MODE=token" >> "${GITHUB_ENV}"
            exit 0
          fi

          credentials="${FIREBASE_SERVICE_ACCOUNT_JSON}"
          [[ -n "${credentials}" ]] || credentials="${GOOGLE_CREDENTIALS_JSON}"
          [[ -n "${credentials}" ]] || credentials="${GCP_SA_KEY_JSON}"

          if [[ -z "${credentials}" ]]; then
            echo "::error::No Firebase deployment credential is configured in repository secrets."
            exit 1
          fi

          credentials_file="${RUNNER_TEMP}/firebase-service-account.json"
          printf '%s' "${credentials}" > "${credentials_file}"
          chmod 600 "${credentials_file}"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${credentials_file}" >> "${GITHUB_ENV}"
          echo "FIREBASE_AUTH_MODE=adc" >> "${GITHUB_ENV}"

      - name: Prepare Firebase CLI without Service Usage preflight
        shell: bash
        run: |
          set -euo pipefail
          cli_root="${RUNNER_TEMP}/firebase-cli"
          npm --prefix "${cli_root}" install --no-save --ignore-scripts firebase-tools@15.24.0
          check_file="${cli_root}/node_modules/firebase-tools/lib/ensureApiEnabled.js"
          python3 - "${check_file}" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text()
          marker = "async function check(projectId, apiUri, prefix, silent = false) {\n"
          replacement = marker + '    if (process.env.FIREBASE_ASSUME_APIS_ENABLED === "1") return true;\n'
          if replacement not in source:
              if marker not in source:
                  raise SystemExit("Firebase CLI API-check marker not found")
              source = source.replace(marker, replacement, 1)
              path.write_text(source)
          PY
          node "${cli_root}/node_modules/firebase-tools/lib/bin/firebase.js" --version

      - name: Deploy only readerAI
        id: deploy
        shell: bash
        env:
          FIREBASE_ASSUME_APIS_ENABLED: '1'
        run: |
          set -euo pipefail
          firebase_cli="${RUNNER_TEMP}/firebase-cli/node_modules/firebase-tools/lib/bin/firebase.js"
          if [[ "${FIREBASE_AUTH_MODE}" == "token" ]]; then
            node "${firebase_cli}" deploy \
              --only functions:readerAI \
              --project french-da79a \
              --token "${FIREBASE_TOKEN}" \
              --non-interactive
          else
            node "${firebase_cli}" deploy \
              --only functions:readerAI \
              --project french-da79a \
              --non-interactive
          fi

      - name: Report deployment result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        shell: bash
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "${DEPLOY_OUTCOME}" == "success" ]]; then
            gh issue comment "${{ github.event.issue.number }}" --body "DEPLOY_OK readerAI 0061bac ${run_url}"
          else
            gh issue comment "${{ github.event.issue.number }}" --body "DEPLOY_FAILED readerAI 0061bac ${run_url}"
            exit 1
          fi
