name: Reader paragraph render regression

on:
  push:
    branches:
      - feature/77.42-epub-toc
    paths:
      - 'js/reader/chapter-render-next.js'
      - 'js/reader/interactions.js'
      - 'js/reader/interactions-runtime.js'
      - 'js/reader/en-unknown-gloss-v2.js'
      - 'js/reader/en-unknown-gloss-full-fallback.js'
      - 'js/reader/zh-unknown-gloss-v4.js'
      - 'js/reader/zh-unknown-interlinear.js'
      - 'js/reader/zh-unknown-gloss.js'
      - 'scripts/check-reader-paragraph-help-render.mjs'
      - 'scripts/check-reader-paragraph-help-runtime.mjs'
      - 'scripts/check-reader-paragraph-tap-selection.mjs'
      - 'scripts/check-reader-zh-unknown-gloss.mjs'
      - '.github/workflows/reader-paragraph-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  same-active-translation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check same-active paragraph translation guard
        run: node scripts/check-reader-paragraph-help-render.mjs
      - name: Exercise same-active paragraph translation runtime
        run: node scripts/check-reader-paragraph-help-runtime.mjs
      - name: Check paragraph tap selection
        run: node scripts/check-reader-paragraph-tap-selection.mjs
      - name: Check optional Chinese unknown-word gloss mode
        run: node scripts/check-reader-zh-unknown-gloss.mjs
