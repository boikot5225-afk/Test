<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>An II — Firebase test</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#111;color:#eee;margin:0;padding:24px;line-height:1.5}
    .card{max-width:820px;margin:0 auto;background:#1b1b1f;border:1px solid #333;border-radius:16px;padding:20px}
    button{background:#a62a21;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;margin:4px 6px 4px 0}
    button:disabled{opacity:.6;cursor:wait}
    input{background:#0b0b0d;border:1px solid #333;border-radius:10px;color:#eee;padding:10px 12px;margin:4px 6px 4px 0;min-width:220px}
    pre{background:#0b0b0d;border:1px solid #333;border-radius:12px;padding:14px;overflow:auto;white-space:pre-wrap}
    .ok{color:#7ad68a}.bad{color:#ff7b72}.warn{color:#ffd166}.muted{color:#aaa}
    .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
  </style>
  <script src="js/firebase-config.js?v=28.0-dict-tools"></script>
  <script type="module" src="js/firebase-sdk-loader.js?v=2"></script>
</head>
<body>
  <div class="card">
    <h1>Firebase smoke test</h1>
    <p class="muted">Проверяет тот же способ загрузки Auth и Database, что используется в ветке reader-refactor-clean.</p>
    <div class="row">
      <input id="email" type="email" placeholder="email Firebase">
      <input id="password" type="password" placeholder="пароль">
      <button id="loginBtn">Войти</button>
      <button id="registerBtn">Создать тест-аккаунт</button>
      <button id="progressBtn">Проверить запись прогресса</button>
      <button id="logoutBtn">Выйти</button>
      <button id="checkBtn">Проверить Firebase</button>
    </div>
    <pre id="out">Страница ждёт Firebase bootstrap…</pre>
  </div>
  <script>
    const out = document.getElementById('out');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const buttons = [...document.querySelectorAll('button')];
    const line = (text, cls = '') => { out.innerHTML += (cls ? `<span class="${cls}">${String(text).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</span>` : String(text)) + '\n'; };
    const reset = () => { out.textContent = ''; };

    function explain(error) {
      const code = String(error?.code || '').toLowerCase();
      if (code.includes('operation-not-allowed')) return 'Email/Password выключен в Firebase Authentication.';
      if (code.includes('configuration-not-found')) return 'Firebase Authentication не настроен.';
      if (code.includes('unauthorized-domain')) return 'Текущий домен не добавлен в Authorized domains.';
      if (code.includes('network-request-failed')) return 'Сеть блокирует и Firebase SDK, и Firebase Auth REST.';
      return error?.message || String(error);
    }

    async function ready() {
      const end = Date.now() + 16000;
      while (Date.now() < end) {
        if (window.firebase && typeof firebase.auth === 'function' && typeof firebase.database === 'function') return { auth: firebase.auth(), db: firebase.database() };
        await new Promise(resolve => setTimeout(resolve, 100));
      }
      throw new Error('Firebase Auth и Database не поднялись за 16 секунд. Открой консоль: там будет причина загрузки CDN/REST.');
    }

    async function withUi(button, task) {
      button.disabled = true;
      try { await task(); }
      catch (error) { line('✗ ' + (error?.code || '') + ' ' + explain(error), 'bad'); }
      finally { button.disabled = false; }
    }

    document.getElementById('checkBtn').onclick = () => withUi(document.getElementById('checkBtn'), async () => {
      reset();
      const { auth, db } = await ready();
      line('✓ Firebase готов', 'ok');
      line('SDK: ' + (firebase.__an2RestFallback ? 'REST fallback' : 'compat SDK'), 'ok');
      line('databaseURL: ' + window.FIREBASE_CONFIG.databaseURL);
      line(auth.currentUser ? `✓ Уже вошёл: ${auth.currentUser.email || auth.currentUser.uid}` : '⚠ Сессии нет', auth.currentUser ? 'ok' : 'warn');
      const snap = await db.ref('.info/connected').get();
      line('✓ Realtime Database ответил: ' + String(snap.val()), 'ok');
    });

    document.getElementById('loginBtn').onclick = () => withUi(document.getElementById('loginBtn'), async () => {
      reset();
      const { auth } = await ready();
      const cred = await auth.signInWithEmailAndPassword(email.value.trim(), password.value);
      line('✓ Вход выполнен', 'ok');
      line('UID: ' + cred.user.uid, 'ok');
    });

    document.getElementById('registerBtn').onclick = () => withUi(document.getElementById('registerBtn'), async () => {
      reset();
      const { auth, db } = await ready();
      const cred = await auth.createUserWithEmailAndPassword(email.value.trim(), password.value);
      await cred.user.getIdToken(true);
      await db.ref('profiles/' + cred.user.uid).update({ id: cred.user.uid, email: cred.user.email || email.value.trim(), updated_at: new Date().toISOString() });
      line('✓ Аккаунт создан и профиль записан', 'ok');
      line('UID: ' + cred.user.uid, 'ok');
    });

    document.getElementById('progressBtn').onclick = () => withUi(document.getElementById('progressBtn'), async () => {
      reset();
      const { auth, db } = await ready();
      const user = auth.currentUser;
      if (!user) throw new Error('Сначала войди.');
      await user.getIdToken(true);
      const now = new Date().toISOString();
      await db.ref().update({
        ['stats/' + user.uid + '/_smoke']: { total: 1, correct: 1, updated_at: now },
        ['srs/' + user.uid + '/_smoke']: { interval: 1, repetitions: 1, updated_at: now },
        ['meta/' + user.uid + '/_smoke_last']: now,
      });
      line('✓ Запись прогресса работает', 'ok');
    });

    document.getElementById('logoutBtn').onclick = () => withUi(document.getElementById('logoutBtn'), async () => {
      reset();
      const { auth } = await ready();
      await auth.signOut();
      line('✓ Вышел', 'ok');
    });

    window.addEventListener('load', async () => {
      try {
        const { auth } = await ready();
        reset();
        line('✓ Firebase bootstrap готов', 'ok');
        line('Источник: ' + (firebase.__an2RestFallback ? 'REST fallback' : 'compat SDK'), 'ok');
        line(auth.currentUser ? '✓ Сессия восстановлена' : '⚠ Войди для проверки Auth', auth.currentUser ? 'ok' : 'warn');
      } catch (error) {
        reset();
        line('✗ ' + explain(error), 'bad');
      }
    });
  </script>
</body>
</html>
