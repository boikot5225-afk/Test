<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Firebase / OpenRouter TTS — An II</title>
  <script src="js/firebase-config.js?v=68.32-firebase-tts"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
</head>
<body style="font-family:system-ui,sans-serif;max-width:720px;margin:0 auto;padding:24px;background:#15130f;color:#eee">
  <h2 style="margin-top:0">☁️ Firebase / OpenRouter TTS — проверка</h2>
  <p style="color:#b7afa3">Тест идёт через Firebase Cloud Function <code>ttsAudio</code>. Ключ OpenRouter остаётся на сервере. Перед тестом войди в основное приложение на этом же домене.</p>
  <label style="display:block;margin:14px 0 6px">Язык</label>
  <select id="lang" style="padding:10px;width:100%;border-radius:8px">
    <option value="fr">Français</option>
    <option value="zh">中文</option>
  </select>
  <label style="display:block;margin:14px 0 6px">Текст</label>
  <textarea id="text" rows="4" style="width:100%;box-sizing:border-box;padding:10px;border-radius:8px">Bonjour. Je lis un roman français.</textarea>
  <button id="play" style="margin-top:14px;padding:12px 18px;border-radius:8px;border:0;background:#a62a21;color:#fff;font-weight:700">▶ Проверить Firebase TTS</button>
  <pre id="log" style="white-space:pre-wrap;word-break:break-word;background:#242019;padding:14px;margin-top:16px;border-radius:8px;color:#d7d0c4"></pre>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const log = (m) => { $('log').textContent += `${m}\n`; };
  const cfg = window.FIREBASE_CONFIG;
  if (!window.firebase.apps.length) window.firebase.initializeApp(cfg);
  const auth = window.firebase.auth();
  const region = window.AN2_FIREBASE_FUNCTIONS_REGION || 'asia-southeast1';
  const URL_FN = `https://${region}-${cfg.projectId}.cloudfunctions.net/ttsAudio`;
  let ctx = null;
  let unlocked = false;

  function primeAudio() {
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtor) throw new Error('Web Audio не поддерживается браузером');
    if (!ctx) ctx = new AudioCtor();
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    if (!unlocked) {
      const s = ctx.createBufferSource();
      s.buffer = ctx.createBuffer(1, 1, 22050);
      s.connect(ctx.destination);
      s.start(0);
      unlocked = true;
    }
  }

  async function currentUser() {
    if (auth.currentUser) return auth.currentUser;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error('Нет Firebase-сессии. Сначала войди в приложение.')), 7000);
      const off = auth.onAuthStateChanged((user) => {
        if (!user) return;
        clearTimeout(timer); off(); resolve(user);
      });
    });
  }

  async function playBuffer(buffer) {
    if (ctx.state === 'suspended') await ctx.resume();
    const audioBuffer = await ctx.decodeAudioData(buffer.slice(0));
    const source = ctx.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(ctx.destination);
    source.start(0);
  }

  $('play').addEventListener('pointerdown', () => { try { primeAudio(); } catch (_) {} }, { passive:true });
  $('play').onclick = async () => {
    $('log').textContent = '';
    try {
      primeAudio();
      const text = $('text').value.trim();
      const lang = $('lang').value;
      if (!text) return;
      $('play').disabled = true;
      const user = await currentUser();
      const token = await user.getIdToken(false);
      log(`Отправляю ${lang.toUpperCase()} в Firebase /ttsAudio…`);
      const r = await fetch(URL_FN, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ text, lang, speed: lang === 'zh' ? 0.92 : 0.9 }),
      });
      log(`HTTP: ${r.status}`);
      log(`Content-Type: ${r.headers.get('content-type') || 'не указан'}`);
      log(`Voice: ${r.headers.get('x-tts-voice') || 'не сообщён'}`);
      log(`Lang: ${r.headers.get('x-tts-lang') || 'не сообщён'}`);
      if (!r.ok) throw new Error((await r.text()).slice(0, 800) || `HTTP ${r.status}`);
      const buf = await r.arrayBuffer();
      log(`Аудио: ${buf.byteLength} байт`);
      if (buf.byteLength < 200) throw new Error('Аудио пустое');
      await playBuffer(buf);
      log('✓ Воспроизведение началось');
    } catch (error) {
      log(`✗ ${error?.message || error}`);
    } finally {
      $('play').disabled = false;
    }
  };
  $('lang').onchange = (e) => {
    $('log').textContent = 'Выбран другой язык. Нажми «Проверить Firebase TTS».\n';
    $('text').value = e.target.value === 'zh' ? '你好，我正在读一本中文小说。' : 'Bonjour. Je lis un roman français.';
  };
})();
</script>
</body>
</html>
