plugins {
    id 'com.android.application'
}

// Android refuses to install a package over one signed by a different key, and
// the debug keystore Gradle generates when none exists is created fresh on
// every machine — so each CI run produced an APK that could not replace the
// previous one. A keystore handed in through the environment keeps the
// signature identical across builds and machines; without it the build still
// works and falls back to the local debug key, which is fine for one machine
// but not across runners.
// Only the keystore file is a secret. Its password and alias protect that file
// and are worthless without it, so they carry defaults here — which reduces the
// setup to storing one value instead of four.
def sharedKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def sharedKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: 'readerai2026'
def sharedKeyAlias = System.getenv('ANDROID_KEY_ALIAS') ?: 'reader-ai'
def sharedKeyPassword = System.getenv('ANDROID_KEY_PASSWORD') ?: sharedKeystorePassword
def hasSharedKeystore = sharedKeystorePath && file(sharedKeystorePath).exists()

android {
    namespace 'space.saintjust.reader.stage1'
    compileSdk 35

    defaultConfig {
        applicationId 'space.saintjust.reader.semanticstage1clean.formatfix'
        minSdk 24
        targetSdk 35
        versionCode 57
        versionName '77.42-toc37'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (hasSharedKeystore) {
            shared {
                storeFile file(sharedKeystorePath)
                storePassword sharedKeystorePassword
                keyAlias sharedKeyAlias
                keyPassword sharedKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            if (hasSharedKeystore) signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSharedKeystore) signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The web app is the repository root; syncWebAssets stages a copy of it here.
    sourceSets {
        main {
            assets.srcDirs += [layout.buildDirectory.dir('generated/webAssets').get().asFile]
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

// Migaku-style vocabulary estimation needs a real frequency rank, not a fake
// HSK-level shortcut. Keep the large upstream dataset out of the repository and
// generate a tiny [word, rank] index into build/ from a pinned MIT-licensed
// source. Because the commit is pinned, an upstream update cannot silently
// change somebody's estimated vocabulary between Reader AI builds.
def zhFrequencySourceCommit = '7ac65bf1a6387d35f1ade478906172a19311c7f9'
def zhFrequencySourceUrl = "https://raw.githubusercontent.com/drkameleon/complete-hsk-vocabulary/${zhFrequencySourceCommit}/complete.min.json"
def generatedReaderDataDir = layout.buildDirectory.dir('generated/readerData')
def generatedZhFrequencyFile = generatedReaderDataDir.map { it.file('zh_vocab_frequency.json') }

tasks.register('prepareZhVocabularyFrequency') {
    outputs.file(generatedZhFrequencyFile)
    doLast {
        def output = generatedZhFrequencyFile.get().asFile
        output.parentFile.mkdirs()

        def connection = new URI(zhFrequencySourceUrl).toURL().openConnection()
        connection.connectTimeout = 20000
        connection.readTimeout = 90000
        connection.setRequestProperty('User-Agent', 'ReaderAI-Android-build')

        def payload
        connection.inputStream.withCloseable { stream ->
            payload = new groovy.json.JsonSlurper().parseText(stream.getText('UTF-8'))
        }
        def rows = payload instanceof List ? payload : (payload?.words instanceof List ? payload.words : [])
        def byWord = [:]
        rows.each { row ->
            if (!(row instanceof Map)) return
            def word = (row.s ?: row.simplified ?: '').toString().trim()
            def rankRaw = row.q != null ? row.q : row.frequency
            if (!word || !(rankRaw instanceof Number)) return
            int rank = rankRaw.intValue()
            if (rank <= 0) return
            if (!byWord.containsKey(word) || rank < (byWord[word] as int)) byWord[word] = rank
        }

        def entries = byWord.collect { word, rank -> [word, rank] }
            .sort { a, b -> (a[1] as int) <=> (b[1] as int) }
        if (entries.size() < 5000) {
            throw new GradleException("Chinese frequency index is unexpectedly small: ${entries.size()} entries")
        }

        def slim = [
            version: 1,
            source: "drkameleon/complete-hsk-vocabulary@${zhFrequencySourceCommit}",
            license: 'MIT',
            entries: entries,
        ]
        output.setText(groovy.json.JsonOutput.toJson(slim), 'UTF-8')
        logger.lifecycle("Reader AI Chinese frequency index: ${entries.size()} words -> ${output}")
    }
}

/**
 * Copies the web app (repository root) into the APK's assets/www.
 *
 * The repository root is the single source of truth — the same tree is what
 * Firebase Hosting serves. Only the parts that a phone actually runs are
 * staged here; server-side code, build tooling and the dev preview pages stay in
 * the repository but never reach the APK.
 */
tasks.register('syncWebAssets', Sync) {
    dependsOn 'prepareZhVocabularyFrequency'

    from(rootProject.projectDir.parentFile) {
        // Not part of the web app at all.
        exclude '.git/**'
        exclude '.github/**'
        exclude 'android/**'
        exclude '**/node_modules/**'
        exclude '**/.DS_Store'

        // Server side: Cloud Functions, Supabase edge functions, DB rules,
        // and the self-hosted TTS container.
        exclude 'functions/**'
        exclude 'supabase/**'
        exclude 'firebase/**'
        exclude 'selfhost/**'
        exclude 'firebase.json'

        // Developer tooling and scratch pages — reachable only by typing the
        // path by hand, so they are dead weight on a phone. Drop a line from
        // this list to ship one of them again.
        exclude 'scripts/**'
        exclude 'make_zh_dict.js'
        exclude 'design-preview.html'
        exclude 'pagination-preview.html'
        exclude 'firebase-import.html'
        exclude 'firebase-test.html'
        exclude 'tts-test.html'
        exclude 'FIREBASE_*.txt'
        exclude 'SUPABASE_*.txt'

        // Legacy duplicate of js/app.js, ~430 KB and referenced by nothing:
        // the ./app.js imports in js/ resolve to js/app.js. Anchored to the
        // root, since a bare 'app.js' pattern would also match js/app.js.
        exclude { it.relativePath.toString() == 'app.js' }
    }
    from(generatedReaderDataDir) {
        into 'data'
    }
    into layout.buildDirectory.dir('generated/webAssets/www')
}

tasks.named('preBuild') {
    dependsOn 'syncWebAssets'
}
