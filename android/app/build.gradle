plugins {
    id 'com.android.application'
}

// Android refuses to install a package over one signed by a different key, and
// the debug keystore Gradle generates when none exists is created fresh on
// every machine — so each CI run produced an APK that could not replace the
// previous one. A keystore handed in through the environment keeps the
// signature identical across builds and machines; without it the build still
// works and falls back to the local debug key, which is fine for one machine
// but not across runners.
// Only the keystore file is a secret. Its password and alias protect that file
// and are worthless without it, so they carry defaults here — which reduces the
// setup to storing one value instead of four.
def sharedKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def sharedKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: 'readerai2026'
def sharedKeyAlias = System.getenv('ANDROID_KEY_ALIAS') ?: 'reader-ai'
def sharedKeyPassword = System.getenv('ANDROID_KEY_PASSWORD') ?: sharedKeystorePassword
def hasSharedKeystore = sharedKeystorePath && file(sharedKeystorePath).exists()

def repoRoot = rootProject.projectDir.parentFile
def wikdictRawFile = layout.buildDirectory.file('wikdict/en-ru.sqlite3')
def wikdictAssetDir = layout.buildDirectory.dir('generated/wikdictAssets')
def wikdictCoreFile = layout.buildDirectory.file('generated/wikdictAssets/wikdict/en_ru_core.sqlite3')
def wikdictCoreJsonFile = layout.buildDirectory.file('generated/wikdictAssets/wikdict/en_ru_core.json')
def wikdictUrl = 'https://download.wikdict.com/dictionaries/sqlite/2_2026-06/en-ru.sqlite3'

android {
    namespace 'space.saintjust.reader.stage1'
    compileSdk 35

    defaultConfig {
        applicationId 'space.saintjust.reader.semanticstage1clean.formatfix'
        minSdk 24
        targetSdk 35
        versionCode 102
        versionName '77.42-toc82'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (hasSharedKeystore) {
            shared {
                storeFile file(sharedKeystorePath)
                storePassword sharedKeystorePassword
                keyAlias sharedKeyAlias
                keyPassword sharedKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            if (hasSharedKeystore) signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSharedKeystore) signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs += [
                    layout.buildDirectory.dir('generated/webAssets').get().asFile,
                    wikdictAssetDir.get().asFile,
            ]
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    // Only used as the last-resort EN→RU fallback for Unknown words missing
    // from the bundled 95k-entry WikDict. Most page glosses never touch ML Kit.
    implementation 'com.google.mlkit:translate:17.0.3'
}

tasks.register('syncWebAssets', Sync) {
    from(repoRoot) {
        exclude '.git/**'
        exclude '.github/**'
        exclude 'android/**'
        exclude '**/node_modules/**'
        exclude '**/.DS_Store'
        exclude 'functions/**'
        exclude 'supabase/**'
        exclude 'firebase/**'
        exclude 'selfhost/**'
        exclude 'firebase.json'
        exclude 'scripts/**'
        exclude 'make_zh_dict.js'
        exclude 'design-preview.html'
        exclude 'pagination-preview.html'
        exclude 'firebase-import.html'
        exclude 'firebase-test.html'
        exclude 'tts-test.html'
        exclude 'FIREBASE_*.txt'
        exclude 'SUPABASE_*.txt'
        exclude { it.relativePath.toString() == 'app.js' }
    }
    into layout.buildDirectory.dir('generated/webAssets/www')
}

tasks.register('prepareEnRuWikDict') {
    inputs.file(new File(repoRoot, 'data/en_vocab_frequency.tsv'))
    inputs.file(new File(repoRoot, 'data/en_vocab_lemma.tsv'))
    inputs.file(new File(repoRoot, 'scripts/build_en_ru_wikdict_core.py'))
    inputs.file(new File(repoRoot, 'scripts/export_en_ru_wikdict_json.py'))
    outputs.file(wikdictCoreFile)
    outputs.file(wikdictCoreJsonFile)

    doLast {
        File raw = wikdictRawFile.get().asFile
        File output = wikdictCoreFile.get().asFile
        File jsonOutput = wikdictCoreJsonFile.get().asFile
        raw.parentFile.mkdirs()
        output.parentFile.mkdirs()
        jsonOutput.parentFile.mkdirs()

        if (!raw.exists() || raw.length() < 5_000_000L) {
            logger.lifecycle("Downloading WikDict EN-RU source…")
            URL url = new URI(wikdictUrl).toURL()
            url.openConnection().with { connection ->
                connection.connectTimeout = 20_000
                connection.readTimeout = 120_000
                connection.inputStream.withCloseable { input ->
                    raw.withOutputStream { out -> out << input }
                }
            }
        }

        // Keep the compact SQLite for the old native bridge as a compatibility
        // fallback, but the active English inline-gloss layer no longer depends
        // on it.
        exec {
            commandLine 'python3',
                    new File(repoRoot, 'scripts/build_en_ru_wikdict_core.py').absolutePath,
                    raw.absolutePath,
                    new File(repoRoot, 'data/en_vocab_frequency.tsv').absolutePath,
                    new File(repoRoot, 'data/en_vocab_lemma.tsv').absolutePath,
                    output.absolutePath
        }

        // Export JSON from the FULL WikDict source, not from the compact
        // frequency-list subset. Unranked/proper/compound Unknown words therefore
        // still have a chance to receive a Russian gloss.
        exec {
            commandLine 'python3',
                    new File(repoRoot, 'scripts/export_en_ru_wikdict_json.py').absolutePath,
                    raw.absolutePath,
                    jsonOutput.absolutePath
        }
    }
}

tasks.named('preBuild') {
    dependsOn 'syncWebAssets'
    dependsOn 'prepareEnRuWikDict'
}
