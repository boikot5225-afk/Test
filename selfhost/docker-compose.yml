services:
  tts-stt:
    build: ./server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"  # bound to localhost only — nginx (or ufw) fronts it, see README
    environment:
      - SELFHOST_TOKEN=${SELFHOST_TOKEN}
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-base}
    # ~6GB RAM on the box (~3.8GB actually free), and this one container holds
    # both models resident: faster-whisper medium int8 peaks around 1.2-1.4GB
    # and Kokoro adds ~0.5GB on top, so the old 1400m cap could not fit medium
    # at all. 3g leaves the OS, nginx and the VPN process their ~800MB and
    # still stops one bad request from ballooning into the host. There is no
    # swap, so hitting this limit is an instant OOM kill, not a slowdown.
    mem_limit: 3g
